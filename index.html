                     await db.from('results').delete().eq('id', id);
                     fetchSupabaseData();
                 } catch(e) { alert("Gagal menghapus: " + e.message); }
             };

             return (
               <AdminLayout title="Hasil Ujian">
                 <div className="mb-4 flex justify-end">
                     <button onClick={fetchSupabaseData} className="bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2.5 rounded-lg text-sm font-bold flex items-center hover:bg-blue-100 transition-colors shadow-sm">
                         <i className="fas fa-sync-alt mr-2"></i> Refresh Data
                     </button>
                 </div>

                 {selectedAnalysis && (
                    <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col">
                            <div className="bg-slate-50 border-b px-5 py-4 flex justify-between items-center"><h3 className="font-bold">Analisis: {selectedAnalysis.participant?.name}</h3><button onClick={() => setSelectedAnalysis(null)}><X size={18}/></button></div>
                            <div className="p-5 overflow-y-auto flex-1">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-100 border-b"><tr><th className="p-3">No</th><th className="p-3">Pertanyaan</th><th className="p-3 text-center">Status</th></tr></thead>
                                    <tbody>
                                        {questions.map((q, i) => {
                                            const details = Array.isArray(selectedAnalysis.detail?.detailedResults) ? selectedAnalysis.detail.detailedResults : [];
                                            const d = details.find(x => x.qId === q.id);
                                            return (
                                                <tr key={q.id} className="border-b">
                                                    <td className="p-3">{i + 1}</td>
                                                    <td className="p-3 truncate max-w-xs">{q.question?.replace(/<[^>]+>/g, '')}</td>
                                                    <td className="p-3 text-center font-bold">
                                                        {d?.isEmpty ? <span className="text-amber-500">KOSONG</span> : d?.isCorrect ? <span className="text-emerald-600">BENAR</span> : <span className="text-rose-600">SALAH</span>}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                 )}
                 <div className="bg-white rounded-xl border overflow-x-auto shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b"><tr><th className="p-4">Nama</th><th className="p-4">Sekolah</th><th className="p-4 text-center">Nilai</th><th className="p-4 text-center">Analisis</th><th className="p-4 text-center">Aksi</th></tr></thead>
                        <tbody>
                            {results.map((r)=><tr key={r.id} className="border-b hover:bg-slate-50 transition-colors">
                                <td className="p-4 font-medium text-slate-800">{r.participant?.name}</td>
                                <td className="p-4 text-slate-600">{r.participant?.school}</td>
                                <td className="p-4 text-center font-black text-emerald-600 text-base">{r.score}</td>
                                <td className="p-4 text-center"><button onClick={() => setSelectedAnalysis(r)} className="text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-100">Lihat Detail</button></td>
                                <td className="p-4 text-center"><button onClick={() => deleteResult(r.id)} className="text-rose-500 hover:bg-rose-50 p-2 rounded-lg" title="Hapus Hasil"><Trash2 size={16}/></button></td>
                            </tr>)}
                            {results.length === 0 && <tr><td colSpan="5" className="text-center p-8 text-slate-500 font-bold bg-slate-50">Belum ada data hasil ujian yang masuk.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminQuestions = () => {
            const [isSaving, setIsSaving] = useState(false);
            const [view, setView] = useState('folders'); 
            const [filterFolder, setFilterFolder] = useState('Utama');
            const [showImport, setShowImport] = useState(false);
            const [fileError, setFileError] = useState('');

            const defaultMCQ = { id: '', type: 'MCQ', folder: filterFolder, points: 1, question: '', options: [{id:'A', text:''}, {id:'B', text:''}, {id:'C', text:''}, {id:'D', text:''}], correctAnswer: 'A' };
            const defaultMCMA = { id: '', type: 'MCMA', folder: filterFolder, points: 1, question: '', statements: [{id:1, text:''}, {id:2, text:''}], correctAnswers: [] };
            const defaultCAT = { id: '', type: 'CATEGORY', folder: filterFolder, points: 1, question: '', statements: [{id:1, text:'', category1:'Benar', category2:'Salah', correctCategory:'Benar'}] };
            
            const [formData, setFormData] = useState(defaultMCQ);

            const downloadTemplate = () => {
                const csvContent = "Mapel,Pertanyaan,Opsi A,Opsi B,Opsi C,Opsi D,Kunci\nBahasa Indonesia,Ibu kota Indonesia adalah?,Jakarta,Bandung,Surabaya,Medan,A\n";
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' })));
                link.setAttribute("download", "Template_Bank_Soal.csv");
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const handleUploadSoal = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const lines = event.target.result.split('\n').filter(l => l.trim() !== '');
                    const payloads = [];
                    for (let i = (lines[0].toLowerCase().includes('mapel') ? 1 : 0); i < lines.length; i++) {
                        const cols = lines[i].split(',');
                        if (cols.length >= 7) {
                            payloads.push({
                                id: `q${Date.now()}_${i}`,
                                type: 'MCQ',
                                folder: filterFolder,
                                points: 1,
                                question: cols[1].replace(/["\r]/g, '').trim(),
                                options: [
                                    { id: 'A', text: cols[2].replace(/["\r]/g, '').trim() },
                                    { id: 'B', text: cols[3].replace(/["\r]/g, '').trim() },
                                    { id: 'C', text: cols[4].replace(/["\r]/g, '').trim() },
                                    { id: 'D', text: cols[5].replace(/["\r]/g, '').trim() }
                                ],
                                correctAnswer: cols[6].replace(/["\r]/g, '').trim().toUpperCase()
                            });
                        }
                    }
                    if (payloads.length === 0) { setFileError('Format salah.'); return; }
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        const { error } = await db.from('questions').insert(payloads);
                        if (error) throw error;
                        setShowImport(false); fetchSupabaseData(); alert('Soal berhasil diimpor!');
                    } catch(err) { alert("Gagal impor ke database!\nPastikan tabel 'questions' memiliki kolom 'correctAnswer'.\nError: " + err.message); }
                    finally { setIsSaving(false); }
                };
                reader.readAsText(file);
            };

            const saveQuestion = async (e) => {
               e.preventDefault();
               setIsSaving(true);
               try {
                 const db = await getSupabase();
                 
                 let payload = { 
                    id: formData.id || `q${Date.now()}`,
                    type: formData.type,
                    folder: formData.folder || filterFolder,
                    points: formData.points,
                    question: formData.question
                 };

                 if (formData.type === 'MCQ') {
                     payload.options = formData.options;
                     payload.correctAnswer = formData.correctAnswer;
                 } else if (formData.type === 'MCMA') {
                     payload.statements = formData.statements;
                     payload.correctAnswers = formData.correctAnswers;
                 } else if (formData.type === 'CATEGORY') {
                     payload.statements = formData.statements;
                 }

                 if(!formData.id) { 
                    // Membuat soal baru
                    const { error } = await db.from('questions').insert([payload]);
                    if (error) throw error;
                    
                    // STRATEGI PENTING: Update formData dengan ID baru agar klik simpan berikutnya dihitung sebagai "Edit" (Update), bukan buat baru (Insert).
                    setFormData(prev => ({...prev, id: payload.id}));
                 } else { 
                    // Memperbarui soal yang sudah ada
                    const { error } = await db.from('questions').update(payload).eq('id', payload.id);
                    if (error) throw error;
                 }
                 
                 await fetchSupabaseData(); 
                 
                 // KUNCI UX: Kunci filter folder tetap pada tempatnya, tapi hilangkan setView('list') agar tidak terlempar keluar.
                 setFilterFolder(payload.folder);
                 
                 alert("Soal berhasil disimpan! Anda dapat melanjutkan pengeditan.");
                 
               } catch (err) { 
                 alert("GAGAL MENYIMPAN KE DATABASE!\n" + err.message); 
               } finally { 
                 setIsSaving(false); 
               }
            };
            const deleteQuestion = async (id) => {
                if(!confirm("Hapus soal ini?")) return;
                try { 
                    const db = await getSupabase(); 
                    const { error } = await db.from('questions').delete().eq('id', id); 
                    if (error) throw error;
                    
                    await fetchSupabaseData(); 
                    
                    setView('list');
                } catch(e) { alert("Gagal menghapus dari database: " + e.message); }
            };

            const duplicateQuestion = async (q) => {
                if(!confirm("Duplikasi soal ini?")) return;
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const duplicatedQ = { ...q, id: `q${Date.now()}_copy` };
                    const { error } = await db.from('questions').insert([duplicatedQ]);
                    if (error) throw error;
                    
                    await fetchSupabaseData(); 
                    
                    setFilterFolder(q.folder || filterFolder);
                    setView('list');
                } catch(e) { 
                    alert("Gagal menduplikasi: " + e.message); 
                }
                setIsSaving(false);
            };

            const publishFolder = async (fname) => {
                try {
                    const db = await getSupabase();
                    const { data, error: checkErr } = await db.from('tokens').select('code').eq('code', 'SYS_SETTING_FOLDER').maybeSingle();
                    if (checkErr && checkErr.code !== 'PGRST116') throw checkErr;
                    
                    if (data) {
                        const { error } = await db.from('tokens').update({ status: fname }).eq('code', 'SYS_SETTING_FOLDER');
                        if (error) throw error;
                    } else {
                        const { error } = await db.from('tokens').insert([{ code: 'SYS_SETTING_FOLDER', status: fname, generatedAt: new Date().toISOString() }]);
                        if (error) throw error;
                    }
                    setActiveFolder(fname);
                    alert(`Folder "${fname}" berhasil diterbitkan ke peserta!`);
                } catch(e) { alert("Gagal terbit: " + e.message); }
            };

            const folderStats = questions.reduce((acc, q) => { const f = q.folder || 'Utama'; acc[f] = (acc[f] || 0) + 1; return acc; }, {});
            tokens.forEach(t => { if (t.code && t.code.startsWith('SYS_FOLDER_') && folderStats[t.status] === undefined) { folderStats[t.status] = 0; } });
            if (folderStats['Utama'] === undefined) folderStats['Utama'] = 0;

            const createFolder = async () => {
                const fname = prompt("Masukkan Nama Folder Baru:\n(Contoh: Tryout 1, STS Ganjil)");
                if (fname && fname.trim() !== '') {
                    const folderName = fname.trim();
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        const { error } = await db.from('tokens').insert([{ code: `SYS_FOLDER_${Date.now()}`, status: folderName, generatedAt: new Date().toISOString(), participant_name: 'SYSTEM_FOLDER' }]);
                        if (error) throw error;
                        await fetchSupabaseData();
                        setFilterFolder(folderName); setView('list');
                        alert("Folder berhasil dibuat!");
                    } catch(e) { alert("Gagal menyimpan folder: " + e.message); }
                    setIsSaving(false);
                }
            };

            const editFolder = async (oldName) => {
                const newName = prompt(`Ubah nama folder "${oldName}" menjadi:`, oldName);
                if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === oldName);
                        if (folderToken) { 
                            const { error: err1 } = await db.from('tokens').update({ status: newName.trim() }).eq('code', folderToken.code); 
                            if (err1) throw err1;
                        }
                        const { error: err2 } = await db.from('questions').update({ folder: newName.trim() }).eq('folder', oldName);
                        if (err2) throw err2;
                        
                        if (activeFolder === oldName) { 
                            const { error: err3 } = await db.from('tokens').update({ status: newName.trim() }).eq('code', 'SYS_SETTING_FOLDER'); 
                            if (err3) throw err3;
                            setActiveFolder(newName.trim()); 
                        }
                        await fetchSupabaseData(); setFilterFolder(newName.trim());
                        alert("Nama folder berhasil diubah di database!");
                    } catch(e) { alert("Gagal ubah folder: " + e.message); }
                    setIsSaving(false);
                }
            };

            const deleteFolder = async (fname) => {
                if (fname === 'Utama') { alert("Folder Utama tidak dapat dihapus."); return; }
                if (!confirm(`Hapus folder "${fname}" beserta seluruh soal di dalamnya secara permanen?`)) return;
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === fname);
                    if (folderToken) { 
                        const { error: err1 } = await db.from('tokens').delete().eq('code', folderToken.code); 
                        if (err1) throw err1;
                    }
                    const { error: err2 } = await db.from('questions').delete().eq('folder', fname);
                    if (err2) throw err2;
                    
                    if (activeFolder === fname) { 
                        const { error: err3 } = await db.from('tokens').update({ status: 'Utama' }).eq('code', 'SYS_SETTING_FOLDER'); 
                        if (err3) throw err3;
                        setActiveFolder('Utama'); 
                    }
                    await fetchSupabaseData(); setFilterFolder('Utama'); setView('folders');
                    alert("Folder beserta isinya berhasil dihapus dari database!");
                } catch(e) { alert("Gagal hapus folder: " + e.message); }
                setIsSaving(false);
            };

            if (view === 'create' || view === 'edit') {
               const availableFolders = [...new Set([...questions.map(q => q.folder || 'Utama'), ...tokens.filter(t => t.code && t.code.startsWith('SYS_FOLDER_')).map(t => t.status), filterFolder, 'Utama'])];
               return (
                 <AdminLayout title="Editor Soal">
                    <div className="bg-white rounded-xl shadow-sm border max-w-4xl mx-auto p-6 mb-10">
                        <form onSubmit={saveQuestion} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border">
                                <div>
                                    <label className="block text-sm font-semibold mb-1 text-slate-700">Tipe Soal</label>
                                    <select value={formData.type} onChange={e => {
                                        const t = e.target.value;
                                        if(t === 'MCQ') setFormData({...defaultMCQ, folder: formData.folder, points: formData.points, question: formData.question});
                                        else if(t === 'MCMA') setFormData({...defaultMCMA, folder: formData.folder, points: formData.points, question: formData.question});
                                        else if(t === 'CATEGORY') setFormData({...defaultCAT, folder: formData.folder, points: formData.points, question: formData.question});
                                    }} className="w-full p-2.5 border rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-blue-500">
                                        <option value="MCQ">Pilihan Ganda (A-D)</option>
                                        <option value="MCMA">Pilihan Ganda Kompleks (&gt; 1 Jawaban)</option>
                                        <option value="CATEGORY">Matriks Kategori (Benar/Salah)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-1 text-slate-700">Pilih Folder Ujian</label>
                                    <select value={formData.folder || filterFolder} onChange={e => setFormData({...formData, folder: e.target.value})} className="w-full p-2.5 border rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-blue-500">
                                        {availableFolders.map(f => <option key={f} value={f}>{f}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-1 text-slate-700">Bobot Nilai</label>
                                    <input type="number" min="1" value={formData.points} onChange={e => setFormData({...formData, points: parseInt(e.target.value)})} className="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500"/>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-slate-800 mb-2">Pertanyaan Utama</label>
                                <RichTextEditor value={formData.question} onChange={val => setFormData({...formData, question: val})} />
                            </div>

                            {/* EDITOR UNTUK PILIHAN GANDA (MCQ) DENGAN RICH TEXT */}
                            {formData.type === 'MCQ' && (
                                <div className="space-y-4 pt-4 border-t">
                                    <h3 className="font-bold text-slate-800 mb-2">Opsi Jawaban (A-D)</h3>
                                    {formData.options.map((opt, idx) => (
                                        <div key={opt.id} className="flex gap-3 items-start">
                                            <span className="font-bold w-6 pt-3 text-lg text-slate-500">{opt.id}.</span>
                                            <div className="flex-1">
                                                <RichTextEditor minHeight="60px" value={opt.text} onChange={val => { const o = [...formData.options]; o[idx].text = val; setFormData({...formData, options: o}); }} />
                                            </div>
                                        </div>
                                    ))}
                                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 mt-4 flex items-center justify-between">
                                        <label className="font-bold text-emerald-800">Kunci Jawaban Benar:</label>
                                        <select value={formData.correctAnswer} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="p-2 border-2 border-emerald-400 rounded-lg font-bold text-emerald-700 w-32 text-center bg-white"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
                                    </div>
                                </div>
                            )}

                            {/* EDITOR UNTUK GANDA KOMPLEKS (MCMA) */}
                            {formData.type === 'MCMA' && (
                                <div className="space-y-4 pt-4 border-t">
                                    <div className="flex justify-between items-center"><h3 className="font-bold text-slate-800">Pernyataan (Pilih Jawaban Benar)</h3></div>
                                    {formData.statements.map((stmt, idx) => (
                                        <div key={stmt.id} className="flex gap-3 items-start border p-3 rounded-xl bg-slate-50">
                                            <div className="pt-2">
                                                <input type="checkbox" checked={formData.correctAnswers.includes(stmt.id)} onChange={e => {
                                                    let ans = [...formData.correctAnswers];
                                                    if(e.target.checked) ans.push(stmt.id); else ans = ans.filter(x => x !== stmt.id);
                                                    setFormData({...formData, correctAnswers: ans});
                                                }} className="w-5 h-5 text-blue-600 rounded cursor-pointer"/>
                                            </div>
                                            <div className="flex-1">
                                                 <RichTextEditor minHeight="60px" value={stmt.text} onChange={val => { const s = [...formData.statements]; s[idx].text = val; setFormData({...formData, statements: s}); }} />
                                            </div>
                                            <button type="button" onClick={() => { const s = formData.statements.filter((_, i) => i !== idx); setFormData({...formData, statements: s}); }} className="text-rose-500 mt-2 p-2 hover:bg-rose-100 rounded-lg"><Trash2 size={18}/></button>
                                        </div>
                                    ))}
                                    <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: Date.now(), text:''}]})} className="text-blue-600 font-bold text-sm bg-blue-50 px-4 py-2 rounded-lg">+ Tambah Pernyataan</button>
                                </div>
                            )}

                            {/* EDITOR UNTUK MATRIKS KATEGORI */}
                            {formData.type === 'CATEGORY' && (
                                <div className="space-y-4 pt-4 border-t">
                                    <h3 className="font-bold text-slate-800">Matriks Kategori (Benar/Salah)</h3>
                                    <div className="flex gap-4 mb-4">
                                         <div className="flex-1"><label className="text-xs font-bold text-slate-500">Label Kategori 1</label><input type="text" value={formData.statements[0]?.category1 || 'Benar'} onChange={e => { const s = [...formData.statements]; s.forEach(x => x.category1 = e.target.value); setFormData({...formData, statements: s}); }} className="w-full p-2.5 border rounded-lg font-semibold"/></div>
                                         <div className="flex-1"><label className="text-xs font-bold text-slate-500">Label Kategori 2</label><input type="text" value={formData.statements[0]?.category2 || 'Salah'} onChange={e => { const s = [...formData.statements]; s.forEach(x => x.category2 = e.target.value); setFormData({...formData, statements: s}); }} className="w-full p-2.5 border rounded-lg font-semibold"/></div>
                                    </div>
                                    {formData.statements.map((stmt, idx) => (
                                        <div key={stmt.id} className="border p-4 rounded-xl bg-slate-50 space-y-3">
                                            <RichTextEditor minHeight="60px" value={stmt.text} onChange={val => { const s = [...formData.statements]; s[idx].text = val; setFormData({...formData, statements: s}); }} />
                                            <div className="flex justify-between items-center pt-2 border-t border-slate-200">
                                                <div className="flex gap-6">
                                                    <label className="flex items-center gap-2 cursor-pointer font-semibold text-emerald-700"><input type="radio" className="w-5 h-5 text-emerald-600" checked={stmt.correctCategory === stmt.category1} onChange={() => { const s = [...formData.statements]; s[idx].correctCategory = stmt.category1; setFormData({...formData, statements: s}); }}/> Kunci: {stmt.category1}</label>
                                                    <label className="flex items-center gap-2 cursor-pointer font-semibold text-amber-700"><input type="radio" className="w-5 h-5 text-amber-600" checked={stmt.correctCategory === stmt.category2} onChange={() => { const s = [...formData.statements]; s[idx].correctCategory = stmt.category2; setFormData({...formData, statements: s}); }}/> Kunci: {stmt.category2}</label>
                                                </div>
                                                <button type="button" onClick={() => { const s = formData.statements.filter((_, i) => i !== idx); setFormData({...formData, statements: s}); }} className="text-rose-500 p-2 hover:bg-rose-100 rounded-lg"><Trash2 size={18}/></button>
                                            </div>
                                        </div>
                                    ))}
                                    <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: Date.now(), text:'', category1: formData.statements[0]?.category1||'Benar', category2: formData.statements[0]?.category2||'Salah', correctCategory: formData.statements[0]?.category1||'Benar'}]})} className="text-blue-600 font-bold text-sm bg-blue-50 px-4 py-2 rounded-lg">+ Tambah Baris Matriks</button>
                                </div>
                            )}

                            <div className="flex justify-end gap-3 pt-6 border-t mt-6">
                                <button type="button" onClick={() => setView('list')} className="px-6 py-2.5 border rounded-lg font-semibold hover:bg-slate-50 text-slate-600">Batal</button>
                                <button type="submit" disabled={isSaving} className="px-8 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow-md hover:bg-blue-700 disabled:opacity-50">{isSaving ? 'Menyimpan...' : 'Simpan Soal'}</button>
                            </div>
                        </form>
                    </div>
                 </AdminLayout>
               );
            }

            if (view === 'list') {
              const folderQuestions = questions.filter(q => String(q.folder || 'Utama').trim().toLowerCase() === filterFolder.toLowerCase());
              return (
                <AdminLayout title={`Folder: ${filterFolder}`}>
                  <div className="mb-6 flex justify-between items-center gap-3 bg-white p-4 rounded-xl border shadow-sm">
                     <button onClick={() => setView('folders')} className="border px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center hover:bg-slate-50"><ChevronLeft size={16} className="mr-1"/> Kembali</button>
                     <button onClick={() => setShowImport(true)} className="bg-emerald-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center shadow-sm hover:bg-emerald-700"><Upload size={16} className="mr-2"/> Unggah Soal (CSV)</button>
                  </div>
                  {showImport && (
                     <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-5">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold">Impor Soal CSV (Hanya Pilihan Ganda)</h3><button onClick={()=>setShowImport(false)}><X size={18}/></button></div>
                            <button onClick={downloadTemplate} className="mb-4 bg-blue-50 border text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold flex items-center"><FileText size={16} className="mr-2"/> Download Templat Soal</button>
                            <input type="file" accept=".csv" onChange={handleUploadSoal} className="w-full p-4 border-2 border-dashed rounded-xl"/>
                            {fileError && <p className="text-rose-500 text-xs mt-2">{fileError}</p>}
                        </div>
                     </div>
                  )}
                  <div className="space-y-4">
                    {folderQuestions.map((q, idx) => (
                       <div key={q.id} className="bg-white p-5 rounded-xl border shadow-sm flex flex-col sm:flex-row justify-between items-start gap-4">
                         <div className="flex-1">
                             <div className="flex items-center gap-2 mb-2">
                                 <span className="text-xs font-bold bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md">No. {idx+1}</span>
                                 <span className="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded uppercase tracking-wider">{q.type}</span>
                             </div>
                             <div className="mt-2 text-slate-800 font-medium rich-text-content text-sm" dangerouslySetInnerHTML={{__html: q.question}}></div>
                         </div>
                         <div className="flex sm:flex-col gap-2 shrink-0">
                            <button onClick={() => duplicateQuestion(q)} className="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 p-2.5 rounded-xl font-bold text-xs flex items-center justify-center border border-emerald-200 flex-1 sm:flex-none transition-colors" title="Duplikasi Soal"><Copy size={16} className="sm:mr-1.5"/> <span className="hidden sm:inline">Duplikat</span></button>
                            <button onClick={() => {setFormData(q); setView('edit');}} className="text-blue-600 bg-blue-50 p-2 hover:bg-blue-100 rounded-lg flex items-center justify-center" title="Edit Soal"><Edit size={16}/></button>
                            <button onClick={() => deleteQuestion(q.id)} className="text-rose-600 bg-rose-50 p-2 hover:bg-rose-100 rounded-lg flex items-center justify-center" title="Hapus Soal"><Trash2 size={16}/></button>
                         </div>
                       </div>
                    ))}
                    {folderQuestions.length === 0 && <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300 text-slate-500 font-bold">Belum ada soal di folder ini.</div>}
                  </div>
                  <button onClick={() => {setFormData({...defaultMCQ, folder: filterFolder}); setView('create');}} className="fixed bottom-8 right-8 bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-xl hover:scale-105 transition-transform"><Plus size={28}/></button>
                </AdminLayout>
              );
            }

            return (
              <AdminLayout title="Manajemen Bank Soal">
                 <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <div onClick={createFolder} className="bg-emerald-50 border-2 border-dashed border-emerald-300 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer min-h-[180px] hover:bg-emerald-100 transition-colors">
                        <div className="w-12 h-12 bg-emerald-200 text-emerald-700 rounded-full flex items-center justify-center mb-3"><Plus size={24}/></div>
                        <span className="font-bold text-emerald-800">Buat Folder Baru</span>
                    </div>
                    {Object.entries(folderStats).map(([fname, count]) => {
                        const isPublished = activeFolder.toLowerCase() === fname.toLowerCase();
                        return (
                        <div key={fname} className={`bg-white border-2 rounded-2xl p-6 flex flex-col justify-between shadow-sm min-h-[180px] ${isPublished ? 'border-emerald-400' : 'border-slate-200'}`}>
                            <div>
                                <h4 className="font-bold text-xl text-slate-800 mb-1 truncate" title={fname}>{fname}</h4>
                                <p className="text-xs text-slate-500 font-semibold bg-slate-100 inline-block px-3 py-1 rounded-full">{count} Butir Soal</p>
                            </div>
                            <div className="mt-6 flex flex-col gap-2">
                                <div className="flex gap-2">
                                    <button onClick={() => { setFilterFolder(fname); setView('list'); }} className="flex-1 bg-slate-100 py-2 rounded-lg text-sm font-bold text-slate-700 hover:bg-slate-200 transition-colors">Buka</button>
                                    <button onClick={() => editFolder(fname)} className="px-3 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors" title="Edit Nama Folder"><Edit size={16}/></button>
                                    {fname !== 'Utama' && <button onClick={() => deleteFolder(fname)} className="px-3 bg-rose-50 text-rose-600 rounded-lg hover:bg-rose-100 transition-colors" title="Hapus Folder Permanen"><Trash2 size={16}/></button>}
                                </div>
                                <button onClick={() => publishFolder(fname)} className={`w-full py-2.5 rounded-lg text-sm font-bold transition-colors ${isPublished ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                    {isPublished ? 'Sedang Diterbitkan' : 'Terbitkan Folder Ini'}
                                </button>
                            </div>
                        </div>
                    )})}
                 </div>
              </AdminLayout>
            );
          };

          const AdminItemAnalysis = () => {
             const [isDeleting, setIsDeleting] = useState(false);

             const deleteAllResults = async () => {
                if(results.length === 0) return;
                if(!confirm("PERINGATAN: Menghapus data di sini akan menghapus SELURUH hasil ujian siswa. Lanjutkan?")) return;
                setIsDeleting(true);
                try {
                    const db = await getSupabase();
                    const { error } = await db.from('results').delete().neq('participant_name', 'DELETE_ALL_DUMMY');
                    if (error) throw error;
                    await fetchSupabaseData();
                    alert("Seluruh data analisis dan hasil berhasil dihapus.");
                } catch(e) { alert("Gagal menghapus data: " + e.message); }
                setIsDeleting(false);
             };

            const analysisData = questions.map(q => {
                let correct = 0, wrong = 0, empty = 0;
                results.forEach(r => {
                    const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                    const d = details.find(x => x.qId === q.id);
                    if (!d || d.isEmpty) empty++;
                    else if (d.isCorrect) correct++;
                    else wrong++;
                });
                const total = results.length;
                const percentage = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
                
                let difficulty = "N/A";
                if (total > 0) {
                    const p = parseFloat(percentage);
                    if (p > 85) difficulty = "Sangat Mudah";
                    else if (p >= 70) difficulty = "Mudah";
                    else if (p >= 50) difficulty = "Sedang";
                    else if (p >= 30) difficulty = "Sulit";
                    else difficulty = "Sangat Sulit";
                }
                return { ...q, correct, wrong, empty, total, percentage, difficulty };
            });

            return (
              <AdminLayout title="Analisis Soal">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <div className="bg-white rounded-xl border p-4 flex-1 w-full sm:w-auto shadow-sm">
                       <h3 className="font-bold text-slate-800 text-lg mb-1">Statistik Responden</h3>
                       <p className="text-slate-600 text-sm">Total data teranalisis: <strong className="text-emerald-600">{results.length} Siswa</strong></p>
                    </div>
                    <div className="flex gap-2 w-full sm:w-auto">
                        <button onClick={fetchSupabaseData} className="flex-1 sm:flex-none bg-blue-50 text-blue-600 border border-blue-200 px-5 py-3 rounded-xl text-sm font-bold flex items-center justify-center hover:bg-blue-100 shadow-sm transition-colors">
                           <i className="fas fa-sync-alt mr-2"></i> Refresh Data
                        </button>
                        <button onClick={deleteAllResults} disabled={isDeleting || results.length === 0} className="flex-1 sm:flex-none bg-rose-600 text-white px-5 py-3 rounded-xl text-sm font-bold flex items-center justify-center hover:bg-rose-700 disabled:opacity-50 shadow-sm transition-colors">
                            <Trash2 size={18} className="mr-2"/> Hapus Semua
                        </button>
                    </div>
                </div>
                
                <div className="bg-white rounded-xl border overflow-x-auto shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b">
                            <tr>
                                <th className="p-4 text-center w-12">No</th>
                                <th className="p-4">Kategori / Tipe</th>
                                <th className="p-4">Pertanyaan (Cuplikan)</th>
                                <th className="p-4 text-center">Benar</th>
                                <th className="p-4 text-center">Salah</th>
                                <th className="p-4 text-center">Kosong</th>
                                <th className="p-4 text-center">% Benar</th>
                                <th className="p-4 text-center">Kesulitan</th>
                            </tr>
                        </thead>
                        <tbody>
                            {analysisData.map((d, idx) => {
                                const tempDiv = document.createElement("div");
                                tempDiv.innerHTML = d.question || "";
                                const plainText = tempDiv.textContent || tempDiv.innerText || "";
                                return (
                                <tr key={d.id} className="border-b hover:bg-slate-50 transition-colors">
                                    <td className="p-4 text-center font-bold text-slate-500">{idx + 1}</td>
                                    <td className="p-4"><div className="font-semibold text-slate-700">{d.category || d.folder || 'Utama'}</div><div className="text-[10px] uppercase font-bold text-blue-500 bg-blue-50 inline-block px-2 py-0.5 rounded mt-1 border border-blue-100">{d.type}</div></td>
                                    <td className="p-4 max-w-xs truncate text-slate-600" title={plainText}>{plainText}</td>
                                    <td className="p-4 text-center font-bold text-emerald-600">{d.correct}</td>
                                    <td className="p-4 text-center font-bold text-rose-600">{d.wrong}</td>
                                    <td className="p-4 text-center font-bold text-slate-400">{d.empty}</td>
                                    <td className="p-4 text-center font-black text-blue-600">{d.percentage}%</td>
                                    <td className="p-4 text-center"><span className={`px-2 py-1 rounded text-xs font-bold border ${d.difficulty.includes('Mudah') ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : d.difficulty === 'Sedang' ? 'bg-blue-50 text-blue-700 border-blue-200' : d.difficulty.includes('Sulit') ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>{d.difficulty}</span></td>
                                </tr>
                            )})}
                            {analysisData.length === 0 && <tr><td colSpan="8" className="text-center p-8 text-slate-500 font-bold bg-slate-50">Belum ada data soal atau ujian.</td></tr>}
                        </tbody>
                    </table>
                </div>
              </AdminLayout>
            );
          };

          const AdminReports = () => {
             const [filterSchool, setFilterSchool] = useState('Semua');
             const [activeTab, setActiveTab] = useState('NILAI');
             const schoolList = ['Semua', ...new Set(results.map(r => r.participant?.school).filter(Boolean))];
             const filteredResults = filterSchool === 'Semua' ? results : results.filter(r => r.participant?.school === filterSchool);

             return (
                <AdminLayout title="Cetak Laporan Dokumen (F4)">
                   <div className="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl border shadow-sm print:hidden">
                      <div className="flex gap-2 bg-slate-100 p-1.5 rounded-lg w-full sm:w-auto">
                          <button onClick={() => setActiveTab('NILAI')} className={`flex-1 sm:flex-none px-4 py-2 rounded-md text-sm font-bold ${activeTab === 'NILAI' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>Rekap Nilai</button>
                          <button onClick={() => setActiveTab('PELANGGARAN')} className={`flex-1 sm:flex-none px-4 py-2 rounded-md text-sm font-bold ${activeTab === 'PELANGGARAN' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>Laporan Pelanggaran</button>
                      </div>
                      <div className="flex items-center gap-3 w-full sm:w-auto">
                         <select value={filterSchool} onChange={e=>setFilterSchool(e.target.value)} className="border rounded-lg p-2 text-sm bg-white font-semibold">
                            {schoolList.map(s => <option key={s} value={s}>{s}</option>)}
                         </select>
                         <button onClick={fetchSupabaseData} className="bg-blue-50 text-blue-600 border border-blue-200 px-3 py-2 rounded-lg text-sm font-bold flex items-center hover:bg-blue-100 transition-colors" title="Muat Ulang Data">
                            <i className="fas fa-sync-alt"></i>
                         </button>
                         <button onClick={() => window.print()} className="bg-slate-800 text-white px-5 py-2 rounded-lg font-semibold text-sm flex items-center"><Printer size={16} className="mr-2"/> Cetak PDF</button>
                      </div>
                   </div>
                   <div className="bg-white border shadow-md mx-auto w-full max-w-[21.5cm] min-h-[33cm] p-8 sm:p-12 print-container">
                      <div className="text-center border-b-2 border-slate-800 pb-4 mb-6">
                         <h1 className="text-xl font-bold uppercase tracking-widest text-slate-900 mb-1">{activeTab === 'NILAI' ? 'Laporan Hasil Ujian' : 'Laporan Deteksi Pelanggaran'}</h1>
                         <p className="text-slate-600 font-medium">{organizerName}</p>
                      </div>
                      <div className="mb-6 flex justify-between text-sm font-medium bg-slate-50 p-4 rounded border">
                         <div>Filter Sekolah: <span className="font-bold text-blue-700">{filterSchool}</span></div>
                         <div>Total Peserta: <span className="font-bold">{filteredResults.length}</span> Siswa</div>
                      </div>
                      <table className="w-full text-left border-collapse border border-slate-800 text-sm">
                         <thead className="bg-slate-100 uppercase font-bold text-xs"><tr className="border-b border-slate-800">
                            <th className="border-r border-slate-800 py-2.5 px-3 text-center w-12">No</th>
                            <th className="border-r border-slate-800 py-2.5 px-3">Nama Peserta</th>
                            <th className="border-r border-slate-800 py-2.5 px-3">Asal Sekolah</th>
                            {activeTab === 'NILAI' ? (
                                <><th className="border-r border-slate-800 py-2.5 px-3 text-center w-28">Durasi</th><th className="py-2.5 px-3 text-center w-20">Nilai</th></>
                            ) : (
                                <><th className="border-r border-slate-800 py-2.5 px-3 text-center w-28">Status Keamanan</th><th className="py-2.5 px-3 text-center w-36">Peringatan</th></>
                            )}
                         </tr></thead>
                         <tbody>
                            {filteredResults.map((r, i) => {
                               const durSecs = Math.max(0, Math.floor((r.endTime - r.startTime) / 1000));
                               const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                               const cheats = details.find(x => x.qId === 'SYS_CHEATS')?.cheatCount || 0;
                               return (
                               <tr key={i} className="border-b border-slate-800 font-medium">
                                  <td className="border-r border-slate-800 py-2.5 px-3 text-center">{i+1}</td>
                                  <td className="border-r border-slate-800 py-2.5 px-3">{r.participant?.name}</td>
                                  <td className="border-r border-slate-800 py-2.5 px-3">{r.participant?.school}</td>
                                  {activeTab === 'NILAI' ? (
                                      <><td className="border-r border-slate-800 py-2.5 px-3 text-center text-xs">{`${Math.floor(durSecs/60)}m ${durSecs%60}s`}</td><td className="py-2.5 px-3 text-center font-bold text-blue-700 bg-blue-50/30">{r.score}</td></>
                                  ) : (
                                      <><td className="border-r border-slate-800 py-2.5 px-3 text-center">{cheats === 0 ? <span className="text-emerald-600 font-bold">AMAN</span> : <span className="text-rose-600 font-bold">TERDETEKSI</span>}</td><td className="py-2.5 px-3 text-center font-bold">{cheats === 0 ? '-' : <span className="text-rose-600">{cheats}x Keluar Layar</span>}</td></>
                                  )}
                               </tr>
                            )})}
                            {filteredResults.length === 0 && <tr><td colSpan="5" className="text-center py-8 text-slate-500">Tidak ada data.</td></tr>}
                         </tbody>
                      </table>
                      <div className="mt-16 flex justify-end text-center text-slate-800 font-medium text-sm"><div><p className="mb-16">Mengetahui,<br/>Administrator</p><p className="font-bold underline">_____________________</p></div></div>
                   </div>
                </AdminLayout>
             );
          };

          switch (currentRoute) {
            case '/': case '/login': return <ParticipantLogin />;
            case '/identity': return <ParticipantIdentity />;
            case '/instruction': return <ParticipantInstruction />;
            case '/exam': return <ExamEngine />;
            case '/review': return <ExamReview />;
            case '/submitted': return <ExamSubmitted />;
            case '/admin': case '/admin/login': return <AdminLogin />;
            case '/admin/dashboard': return <AdminDashboard />;
            case '/admin/tokens': return <AdminTokens />;
            case '/admin/results': return <AdminResults />;
            case '/admin/questions': return <AdminQuestions />;
            case '/admin/analysis': return <AdminItemAnalysis />;
            case '/admin/reports': return <AdminReports />;
            default: return <ParticipantLogin />;
          }
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
