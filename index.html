                   alert("Soal berhasil disalin.");
                } catch(err) { alert("Gagal menyalin soal: " + err.message); }
                finally { setIsSaving(false); }
             };

            const renderOptionsEditor = () => {
                if (formData.type === 'MCQ') {
                    return (
                        <div className="space-y-4 mt-6 border-t pt-4">
                            <h3 className="font-semibold text-slate-800 text-sm">Opsi Jawaban (A-D)</h3>
                            {formData.options.map((opt, idx) => (
                                <div key={opt.id} className="flex gap-3 items-start bg-slate-50 p-3 rounded-lg border border-slate-200">
                                    <div className="pt-2 font-bold text-slate-400 w-6 text-center">{opt.id}.</div>
                                    <div className="flex-1">
                                        <RichTextEditor minHeight="60px" placeholder={`Ketik opsi ${opt.id}...`} value={opt.text} onChange={(v) => { const newOpts = [...formData.options]; newOpts[idx].text = v; setFormData({...formData, options: newOpts}); }} />
                                    </div>
                                </div>
                            ))}
                            <div className="bg-emerald-50 p-4 rounded-lg border border-emerald-100 flex items-center justify-between">
                                <span className="font-medium text-emerald-800 text-sm">Kunci Jawaban:</span>
                                <select value={formData.correctAnswer} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="p-2 border border-emerald-200 rounded font-bold text-emerald-700 bg-white focus:border-emerald-500 text-sm w-24 text-center">
                                    {['A', 'B', 'C', 'D'].map(v => <option key={v} value={v}>{v}</option>)}
                                </select>
                            </div>
                        </div>
                    );
                } else if (formData.type === 'MCMA') {
                    return (
                        <div className="space-y-4 mt-6 border-t pt-4">
                            <h3 className="font-semibold text-slate-800 text-sm flex justify-between">
                                <span>Pernyataan Kompleks (MCMA)</span>
                                <span className="text-xs font-normal text-slate-500">Centang untuk mengatur sbg kunci benar</span>
                            </h3>
                            {formData.statements.map((stmt, idx) => (
                                <div key={stmt.id} className={`flex gap-3 items-start p-3 rounded-lg border transition-colors ${formData.correctAnswers.includes(stmt.id) ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'}`}>
                                    <div className="pt-2 flex flex-col items-center gap-2">
                                        <input type="checkbox" checked={formData.correctAnswers.includes(stmt.id)} onChange={() => {
                                            let newAns = [...formData.correctAnswers];
                                            if(newAns.includes(stmt.id)) newAns = newAns.filter(x => x !== stmt.id); else newAns.push(stmt.id);
                                            setFormData({...formData, correctAnswers: newAns});
                                        }} className="w-5 h-5 text-emerald-600 rounded cursor-pointer" />
                                        <span className="font-bold text-slate-400 text-xs">{stmt.id}.</span>
                                    </div>
                                    <div className="flex-1">
                                        <RichTextEditor minHeight="60px" placeholder={`Ketik pernyataan ${stmt.id}...`} value={stmt.text} onChange={(v) => { const newStmts = [...formData.statements]; newStmts[idx].text = v; setFormData({...formData, statements: newStmts}); }} />
                                    </div>
                                </div>
                            ))}
                            <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: formData.statements.length + 1, text:''}]})} className="text-blue-600 font-medium text-sm hover:underline flex items-center"><Plus size={16} className="mr-1"/> Tambah Baris Pernyataan</button>
                        </div>
                    );
                } else if (formData.type === 'CATEGORY') {
                    return (
                        <div className="space-y-4 mt-6 border-t pt-4">
                            <h3 className="font-semibold text-slate-800 text-sm">Pengaturan Tabel Kategori</h3>
                            
                            <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                <label className="block text-slate-600 font-medium text-xs mb-2">Pilih Format Label Kategori:</label>
                                <select className="w-full p-2.5 rounded border border-slate-300 bg-white font-medium text-slate-700 text-sm" onChange={(e) => {
                                    const [cat1, cat2] = e.target.value.split('|');
                                    const newStmts = formData.statements.map(s => ({...s, category1: cat1, category2: cat2, correctCategory: cat1}));
                                    setFormData({...formData, statements: newStmts});
                                }}>
                                    <option value="Benar|Salah">Benar / Salah</option>
                                    <option value="Sesuai|Tidak Sesuai">Sesuai / Tidak Sesuai</option>
                                    <option value="Setuju|Tidak Setuju">Setuju / Tidak Setuju</option>
                                </select>
                            </div>

                            {formData.statements.map((stmt, idx) => (
                                <div key={stmt.id} className="bg-white border border-slate-200 p-4 rounded-lg flex flex-col gap-3 shadow-sm">
                                    <div className="flex gap-3 items-start">
                                        <div className="pt-2 font-bold text-slate-400 w-5">{idx+1}.</div>
                                        <div className="flex-1">
                                            <RichTextEditor minHeight="60px" placeholder={`Pernyataan ${idx+1}...`} value={stmt.text} onChange={(v) => { const newStmts = [...formData.statements]; newStmts[idx].text = v; setFormData({...formData, statements: newStmts}); }} />
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4 bg-slate-50 p-2.5 rounded border ml-8 text-sm">
                                        <span className="font-medium text-slate-500">Kunci:</span>
                                        <label className="flex items-center cursor-pointer font-medium text-emerald-700">
                                            <input type="radio" checked={stmt.correctCategory === stmt.category1} onChange={() => { const newStmts = [...formData.statements]; newStmts[idx].correctCategory = stmt.category1; setFormData({...formData, statements: newStmts}); }} className="w-4 h-4 mr-1.5 text-emerald-600" /> 
                                            {stmt.category1}
                                        </label>
                                        <label className="flex items-center cursor-pointer font-medium text-rose-700 ml-3">
                                            <input type="radio" checked={stmt.correctCategory === stmt.category2} onChange={() => { const newStmts = [...formData.statements]; newStmts[idx].correctCategory = stmt.category2; setFormData({...formData, statements: newStmts}); }} className="w-4 h-4 mr-1.5 text-rose-600" /> 
                                            {stmt.category2}
                                        </label>
                                    </div>
                                </div>
                            ))}
                            <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: formData.statements.length + 1, text:'', category1: formData.statements[0].category1, category2: formData.statements[0].category2, correctCategory: formData.statements[0].category1}]})} className="text-blue-600 font-medium text-sm hover:underline flex items-center"><Plus size={16} className="mr-1"/> Tambah Baris</button>
                        </div>
                    );
                }
            };

            if (view === 'create' || view === 'edit') {
               return (
                 <AdminLayout title={view === 'create' ? "Buat Soal Baru" : "Edit Soal"}>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-w-4xl mx-auto mb-10">
                        <div className="bg-slate-50 border-b px-6 py-4 flex justify-between items-center">
                            <h2 className="font-bold text-slate-800 text-sm flex items-center"><Edit className="mr-2 w-4 text-blue-600"/> Editor Soal</h2>
                            <button type="button" onClick={() => setView('list')} className="text-slate-400 hover:text-slate-700"><X size={20}/></button>
                        </div>
                        
                        <form onSubmit={saveQuestion} className="p-6">
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">Tipe Soal</label>
                                    <select value={formData.type} onChange={e => {
                                        const type = e.target.value;
                                        if (type === 'MCQ') setFormData({...defaultMCQ, type, category: formData.category, points: formData.points});
                                        else if (type === 'MCMA') setFormData({...defaultMCMA, type, category: formData.category, points: formData.points});
                                        else setFormData({...defaultCAT, type, category: formData.category, points: formData.points});
                                    }} disabled={view === 'edit'} className="w-full p-2 border rounded bg-white text-sm font-medium disabled:opacity-60">
                                        <option value="MCQ">Pilihan Ganda (A-D)</option>
                                        <option value="MCMA">Pilihan Ganda Kompleks</option>
                                        <option value="CATEGORY">Matriks Kategori</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">Mata Pelajaran</label>
                                    <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full p-2 border rounded bg-white text-sm font-medium">
                                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                                        <option value="Matematika">Matematika</option>
                                        <option value="IPA">IPA</option>
                                        <option value="Umum">Umum</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">Bobot Nilai</label>
                                    <input type="number" min="1" value={formData.points} required onChange={e => setFormData({...formData, points: parseInt(e.target.value)})} className="w-full p-2 border rounded bg-white text-sm font-medium"/>
                                </div>
                            </div>

                            <div className="mb-2">
                                <label className="block text-sm font-semibold text-slate-800 mb-2">Pertanyaan Utama</label>
                                <RichTextEditor value={formData.question} onChange={val => setFormData({...formData, question: val})} placeholder="Ketik pertanyaan di sini..." minHeight="120px" />
                            </div>

                            {renderOptionsEditor()}

                            <div className="pt-6 mt-6 border-t flex justify-end gap-3">
                                <button type="button" onClick={() => setView('list')} className="px-5 py-2 rounded font-medium text-slate-600 border hover:bg-slate-50 text-sm">Batal</button>
                                <button type="submit" disabled={isSaving} className="px-6 py-2 rounded bg-blue-600 text-white font-medium hover:bg-blue-700 flex items-center text-sm disabled:opacity-50">
                                    <Save size={16} className="mr-2"/> {isSaving ? 'Menyimpan...' : 'Simpan'}
                                </button>
                            </div>
                        </form>
                    </div>
                 </AdminLayout>
               );
            }

            return (
              <AdminLayout title="Bank Soal">
                <div className="mb-6 flex flex-wrap gap-3 items-center justify-between">
                   <button onClick={() => {setFormData(defaultMCQ); setView('create');}} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium flex items-center shadow-sm">
                     <Plus size={16} className="mr-2"/> Buat Soal
                   </button>
                   <button onClick={clearAllQuestions} disabled={isSaving} className="bg-white text-rose-600 border border-rose-200 hover:bg-rose-50 px-4 py-2.5 rounded-lg text-sm font-medium flex items-center transition-colors disabled:opacity-50">
                     <Trash2 size={16} className="mr-1.5" /> Kosongkan
                   </button>
                </div>

                <div className="space-y-4">
                  {questions.map((q, idx) => (
                     <div key={q.id} className="bg-white p-4 sm:p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-4">
                       <div className="w-10 h-10 flex-shrink-0 bg-slate-50 rounded flex items-center justify-center font-bold text-slate-500 border border-slate-200 text-sm">
                          {idx + 1}
                       </div>
                       <div className="flex-1 overflow-hidden min-w-0">
                          <div className="flex gap-2 mb-3">
                            <span className="text-[10px] font-bold px-2 py-1 bg-blue-50 text-blue-700 border border-blue-100 rounded uppercase">{q.type}</span>
                            <span className="text-[10px] font-semibold text-slate-500 bg-slate-50 px-2 py-1 rounded border">{q.category}</span>
                          </div>
                          
                          <div className="font-medium text-slate-800 text-sm sm:text-base mb-3 rich-text-content" dangerouslySetInnerHTML={{__html: q.question}}></div>
                          
                          <div className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded border inline-block">
                            <span className="font-medium mr-1">Kunci:</span> 
                            {q.type === 'MCQ' ? <span className="font-bold text-emerald-600">{q.correctAnswer}</span> : 
                             q.type === 'MCMA' ? <span className="font-bold text-blue-600">{JSON.stringify(q.correctAnswers)}</span> : 
                             <span className="font-bold text-indigo-600">Matriks Tabel</span>}
                          </div>
                       </div>
                       <div className="flex sm:flex-col gap-2 justify-end sm:justify-start pt-3 sm:pt-0 shrink-0 border-t sm:border-t-0 sm:border-l border-slate-100 sm:pl-4 mt-2 sm:mt-0">
                          <button onClick={() => duplicateQuestion(q)} className="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 p-2 rounded flex items-center justify-center transition-colors text-xs font-medium flex-1 sm:flex-none" title="Salin Soal">
                             <Copy size={14} className="sm:mr-1.5"/> <span className="hidden sm:inline">Salin</span>
                          </button>
                          <button onClick={() => {setFormData(q); setView('edit');}} className="bg-blue-50 text-blue-600 hover:bg-blue-100 p-2 rounded flex items-center justify-center transition-colors text-xs font-medium flex-1 sm:flex-none">
                             <Edit size={14} className="sm:mr-1.5"/> <span className="hidden sm:inline">Edit</span>
                          </button>
                          <button onClick={() => deleteQuestion(q.id)} className="bg-rose-50 text-rose-500 hover:bg-rose-100 p-2 rounded flex items-center justify-center transition-colors text-xs font-medium flex-1 sm:flex-none">
                             <Trash2 size={14} className="sm:mr-1.5"/> <span className="hidden sm:inline">Hapus</span>
                          </button>
                       </div>
                     </div>
                  ))}
                  {questions.length === 0 && (
                     <div className="text-center py-16 bg-white rounded-xl border border-dashed border-slate-300">
                       <Database size={40} className="mx-auto text-slate-300 mb-4"/>
                       <p className="text-slate-500 font-medium text-sm">Belum ada soal.</p>
                     </div>
                  )}
                </div>
              </AdminLayout>
            );
          };

          const AdminItemAnalysis = () => { 
            const analysisData = questions.map(q => {
              let correct = 0, wrong = 0, empty = 0;
              results.forEach(r => { const d = r.detail?.detailedResults?.find(x => x.qId === q.id); if (!d || d.isEmpty) empty++; else if (d.isCorrect) correct++; else wrong++; });
              const total = results.length;
              const percentage = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
              return { ...q, correct, wrong, empty, total, percentage };
            });
            return (
              <AdminLayout title="Analisis Butir Soal">
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto p-1"><table className="w-full text-left text-sm min-w-[600px]"><thead className="bg-slate-50 text-slate-500 font-medium border-b"><tr><th className="py-3 px-3 text-center w-12">No</th><th className="py-3 px-3">Tipe</th><th className="py-3 px-3 text-center">Benar</th><th className="py-3 px-3 text-center">Salah</th><th className="py-3 px-3 text-center">Kosong</th><th className="py-3 px-3 text-center">% Benar</th></tr></thead><tbody>{analysisData.map((d, idx) => (<tr key={d.id} className="border-b border-slate-50 hover:bg-slate-50/50"><td className="py-3 px-3 text-center text-slate-400">{idx + 1}</td><td className="py-3 px-3 font-medium text-slate-700 text-xs">{d.type}</td><td className="py-3 px-3 text-center font-bold text-emerald-600">{d.correct}</td><td className="py-3 px-3 text-center font-bold text-rose-500">{d.wrong}</td><td className="py-3 px-3 text-center font-bold text-amber-500">{d.empty}</td><td className="py-3 px-3 text-center font-bold text-blue-600">{d.percentage}%</td></tr>))}</tbody></table></div>
              </AdminLayout>
            );
          };

          const AdminReports = () => (
            <AdminLayout title="Cetak Laporan">
               <div className="mb-5 flex justify-end"><button onClick={() => window.print()} className="bg-slate-800 text-white px-5 py-2.5 rounded-lg font-medium shadow-sm print:hidden flex items-center hover:bg-slate-900 transition-colors text-sm"><Printer size={16} className="mr-2"/> Cetak PDF (F4)</button></div>
               <div className="bg-white border shadow-md mx-auto w-full max-w-[21.5cm] min-h-[33cm] p-8 sm:p-12 print-container print:border-none print:shadow-none print:p-0">
                  <div className="text-center border-b-2 border-slate-800 pb-4 mb-6">
                     <h1 className="text-xl sm:text-2xl font-bold uppercase tracking-widest text-slate-900 mb-1">Laporan Hasil Ujian</h1>
                     <p className="text-slate-600 font-medium text-sm sm:text-base">CBT TKA Terpadu Sekolah Dasar</p>
                  </div>
                  <div className="mb-6 flex flex-col sm:flex-row justify-between text-sm sm:text-base font-medium text-slate-800 bg-slate-50 p-4 rounded border">
                     <div>Mata Pelajaran: <span className="font-bold">Campuran</span></div><div>Total Peserta: <span className="font-bold">{results.length}</span> Siswa</div>
                  </div>
                  <table className="w-full text-left border-collapse border border-slate-800 text-sm">
                     <thead className="bg-slate-100 text-slate-900 uppercase font-bold text-xs"><tr className="border-b border-slate-800">
                        <th className="border-r border-slate-800 py-2.5 px-3 text-center w-12">No</th><th className="border-r border-slate-800 py-2.5 px-3">Nama Peserta</th><th className="border-r border-slate-800 py-2.5 px-3">Asal Sekolah</th><th className="py-2.5 px-3 text-center w-20">Nilai</th>
                     </tr></thead>
                     <tbody>
                        {results.map((r, i) => (
                           <tr key={i} className="border-b border-slate-800 text-slate-800 font-medium">
                              <td className="border-r border-slate-800 py-2.5 px-3 text-center">{i+1}</td><td className="border-r border-slate-800 py-2.5 px-3">{r.participant?.name}</td><td className="border-r border-slate-800 py-2.5 px-3">{r.participant?.school}</td><td className="py-2.5 px-3 text-center font-bold">{r.score}</td>
                           </tr>
                        ))}
                     </tbody>
                  </table>
                  <div className="mt-16 flex justify-end text-center text-slate-800 font-medium text-sm"><div><p className="mb-16">Mengetahui,<br/>Administrator Sistem</p><p className="font-bold underline">_____________________</p></div></div>
               </div>
            </AdminLayout>
          );

          switch (currentRoute) {
            case '/': case '/login': return <ParticipantLogin />;
            case '/identity': return <ParticipantIdentity />;
            case '/instruction': return <ParticipantInstruction />;
            case '/exam': return <ExamEngine />;
            case '/review': return <ExamReview />;
            case '/submitted': return <ExamSubmitted />;
            case '/admin': case '/admin/login': return <AdminLogin />;
            case '/admin/dashboard': return <AdminDashboard />;
            case '/admin/tokens': return <AdminTokens />;
            case '/admin/results': return <AdminResults />;
            case '/admin/questions': return <AdminQuestions />;
            case '/admin/analysis': return <AdminItemAnalysis />;
            case '/admin/reports': return <AdminReports />;
            default: return <ParticipantLogin />;
          }
        }

        const ReactDOMRoot = ReactDOM.createRoot(document.getElementById('root'));
        ReactDOMRoot.render(<App />);
    </script>
</body>
</html>
