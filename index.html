<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT TKA Terpadu - Sekolah Dasar</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Memuat Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .rich-text-content { white-space: pre-wrap; word-wrap: break-word; }
        .rich-text-content p { min-height: 1.5rem; margin-bottom: 0.5rem; }
        @media print {
            body, html { background: white !important; height: auto !important; }
            nav, header, button, .print\:hidden { display: none !important; }
            main { padding: 0 !important; overflow: visible !important; display: block !important; }
            .print-container { box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const Monitor = ({size=24, className=""}) => <i className={`fas fa-desktop ${className}`} style={{fontSize: size}}></i>;
        const Key = ({size=24, className=""}) => <i className={`fas fa-key ${className}`} style={{fontSize: size}}></i>;
        const User = ({size=24, className=""}) => <i className={`fas fa-user ${className}`} style={{fontSize: size}}></i>;
        const Clock = ({size=24, className=""}) => <i className={`fas fa-clock ${className}`} style={{fontSize: size}}></i>;
        const FileText = ({size=24, className=""}) => <i className={`fas fa-file-alt ${className}`} style={{fontSize: size}}></i>;
        const CheckCircle = ({size=24, className=""}) => <i className={`fas fa-check-circle ${className}`} style={{fontSize: size}}></i>;
        const AlertCircle = ({size=24, className=""}) => <i className={`fas fa-exclamation-circle ${className}`} style={{fontSize: size}}></i>;
        const Cloud = ({size=24, className=""}) => <i className={`fas fa-cloud ${className}`} style={{fontSize: size}}></i>;

        // ==========================================
        // KONEKSI SUPABASE (URL DAN KEY ASLI ANDA)
        // ==========================================
        const SUPABASE_URL = 'https://xltrmoeabasrconlhijv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kzMgSC5JniUeJZGBGW1RIA_7aKyk0vh';

        let supabase = null;
        window.INIT_ERROR = null;

        // Fungsi koneksi asinkron (Anti-Gagal)
        const getSupabase = async () => {
            if (supabase) return supabase;
            
            if (!window.supabase) {
                try {
                    // Fallback: Jika script diblokir, paksa unduh ulang menggunakan modul native
                    const module = await new Function("return import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm')")();
                    window.supabase = module;
                } catch (e) {
                    throw new Error("Library Supabase diblokir oleh sistem Anda. Tolong matikan ekstensi AdBlock atau ganti browser Anda.");
                }
            }
            
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            window.INIT_ERROR = null;
            return supabase;
        };

        const RichTextEditor = ({ value, onChange, placeholder }) => {
            const editorRef = useRef(null);
            useEffect(() => {
                if (editorRef.current && value !== editorRef.current.innerHTML) editorRef.current.innerHTML = value || '';
            }, []); 
            const handleInput = () => { if (editorRef.current) onChange(editorRef.current.innerHTML); };
            const execCmd = (cmd, e) => {
                e.preventDefault(); 
                document.execCommand(cmd, false, null);
                editorRef.current.focus(); handleInput();
            };
            return (
                <div className="border border-slate-300 rounded-lg overflow-hidden bg-white focus-within:border-emerald-500 focus-within:ring-1">
                    <div className="bg-slate-50 border-b border-slate-300 p-2 flex gap-2">
                        <button onMouseDown={(e)=>execCmd('bold', e)} className="w-8 h-8 font-black shadow-sm bg-white border rounded">B</button>
                        <button onMouseDown={(e)=>execCmd('italic', e)} className="w-8 h-8 italic shadow-sm bg-white border rounded">I</button>
                        <button onMouseDown={(e)=>execCmd('underline', e)} className="w-8 h-8 underline shadow-sm bg-white border rounded">U</button>
                    </div>
                    <div ref={editorRef} contentEditable onInput={handleInput} onBlur={handleInput} onKeyUp={handleInput} onMouseUp={handleInput} className="p-4 min-h-[140px] outline-none rich-text-content" placeholder={placeholder} />
                </div>
            );
        };

        function useStickySession(defaultValue, key) {
          const [value, setValue] = useState(() => {
            const stickyValue = window.localStorage.getItem(key);
            return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
          });
          useEffect(() => { window.localStorage.setItem(key, JSON.stringify(value)); }, [key, value]);
          return [value, setValue];
        }

        const calculateScore = (answers, questions) => {
          let totalPoints = 0;
          let maxPoints = questions.length; 
          
          const detailedResults = questions.map(q => {
            const userAnswer = answers[q.id];
            let isCorrect = false;

            if (!userAnswer) return { qId: q.id, type: q.type, isCorrect: false, isEmpty: true };

            if (q.type === 'MCQ') isCorrect = userAnswer === q.correctAnswer;
            else if (q.type === 'MCMA') {
              if (Array.isArray(userAnswer)) {
                const sortedUser = [...userAnswer].sort();
                const sortedCorrect = [...(q.correctAnswers || [])].sort();
                isCorrect = sortedUser.length === sortedCorrect.length && sortedUser.every((val, index) => val === sortedCorrect[index]);
              }
            } else if (q.type === 'CATEGORY') {
              const statementKeys = (q.statements || []).map(s => s.id);
              const allAnswered = statementKeys.every(id => userAnswer[id]);
              if (allAnswered) isCorrect = q.statements.every(s => userAnswer[s.id] === s.correctCategory);
            }
            if (isCorrect) totalPoints += q.points;
            return { qId: q.id, type: q.type, isCorrect, isEmpty: false };
          });

          const finalScore = maxPoints > 0 ? Math.round((totalPoints / maxPoints) * 100) : 0;
          return { finalScore, totalPoints, maxPoints, detailedResults };
        };

        function App() {
          const [currentRoute, setCurrentRoute] = useState('/'); 
          const [tokens, setTokens] = useState([]);
          const [results, setResults] = useState([]);
          const [questions, setQuestions] = useState([]);
          const [isLoadingData, setIsLoadingData] = useState(false);
          const [dbStatus, setDbStatus] = useState('');
          
          const [activeSession, setActiveSession] = useStickySession(null, 'cbt_active_session');
          const [isAdminLoggedIn, setIsAdminLoggedIn] = useStickySession(false, 'cbt_admin_auth');

          const navigate = (path) => { window.scrollTo(0,0); setCurrentRoute(path); };

          const fetchSupabaseData = async () => {
             setIsLoadingData(true);
             try {
                // Diperbarui: Menggunakan await agar tidak error saat memuat
                const db = await getSupabase();
                
                const [qRes, tRes] = await Promise.all([
                    db.from('questions').select('*').order('number', { ascending: true }),
                    db.from('tokens').select('*').order('generatedAt', { ascending: false })
                ]);
                
                if(qRes.error) throw qRes.error;
                if(tRes.error) throw tRes.error;
                
                if(qRes.data) setQuestions(qRes.data);
                if(tRes.data) setTokens(tRes.data);

                if (isAdminLoggedIn) {
                   const rRes = await db.from('results').select('*').order('created_at', { ascending: false });
                   if(rRes.error) throw rRes.error;
                   if(rRes.data) {
                      const formattedResults = rRes.data.map(r => ({
                         id: r.id,
                         participant: { name: r.participant_name, school: r.participant_school, nis: r.participant_nis, grade: r.participant_grade },
                         token: r.token, score: r.score, startTime: parseInt(r.start_time), endTime: parseInt(r.end_time),
                         detail: { detailedResults: r.detailed_results }, created_at: r.created_at
                      }));
                      setResults(formattedResults);
                   }
                }
                setDbStatus('connected');
             } catch (error) {
                console.error("Fetch error:", error);
                window.INIT_ERROR = error.message;
                setDbStatus('error_url');
             } finally {
                setIsLoadingData(false);
             }
          };

          useEffect(() => { fetchSupabaseData(); }, [isAdminLoggedIn]);

          useEffect(() => {
            if (currentRoute === '/') {
              if (activeSession && activeSession.status === 'ACTIVE') navigate('/exam');
              else navigate('/login');
            }
          }, [currentRoute, activeSession]);

            const ParticipantLogin = () => {
            const [inputToken, setInputToken] = useState('');
            const [error, setError] = useState('');
            const [isChecking, setIsChecking] = useState(false);

            const handleLogin = async (e) => {
              e.preventDefault();
              setIsChecking(true); setError('');
              try {
                const db = await getSupabase();
                const { data: tokenObj, error: fetchErr } = await db.from('tokens').select('*').eq('code', inputToken.trim().toUpperCase()).single();
                
                if (fetchErr || !tokenObj) { setError('Token tidak valid.'); setIsChecking(false); return; }
                if (tokenObj.status === 'USED') { setError('Token sudah digunakan.'); setIsChecking(false); return; }
                if (tokenObj.status === 'EXPIRED') { setError('Token kedaluwarsa.'); setIsChecking(false); return; }

                setActiveSession({ token: tokenObj.code, participant: null, answers: {}, flagged: [], status: 'SETUP' });
                navigate('/identity');
              } catch (err) { setError(err.message || 'Gagal terhubung ke server.'); }
              setIsChecking(false);
            };

            return (
              <div className="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4">
                <div className="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border-t-4 border-emerald-600">
                  <div className="text-center mb-8">
                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4"><Monitor size={32} /></div>
                    <h1 className="text-2xl font-bold text-slate-800 tracking-tight">CBT TKA</h1>
                    <p className="text-slate-500 text-sm">Computer Based Test - Sekolah Dasar</p>
                    
                    {dbStatus === 'error_url' && (
                       <div className="mt-4 text-left p-4 bg-red-50 border-2 border-red-300 rounded-lg text-sm text-red-800">
                          <h3 className="font-bold text-red-600 mb-2 border-b border-red-200 pb-1 flex items-center">
                              <AlertCircle size={16} className="mr-1"/> Diagnosa Error Koneksi
                          </h3>
                          <p className="mb-1"><span className="font-semibold text-slate-600">Penyebab:</span> <br/> {window.INIT_ERROR}</p>
                          <p className="mt-3 text-xs text-red-600 font-bold">Coba muat ulang halaman atau periksa koneksi Anda.</p>
                       </div>
                    )}
                  </div>
                  
                  <form onSubmit={handleLogin} className="space-y-6">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-2">Masukkan Token Ujian</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Key className="text-slate-400" size={20} /></div>
                        <input type="text" disabled={isChecking} className="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-lg focus:ring-emerald-500 uppercase tracking-widest text-center font-bold text-slate-800" placeholder="X-X-X-X" value={inputToken} onChange={(e) => setInputToken(e.target.value.toUpperCase())} required />
                      </div>
                      {error && <p className="mt-2 text-sm text-red-600 flex items-center"><AlertCircle size={14} className="mr-1"/> {error}</p>}
                    </div>
                    <button type="submit" disabled={isChecking || dbStatus==='error_url'} className="w-full py-3 px-4 rounded-lg font-bold text-white bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50">{isChecking ? 'Menghubungkan...' : 'Masuk Ujian'}</button>
                  </form>
                  <div className="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                     <span className="flex items-center"><Cloud className={`mr-1 ${dbStatus === 'connected' ? 'text-emerald-500' : 'text-slate-400'}`}/> Cloud Sync</span>
                     <button onClick={() => navigate('/admin/login')} className="hover:text-emerald-600 font-semibold transition-colors"><i className="fas fa-lock mr-1"></i> Admin Login</button>
                  </div>
                </div>
              </div>
            );
          };

          const ParticipantIdentity = () => {
            const [formData, setFormData] = useState({ name: '', nis: '', school: '', grade: '6', gender: 'L' });
            if (!activeSession || activeSession.status !== 'SETUP') { navigate('/login'); return null; }
            const handleSubmit = (e) => {
              e.preventDefault();
              setActiveSession(prev => ({ ...prev, participant: formData }));
              navigate('/instruction');
            };
            return (
              <div className="min-h-screen bg-slate-50 py-12 flex justify-center"><div className="max-w-xl w-full bg-white rounded-2xl shadow-lg p-8"><h2 className="text-2xl font-bold mb-6">Identitas Peserta</h2><form onSubmit={handleSubmit} className="space-y-5"><div><label className="block text-sm font-semibold">Nama Lengkap *</label><input type="text" required value={formData.name} onChange={e=>setFormData({...formData, name:e.target.value})} className="w-full p-2.5 border rounded-md"/></div><div><label className="block text-sm font-semibold">Asal Sekolah *</label><input type="text" required value={formData.school} onChange={e=>setFormData({...formData, school:e.target.value})} className="w-full p-2.5 border rounded-md"/></div><button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-lg">Lanjutkan</button></form></div></div>
            );
          };

          const ParticipantInstruction = () => {
            const [isStarting, setIsStarting] = useState(false);
            if (!activeSession || !activeSession.participant) { navigate('/login'); return null; }
            const startExam = async () => {
              setIsStarting(true);
              try {
                const db = await getSupabase();
                await db.from('tokens').update({ status: 'USED' }).eq('code', activeSession.token);
                setActiveSession(prev => ({ ...prev, status: 'ACTIVE', startTime: new Date().getTime(), durationLimit: 60 * 60 * 1000 }));
                navigate('/exam');
              } catch (err) { alert("Gagal memulai ujian: " + err.message); setIsStarting(false); }
            };
            return (
              <div className="min-h-screen bg-slate-50 py-12 flex justify-center"><div className="max-w-3xl w-full bg-white rounded-2xl shadow-lg p-8"><h2 className="text-2xl font-bold mb-4">Petunjuk Pengerjaan</h2><p className="mb-6">Waktu pengerjaan 60 menit untuk {questions.length} soal.</p><button onClick={startExam} disabled={isStarting} className="py-3 px-8 bg-emerald-600 text-white font-bold rounded-lg">{isStarting ? 'Memulai...' : 'Mulai Ujian'}</button></div></div>
            );
          };

          const ExamEngine = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            useEffect(() => { if (!activeSession || activeSession.status !== 'ACTIVE') navigate('/'); }, [activeSession]);
            if (!activeSession || questions.length === 0 || !questions[currentIndex]) return <div className="p-8 text-center">Memuat soal...</div>;
            const currentQuestion = questions[currentIndex];
            const currentAnswer = activeSession.answers[currentQuestion.id];
            
            const handleAnswerChange = (val) => {
              setActiveSession(prev => ({ ...prev, answers: { ...prev.answers, [currentQuestion.id]: val } }));
            };

            return (
              <div className="min-h-screen bg-slate-100 flex flex-col">
                <header className="bg-white px-6 py-4 flex justify-between shadow-sm"><h1 className="font-bold">{activeSession.participant?.name}</h1><span className="font-bold text-emerald-600">Soal {currentIndex + 1} dari {questions.length}</span></header>
                <div className="flex-1 max-w-4xl w-full mx-auto p-4"><div className="bg-white p-6 rounded-xl shadow-sm">
                     <div className="text-lg font-medium mb-6 rich-text-content" dangerouslySetInnerHTML={{ __html: currentQuestion.question }} />
                     {currentQuestion.type === 'MCQ' && (currentQuestion.options||[]).map(opt => (
                       <label key={opt.id} className={`flex items-center p-3 border rounded-lg mb-2 cursor-pointer ${currentAnswer === opt.id ? 'bg-emerald-50 border-emerald-500' : ''}`}><input type="radio" checked={currentAnswer === opt.id} onChange={() => handleAnswerChange(opt.id)} className="mr-3" /> {opt.id}. {opt.text}</label>
                     ))}
                     <div className="mt-6 flex justify-between">
                       <button onClick={() => setCurrentIndex(p => Math.max(0, p-1))} className="px-4 py-2 bg-slate-200 rounded">Sebelumnya</button>
                       {currentIndex < questions.length - 1 ? (
                         <button onClick={() => setCurrentIndex(p => p+1)} className="px-4 py-2 bg-emerald-600 text-white rounded">Berikutnya</button>
                       ) : (
                         <button onClick={() => navigate('/review')} className="px-4 py-2 bg-blue-600 text-white rounded">Selesai</button>
                       )}
                     </div>
                </div></div>
              </div>
            );
          };

          const ExamReview = () => {
             const [isSubmitting, setIsSubmitting] = useState(false);
             const handleFinalSubmit = async () => {
               setIsSubmitting(true);
               const result = calculateScore(activeSession.answers, questions);
               const payload = {
                  participant_name: activeSession.participant.name, participant_school: activeSession.participant.school,
                  token: activeSession.token, score: result.finalScore, start_time: activeSession.startTime,
                  end_time: new Date().getTime(), detailed_results: result.detailedResults
               };
               try {
                 const db = await getSupabase();
                 await db.from('results').insert([payload]);
                 setActiveSession({ ...activeSession, status: 'SUBMITTED', score: result.finalScore });
                 navigate('/submitted');
               } catch (err) {
                 alert("Gagal mengirim ujian: " + err.message);
                 setIsSubmitting(false);
               }
             };
             return (
               <div className="min-h-screen bg-slate-50 flex items-center justify-center"><div className="bg-white p-8 rounded-xl shadow-md max-w-md w-full text-center"><h2 className="text-xl font-bold mb-4">Kirim Ujian?</h2><button onClick={handleFinalSubmit} disabled={isSubmitting} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-lg">{isSubmitting ? 'Mengirim...' : 'Ya, Kirim Sekarang'}</button></div></div>
             );
          };

          const ExamSubmitted = () => (
            <div className="min-h-screen flex items-center justify-center"><div className="bg-white p-8 rounded-xl shadow-md text-center"><h2 className="text-2xl font-bold mb-2">Ujian Selesai</h2><button onClick={() => { setActiveSession(null); navigate('/'); }} className="mt-4 px-6 py-2 bg-slate-800 text-white rounded">Keluar</button></div></div>
          );

          const AdminLogin = () => {
            const [u, setU] = useState(''); const [p, setP] = useState('');
            return (
              <div className="min-h-screen bg-slate-900 flex justify-center items-center"><form onSubmit={(e)=>{e.preventDefault(); if(u==='admin'&&p==='bismillah'){setIsAdminLoggedIn(true); navigate('/admin/dashboard');}else alert('Salah');}} className="bg-white p-8 rounded-2xl max-w-sm w-full"><h1 className="text-xl font-bold mb-4">Admin Login</h1><input type="text" placeholder="Username" value={u} onChange={e=>setU(e.target.value)} className="w-full p-2 border rounded mb-2" required/><input type="password" placeholder="Password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-2 border rounded mb-4" required/><button type="submit" className="w-full py-2 bg-emerald-600 text-white font-bold rounded">Login</button></form></div>
            );
          };

          const AdminLayout = ({ children, title }) => {
            if (!isAdminLoggedIn) { navigate('/admin/login'); return null; }
            return (
              <div className="min-h-screen bg-slate-50 flex"><div className="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col"><div className="p-6 font-bold text-white border-b border-slate-800">CBT ADMIN</div><nav className="flex-1 py-4 space-y-1"><button onClick={()=>navigate('/admin/dashboard')} className="w-full text-left px-6 py-2 hover:bg-slate-800">Dashboard</button><button onClick={()=>navigate('/admin/questions')} className="w-full text-left px-6 py-2 hover:bg-slate-800">Bank Soal</button><button onClick={()=>navigate('/admin/tokens')} className="w-full text-left px-6 py-2 hover:bg-slate-800">Token Ujian</button><button onClick={()=>navigate('/admin/results')} className="w-full text-left px-6 py-2 hover:bg-slate-800">Hasil Ujian</button></nav></div><div className="flex-1 flex flex-col"><header className="bg-white shadow-sm px-8 py-4 flex justify-between"><h2 className="font-bold text-lg">{title}</h2><span className="text-xs px-2 py-1 bg-blue-50 text-blue-700 rounded">Cloud Sync Aktif</span></header><main className="p-6 overflow-y-auto">{children}</main></div></div>
            );
          };

          const AdminDashboard = () => (
            <AdminLayout title="Dashboard Server"><div className="grid grid-cols-2 gap-4"><div className="bg-white p-6 rounded-xl border"><h3>Total Soal</h3><p className="text-3xl font-bold">{questions.length}</p></div><div className="bg-white p-6 rounded-xl border"><h3>Ujian Selesai</h3><p className="text-3xl font-bold">{results.length}</p></div></div></AdminLayout>
          );

          const AdminTokens = () => {
             const [custom, setCustom] = useState('');
             const add = async (e) => {
               e.preventDefault();
               try {
                 const db = await getSupabase();
                 await db.from('tokens').insert([{ code: custom.toUpperCase(), status: 'AVAILABLE', generatedAt: new Date().toISOString() }]);
                 setCustom(''); fetchSupabaseData();
               } catch (err) { alert(err.message); }
             };
             return (
               <AdminLayout title="Token Ujian">
                 <form onSubmit={add} className="mb-6 flex gap-2"><input type="text" placeholder="Ketik Token..." value={custom} onChange={e=>setCustom(e.target.value)} className="border p-2 rounded"/><button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded font-bold">Buat</button></form>
                 <div className="bg-white rounded border overflow-hidden"><table className="w-full text-sm"><thead className="bg-slate-50 border-b"><tr><th className="p-3 text-left">Kode</th><th className="p-3 text-left">Status</th></tr></thead><tbody>{tokens.map((t,i)=><tr key={i} className="border-b"><td className="p-3 font-mono font-bold">{t.code}</td><td className="p-3">{t.status}</td></tr>)}</tbody></table></div>
               </AdminLayout>
             );
          };

          const AdminResults = () => (
            <AdminLayout title="Hasil Ujian"><div className="bg-white rounded border overflow-hidden"><table className="w-full text-sm"><thead className="bg-slate-50 border-b"><tr><th className="p-3 text-left">Nama</th><th className="p-3 text-left">Sekolah</th><th className="p-3 text-center">Nilai</th></tr></thead><tbody>{results.map((r,i)=><tr key={i} className="border-b"><td className="p-3">{r.participant?.name}</td><td className="p-3">{r.participant?.school}</td><td className="p-3 text-center font-bold text-emerald-600">{r.score}</td></tr>)}</tbody></table></div></AdminLayout>
          );

          const AdminQuestions = () => {
            const [qText, setQtext] = useState('');
            const save = async (e) => {
               e.preventDefault();
               try {
                 const db = await getSupabase();
                 const newQ = { id: `q${Date.now()}`, number: questions.length+1, type: 'MCQ', category: 'Matematika', question: qText, options: [{id:'A', text:'Pilihan 1'}, {id:'B', text:'Pilihan 2'}, {id:'C', text:'Pilihan 3'}, {id:'D', text:'Pilihan 4'}], correctAnswer: 'A', points: 1 };
                 await db.from('questions').insert([newQ]);
                 setQtext(''); fetchSupabaseData(); alert("Soal berhasil disimpan ke Server!");
               } catch (err) { alert(err.message); }
            };
            return (
              <AdminLayout title="Bank Soal">
                <form onSubmit={save} className="bg-white p-6 rounded border mb-6 space-y-4">
                  <h3 className="font-bold">Tambah Soal Cepat (MCQ)</h3>
                  <textarea placeholder="Ketik Pertanyaan di sini..." value={qText} onChange={e=>setQtext(e.target.value)} className="w-full p-2 border rounded" rows="3" required></textarea>
                  <button type="submit" className="bg-emerald-600 text-white px-4 py-2 rounded font-bold">Push ke Server Supabase</button>
                </form>
                <div className="space-y-3">{questions.map((q,i)=><div key={q.id} className="bg-white p-4 rounded border flex gap-3"><span className="font-bold">{i+1}.</span> <div dangerouslySetInnerHTML={{ __html: q.question }}></div></div>)}</div>
              </AdminLayout>
            );
          };

          switch (currentRoute) {
            case '/': case '/login': return <ParticipantLogin />;
            case '/identity': return <ParticipantIdentity />;
            case '/instruction': return <ParticipantInstruction />;
            case '/exam': return <ExamEngine />;
            case '/review': return <ExamReview />;
            case '/submitted': return <ExamSubmitted />;
            case '/admin': case '/admin/login': return <AdminLogin />;
            case '/admin/dashboard': return <AdminDashboard />;
            case '/admin/tokens': return <AdminTokens />;
            case '/admin/results': return <AdminResults />;
            case '/admin/questions': return <AdminQuestions />;
            default: return <ParticipantLogin />;
          }
        }

        const ReactDOMRoot = ReactDOM.createRoot(document.getElementById('root'));
        ReactDOMRoot.render(<App />);
    </script>
</body>
</html>
