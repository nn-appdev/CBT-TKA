                         const cols = lines[i].split(delimiter);
                         
                         if (cols.length >= 1) {
                              payloads.push({
                                  code: `TKA-${Math.random().toString(36).substring(2,6).toUpperCase()}`,
                                  status: 'AVAILABLE',
                                  participant_name: cols[0]?.replace(/["\r]/g, '').trim() || '',
                                  participant_school: cols[1]?.replace(/["\r]/g, '').trim() || '',
                                  generatedAt: new Date().toISOString()
                              });
                         }
                     }
                     
                     if (payloads.length === 0) {
                          setFileUploadError('Tidak ada data valid di dalam file.');
                          e.target.value = null; // Reset input
                          return;
                     }
                     
                     setIsSaving(true);
                     try {
                          const db = await getSupabase();
                          const { error } = await db.from('tokens').insert(payloads);
                          if (error) throw error;
                          
                          setShowImport(false);
                          await fetchSupabaseData();
                          alert(`Berhasil mengimpor & generate token untuk ${payloads.length} siswa!`);
                     } catch (err) { alert("Gagal Impor: " + err.message); }
                     finally { setIsSaving(false); e.target.value = null; }
                 };
                 reader.readAsText(file);
             };

             const handleManualAdd = async (e) => {
                 e.preventDefault();
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     const newCode = `TKA-${Math.random().toString(36).substring(2,6).toUpperCase()}`;
                     const { error } = await db.from('tokens').insert([{ 
                         code: newCode, 
                         status: 'AVAILABLE',
                         participant_name: manualData.name.trim(),
                         participant_school: manualData.school.trim(),
                         generatedAt: new Date().toISOString()
                     }]);
                     if (error) throw error;
                     setShowManual(false);
                     setManualData({ name: '', school: '' });
                     await fetchSupabaseData();
                 } catch (err) { alert(err.message); }
                 finally { setIsSaving(false); }
             };

             // --- Fitur Aksi Massal (Pilih Semua & Hapus) ---
             const toggleSelectAll = (e) => {
                 if (e.target.checked) setSelectedTokens(actualTokens.map(t => t.code));
                 else setSelectedTokens([]);
             };

             const toggleSelect = (code) => {
                 if (selectedTokens.includes(code)) setSelectedTokens(selectedTokens.filter(c => c !== code));
                 else setSelectedTokens([...selectedTokens, code]);
             };

             const deleteSelected = async () => {
                 if (selectedTokens.length === 0) return;
                 if (!confirm(`Yakin ingin menghapus ${selectedTokens.length} data terpilih secara permanen?`)) return;
                 
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     // Hapus data yang ada di dalam array selectedTokens
                     const { error } = await db.from('tokens').delete().in('code', selectedTokens);
                     if (error) throw error;
                     
                     setSelectedTokens([]);
                     await fetchSupabaseData();
                     alert(`${selectedTokens.length} data berhasil dihapus.`);
                 } catch(err) { alert("Gagal Menghapus: " + err.message); }
                 finally { setIsSaving(false); }
             };

             // --- Fitur Edit Semua Peserta ---
             const startMassEdit = () => {
                 setMassEditTokens(JSON.parse(JSON.stringify(actualTokens)));
                 setIsMassEdit(true);
                 setSelectedTokens([]); // Kosongkan pilihan saat masuk mode edit
             };

             const handleMassEditChange = (index, field, value) => {
                 const newTokens = [...massEditTokens];
                 newTokens[index][field] = value;
                 setMassEditTokens(newTokens);
             };

             const saveMassEdit = async () => {
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     const { error } = await db.from('tokens').upsert(
                         massEditTokens.map(t => ({
                             code: t.code,
                             status: t.status,
                             participant_name: t.participant_name || '',
                             participant_school: t.participant_school || ''
                         }))
                     );
                     if (error) throw error;
                     await fetchSupabaseData();
                     setIsMassEdit(false);
                     alert("Semua data peserta berhasil diperbarui!");
                 } catch (err) { alert(err.message); }
                 finally { setIsSaving(false); }
             };

             const clearAll = async () => {
                if(!confirm("PERINGATAN: Anda yakin ingin menghapus SEMUA token?")) return;
                setIsSaving(true);
                try {
                   const db = await getSupabase();
                   const { error } = await db.from('tokens').delete().not('code', 'ilike', 'SYS_SETTING_%'); 
                   if (error) throw error;
                   await fetchSupabaseData();
                } catch(err) { alert(err.message); }
                finally { setIsSaving(false); }
             };

             const deleteToken = async (code) => {
                 if(!confirm(`Yakin ingin menghapus token ${code}?`)) return;
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     await db.from('tokens').delete().eq('code', code);
                     await fetchSupabaseData();
                 } catch(err) { alert(err.message); }
                 finally { setIsSaving(false); }
             };

             return (
               <AdminLayout title="Data Peserta & Token Ujian">
                 
                 <div className="bg-white p-4 sm:p-5 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-wrap gap-4 items-center justify-between">
                    <div className="flex gap-2 w-full sm:w-auto flex-wrap">
                       <button onClick={() => setShowImport(true)} disabled={isSaving || isMassEdit} className="bg-emerald-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-emerald-700 disabled:opacity-50 flex items-center shadow-sm">
                           <FileText size={16} className="mr-2"/> Unggah Data (Impor)
                       </button>
                       <button onClick={() => setShowManual(true)} disabled={isSaving || isMassEdit} className="bg-blue-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 disabled:opacity-50 flex items-center shadow-sm">
                           <Plus size={16} className="mr-2"/> Tambah Manual
                       </button>
                       {!isMassEdit ? (
                           <button onClick={startMassEdit} disabled={isSaving || actualTokens.length === 0} className="bg-indigo-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50 flex items-center shadow-sm">
                               <Edit size={16} className="mr-2"/> Edit Semua
                           </button>
                       ) : (
                           <div className="flex gap-2">
                               <button onClick={saveMassEdit} disabled={isSaving} className="bg-indigo-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50 flex items-center shadow-sm">
                                   <Save size={16} className="mr-2"/> Simpan Perubahan
                               </button>
                               <button onClick={() => setIsMassEdit(false)} disabled={isSaving} className="bg-slate-100 text-slate-700 border px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-200 disabled:opacity-50">
                                   Batal
                               </button>
                           </div>
                       )}
                    </div>
                    {!isMassEdit && (
                       <button onClick={clearAll} disabled={isSaving} className="w-full sm:w-auto bg-rose-50 text-rose-600 px-4 py-2.5 rounded-lg text-sm font-semibold border border-rose-200 hover:bg-rose-100 disabled:opacity-50 transition-colors flex items-center justify-center">
                           <Trash2 size={16} className="mr-2"/> Bersihkan Semua
                       </button>
                    )}
                 </div>

                 {/* Tombol Aksi Massal (Muncul Jika Ada yang Dipilih) */}
                 {selectedTokens.length > 0 && !isMassEdit && (
                    <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl mb-4 flex items-center justify-between animate-pulse">
                        <span className="font-semibold text-blue-800 text-sm">{selectedTokens.length} Data Terpilih</span>
                        <button onClick={deleteSelected} disabled={isSaving} className="bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm hover:bg-rose-700 transition-colors flex items-center">
                            <Trash2 size={14} className="mr-1.5"/> Hapus Terpilih
                        </button>
                    </div>
                 )}

                 {/* Modal Impor File */}
                 {showImport && (
                     <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col">
                            <div className="bg-slate-50 border-b px-5 py-3 flex justify-between items-center">
                                <h3 className="font-semibold text-slate-800 flex items-center"><Cloud size={18} className="mr-2 text-emerald-600"/> Unggah Data Peserta (CSV)</h3>
                                <button type="button" onClick={()=>setShowImport(false)} className="text-slate-400 hover:text-slate-700"><X size={18}/></button>
                            </div>
                            <div className="p-5 flex-1">
                                <div className="bg-blue-50 text-blue-800 text-sm p-4 rounded-lg border border-blue-100 mb-5">
                                    <strong>Langkah 1:</strong> Unduh format templat resmi di bawah ini. <br/>
                                    <strong>Langkah 2:</strong> Buka dengan Excel, isi 2 kolomnya (Nama & Sekolah), dan simpan kembali dalam format CSV.<br/>
                                    <button type="button" onClick={downloadTemplate} className="mt-3 bg-white border border-blue-300 text-blue-700 px-4 py-2 rounded-lg shadow-sm font-bold hover:bg-blue-100 transition-colors flex items-center">
                                        <FileText size={16} className="mr-2"/> Download Templat (CSV)
                                    </button>
                                </div>
                                
                                <div className="border-2 border-dashed border-slate-300 p-8 rounded-xl text-center bg-slate-50 hover:bg-slate-100 transition-colors relative group">
                                    <input type="file" id="fileUpload" accept=".csv" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <div className="flex flex-col items-center pointer-events-none">
                                        <Cloud size={40} className="text-slate-400 mb-3 group-hover:text-emerald-500 transition-colors"/>
                                        <span className="font-bold text-slate-700 text-base">Klik atau Tarik File CSV ke sini</span>
                                        <span className="text-sm text-slate-500 mt-1">Hanya menerima format .csv</span>
                                    </div>
                                </div>
                                {fileUploadError && <p className="text-rose-500 text-sm mt-3 font-bold text-center bg-rose-50 p-2 rounded-lg border border-rose-100">{fileUploadError}</p>}
                                {isSaving && <p className="text-emerald-600 text-sm mt-3 font-bold text-center animate-pulse">Sedang mengunggah dan membuat token...</p>}
                            </div>
                            <div className="p-4 border-t bg-slate-50 flex justify-end">
                                <button type="button" onClick={()=>setShowImport(false)} className="px-5 py-2.5 text-sm font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-100">Batal / Tutup</button>
                            </div>
                        </div>
                     </div>
                 )}

                 {/* Modal Tambah Manual */}
                 {showManual && (
                    <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden flex flex-col">
                            <div className="bg-slate-50 border-b px-5 py-3 flex justify-between items-center">
                                <h3 className="font-semibold text-slate-800 flex items-center"><User size={18} className="mr-2 text-blue-600"/> Tambah Peserta Manual</h3>
                                <button type="button" onClick={()=>setShowManual(false)} className="text-slate-400 hover:text-slate-700"><X size={18}/></button>
                            </div>
                            <form onSubmit={handleManualAdd} className="p-5">
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Nama Peserta</label>
                                        <input type="text" required value={manualData.name} onChange={e=>setManualData({...manualData, name: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Asal Sekolah</label>
                                        <input type="text" required value={manualData.school} onChange={e=>setManualData({...manualData, school: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm"/>
                                    </div>
                                </div>
                                <div className="mt-6 pt-4 border-t flex justify-end gap-2">
                                    <button type="button" onClick={()=>setShowManual(false)} className="px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50 rounded-lg">Batal</button>
                                    <button type="submit" disabled={isSaving} className="px-4 py-2.5 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg disabled:opacity-50">Simpan & Generate Token</button>
                                </div>
                            </form>
                        </div>
                    </div>
                 )}

                 {/* Tabel Data Peserta */}
                 <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
                    <table className="w-full text-left text-sm min-w-[800px]">
                        <thead className="bg-slate-50 text-slate-600 font-semibold border-b">
                            <tr>
                                {!isMassEdit && (
                                    <th className="p-4 w-12 text-center border-r">
                                        <input type="checkbox" onChange={toggleSelectAll} checked={actualTokens.length > 0 && selectedTokens.length === actualTokens.length} className="w-4 h-4 text-emerald-600 rounded cursor-pointer" />
                                    </th>
                                )}
                                <th className="p-4 w-12 text-center">No</th>
                                <th className="p-4">Nama Murid</th>
                                <th className="p-4">Asal Sekolah</th>
                                <th className="p-4 w-32 font-mono">Kode Token</th>
                                <th className="p-4 w-32 text-center">Status</th>
                                {!isMassEdit && <th className="p-4 w-20 text-center">Aksi</th>}
                            </tr>
                        </thead>
                        <tbody>
                            {isMassEdit ? (
                                massEditTokens.map((t, i) => (
                                    <tr key={t.code} className="border-b border-slate-100 bg-blue-50/20 hover:bg-blue-50/50">
                                        <td className="p-3 text-center font-medium text-slate-500">{i+1}</td>
                                        <td className="p-2"><input type="text" value={t.participant_name} onChange={(e) => handleMassEditChange(i, 'participant_name', e.target.value)} className="w-full p-2.5 text-sm border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white font-semibold"/></td>
                                        <td className="p-2"><input type="text" value={t.participant_school} onChange={(e) => handleMassEditChange(i, 'participant_school', e.target.value)} className="w-full p-2.5 text-sm border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white font-semibold"/></td>
                                        <td className="p-3 font-mono font-bold text-slate-500">{t.code}</td>
                                        <td className="p-2">
                                            <select value={t.status} onChange={(e) => handleMassEditChange(i, 'status', e.target.value)} className="w-full p-2.5 text-xs font-bold border border-blue-200 rounded-lg bg-white">
                                                <option value="AVAILABLE">AVAILABLE</option>
                                                <option value="USED">USED</option>
                                                <option value="EXPIRED">EXPIRED</option>
                                                <option value="BLOCKED">BLOCKED</option>
                                            </select>
                                        </td>
                                    </tr>
                                ))
                            ) : (
                                actualTokens.map((t, i) => (
                                    <tr key={t.code} className={`border-b hover:bg-slate-50 transition-colors ${selectedTokens.includes(t.code) ? 'bg-emerald-50/40 border-emerald-100' : 'border-slate-50'}`}>
                                        <td className="p-4 text-center border-r">
                                            <input type="checkbox" checked={selectedTokens.includes(t.code)} onChange={() => toggleSelect(t.code)} className="w-4 h-4 text-emerald-600 rounded cursor-pointer" />
                                        </td>
                                        <td className="p-4 text-center font-medium text-slate-400">{i+1}</td>
                                        <td className="p-4 font-semibold text-slate-800">{t.participant_name || <span className="text-slate-400 italic text-xs">Belum diisi</span>}</td>
                                        <td className="p-4 text-slate-600">{t.participant_school || <span className="text-slate-400 italic text-xs">-</span>}</td>
                                        <td className="p-4 font-mono font-bold text-indigo-600 tracking-wider bg-indigo-50/30">{t.code}</td>
                                        <td className="p-4 text-center">
                                            <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold uppercase ${t.status === 'AVAILABLE' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : t.status === 'USED' ? 'bg-amber-50 text-amber-600 border border-amber-200' : 'bg-slate-100 text-slate-500 border'}`}>{t.status}</span>
                                        </td>
                                        <td className="p-4 text-center">
                                            <button onClick={()=>deleteToken(t.code)} className="text-rose-500 hover:text-rose-700 p-2 bg-rose-50 hover:bg-rose-100 rounded-lg transition-colors border border-rose-100" title="Hapus Data"><Trash2 size={16}/></button>
                                        </td>
                                    </tr>
                                ))
                            )}
                            {actualTokens.length === 0 && <tr><td colSpan={isMassEdit ? "5" : "7"} className="text-center py-10 text-slate-400 font-medium">Belum ada data peserta. Gunakan fitur "Unggah Data (Impor)" untuk memulai.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminResults = () => {
             const [isSaving, setIsSaving] = useState(false);
             const [selectedAnalysis, setSelectedAnalysis] = useState(null);

             const clearAll = async () => {
                if(!confirm("Yakin menghapus SEMUA riwayat nilai secara permanen?")) return;
                setIsSaving(true);
                try {
                   const db = await getSupabase();
                   const { error } = await db.from('results').delete().not('id', 'is', null); 
                   if (error) throw error;
                   await fetchSupabaseData();
                   alert("Semua riwayat nilai berhasil dihapus.");
                } catch(err) { alert("Gagal menghapus riwayat: " + err.message); }
                finally { setIsSaving(false); }
             };

             return (
               <AdminLayout title="Hasil Ujian">
                 <div className="mb-5 flex justify-end">
                    <button onClick={clearAll} disabled={isSaving} className="bg-rose-50 text-rose-600 px-4 py-2 rounded-lg text-sm font-semibold border border-rose-200 hover:bg-rose-100 disabled:opacity-50 transition-colors"><Trash2 size={16} className="inline mr-1"/> Hapus Riwayat</button>
                 </div>

                 {/* Modal Analisis Siswa */}
                 {selectedAnalysis && (
                    <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
                            <div className="bg-slate-50 border-b px-5 py-4 flex justify-between items-center rounded-t-xl">
                                <div>
                                   <h3 className="font-bold text-slate-800 text-lg">Analisis Jawaban: {selectedAnalysis.participant?.name}</h3>
                                   <p className="text-xs text-slate-500 font-medium">Asal Sekolah: {selectedAnalysis.participant?.school} | Nilai Akhir: <span className="font-bold text-blue-600">{selectedAnalysis.score}</span></p>
                                </div>
                                <button onClick={() => setSelectedAnalysis(null)} className="text-slate-400 hover:text-slate-700 bg-slate-200 hover:bg-slate-300 p-1.5 rounded-full transition-colors"><X size={18}/></button>
                            </div>
                            <div className="p-0 overflow-y-auto flex-1">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead className="bg-slate-100 border-b sticky top-0 z-10">
                                        <tr>
                                            <th className="p-4 w-12 text-center font-bold text-slate-600 border-r border-slate-200">No</th>
                                            <th className="p-4 w-28 font-bold text-slate-600 border-r border-slate-200 text-center">Tipe Soal</th>
                                            <th className="p-4 font-bold text-slate-600 border-r border-slate-200">Kutipan Pertanyaan</th>
                                            <th className="p-4 w-24 text-center font-bold text-slate-600 border-r border-slate-200">Bobot</th>
                                            <th className="p-4 text-center w-32 font-bold text-slate-600">Status Jawaban</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {questions.map((q, i) => {
                                            const d = selectedAnalysis.detail?.detailedResults?.find(x => x.qId === q.id);
                                            return (
                                                <tr key={q.id} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                    <td className="p-4 text-center font-bold text-slate-500 border-r border-slate-100">{i + 1}</td>
                                                    <td className="p-4 text-center border-r border-slate-100">
                                                       <span className="text-[10px] font-bold px-2 py-1 bg-slate-200 text-slate-600 rounded uppercase tracking-wider">{q.type}</span>
                                                    </td>
                                                    <td className="p-4 text-slate-700 border-r border-slate-100">
                                                        <div className="line-clamp-2 rich-text-content text-xs font-medium" dangerouslySetInnerHTML={{__html: q.question}}></div>
                                                    </td>
                                                    <td className="p-4 text-center font-semibold text-slate-600 border-r border-slate-100">{q.points} Poin</td>
                                                    <td className="p-4 text-center">
                                                        {d?.isEmpty ? <span className="text-amber-600 font-bold bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200 flex items-center justify-center text-xs"><AlertCircle size={14} className="mr-1"/> KOSONG</span> :
                                                         d?.isCorrect ? <span className="text-emerald-600 font-bold bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 flex items-center justify-center text-xs"><CheckCircle size={14} className="mr-1"/> BENAR</span> :
                                                         <span className="text-red-600 font-bold bg-red-50 px-3 py-1.5 rounded-lg border border-red-200 flex items-center justify-center text-xs"><X size={14} className="mr-1"/> SALAH</span>}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                 )}

                 <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
                    <table className="w-full text-left text-sm min-w-[600px]">
                        <thead className="bg-slate-50 text-slate-600 font-semibold border-b">
                            <tr><th className="p-4">Nama Peserta</th><th className="p-4">Sekolah</th><th className="p-4 text-center">Token</th><th className="p-4 text-center">Nilai</th><th className="p-4 text-center">Analisis</th><th className="p-4 text-right">Selesai</th></tr>
                        </thead>
                        <tbody>
                            {results.map((r,i)=><tr key={r.id} className="border-b border-slate-50 hover:bg-slate-50/50">
                                <td className="p-4 font-medium text-slate-800">{r.participant?.name}</td>
                                <td className="p-4 text-slate-500">{r.participant?.school}</td>
                                <td className="p-4 text-center"><span className="px-2 py-1 bg-slate-100 text-slate-600 font-mono text-xs rounded border">{r.token}</span></td>
                                <td className="p-4 text-center font-bold text-emerald-600 text-lg">{r.score}</td>
                                <td className="p-4 text-center">
                                    <button onClick={() => setSelectedAnalysis(r)} className="text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">Lihat Detail</button>
                                </td>
                                <td className="p-4 text-right text-slate-400 text-xs font-medium">{new Date(r.created_at).toLocaleString('id-ID')}</td>
                            </tr>)}
                            {results.length===0 && <tr><td colSpan="6" className="text-center py-12 text-slate-400">Belum ada data nilai.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminQuestions = () => {
            const [isSaving, setIsSaving] = useState(false);
            const [view, setView] = useState('folders'); 
            const [filterFolder, setFilterFolder] = useState('Utama');
            const defaultMCQ = { id: '', type: 'MCQ', folder: 'Utama', category: 'Bahasa Indonesia', points: 1, question: '', options: [{id:'A', text:''}, {id:'B', text:''}, {id:'C', text:''}, {id:'D', text:''}], correctAnswer: 'A' };
            const defaultMCMA = { id: '', type: 'MCMA', folder: 'Utama', category: 'Bahasa Indonesia', points: 1, question: '', statements: [{id:1, text:''}, {id:2, text:''}, {id:3, text:''}], correctAnswers: [] };
            const defaultCAT = { id: '', type: 'CATEGORY', folder: 'Utama', category: 'Bahasa Indonesia', points: 1, question: '', statements: [{id:1, text:'', category1:'Benar', category2:'Salah', correctCategory:'Benar'},{id:2, text:'', category1:'Benar', category2:'Salah', correctCategory:'Benar'}] };
            
            const [formData, setFormData] = useState(defaultMCQ);

            useEffect(() => { triggerMathRender(); }, [view, questions, formData.type]);

            const saveQuestion = async (e) => {
               e.preventDefault();
               if(dbStatus === 'error') return alert("Gagal: Koneksi Cloud Offline.");
               setIsSaving(true);
               try {
                 const db = await getSupabase();
                 let payload = { ...formData };
                 if(!payload.id) { 
                    payload.id = `q${Date.now()}`;
                    payload.number = questions.length + 1;
                    const { error } = await db.from('questions').insert([payload]);
                    if(error) throw error;
                 } else { 
                    const { error } = await db.from('questions').update(payload).eq('id', payload.id);
                    if(error) throw error;
                 }
                 await fetchSupabaseData(); 
                 
                 // KUNCI POSISI FOLDER TETAP
                 setFilterFolder(payload.folder || 'Utama'); 
                 setView('list');
               } catch (err) { alert(err.message); }
               finally { setIsSaving(false); }
            };

            const clearAllQuestions = async () => {
                if(!confirm("HAPUS SEMUA BANK SOAL? Aksi ini permanen!")) return;
                setIsSaving(true);
                try {
                   const db = await getSupabase();
                   const { error } = await db.from('questions').delete().not('id', 'is', null); 
                   if (error) throw error;
                   await fetchSupabaseData();
                   alert("Semua soal berhasil dikosongkan.");
                } catch(err) { alert("Gagal mengosongkan soal: " + err.message); }
                finally { setIsSaving(false); }
             };
             
             const deleteQuestion = async (id) => {
                if(!confirm("Hapus soal ini?")) return;
                setIsSaving(true);
                try {
                   const db = await getSupabase();
                   const { error } = await db.from('questions').delete().eq('id', id); 
                   if (error) throw error;
                   await fetchSupabaseData();
                } catch(err) { alert("Gagal menghapus soal: " + err.message); }
                finally { setIsSaving(false); }
             };

             const duplicateQuestion = async (q) => {
                setIsSaving(true);
                try {
                   const db = await getSupabase();
                   const newQ = { ...q, id: `q${Date.now()}`, number: questions.length + 1 };
                   const { error } = await db.from('questions').insert([newQ]);
                   if (error) throw error;
                   await fetchSupabaseData();
                   alert("Soal berhasil diduplikat.");
                } catch(err) { alert("Gagal menyalin soal: " + err.message); }
                finally { setIsSaving(false); }
             };

            const renderOptionsEditor = () => {
                if (formData.type === 'MCQ') {
                    return (
                        <div className="space-y-4 mt-6 border-t pt-4">
                            <h3 className="font-semibold text-slate-800 text-sm">Opsi Jawaban (A-D)</h3>
                            {formData.options.map((opt, idx) => (
                                <div key={opt.id} className="flex gap-3 items-start bg-slate-50 p-3 rounded-lg border border-slate-200">
                                    <div className="pt-2 font-bold text-slate-400 w-6 text-center">{opt.id}.</div>
                                    <div className="flex-1">
                                        <RichTextEditor minHeight="60px" placeholder={`Ketik opsi ${opt.id}...`} value={opt.text} onChange={(v) => { const newOpts = [...formData.options]; newOpts[idx].text = v; setFormData({...formData, options: newOpts}); }} />
                                    </div>
                                </div>
                            ))}
                            <div className="bg-emerald-50 p-4 rounded-lg border border-emerald-100 flex items-center justify-between">
                                <span className="font-medium text-emerald-800 text-sm">Kunci Jawaban Benar:</span>
                                <select value={formData.correctAnswer} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="p-2 border border-emerald-200 rounded font-bold text-emerald-700 bg-white focus:border-emerald-500 text-sm w-24 text-center">
                                    {['A', 'B', 'C', 'D'].map(v => <option key={v} value={v}>{v}</option>)}
                                </select>
                            </div>
                        </div>
                    );
                } else if (formData.type === 'MCMA') {
                    return (
                        <div className="space-y-4 mt-6 border-t pt-4">
                            <h3 className="font-semibold text-slate-800 text-sm flex justify-between">
                                <span>Pernyataan Kompleks (Jawaban &gt; 1)</span>
                                <span className="text-xs font-normal text-slate-500">Centang kotak untuk mengatur sebagai kunci benar</span>
                            </h3>
                            {formData.statements.map((stmt, idx) => (
                                <div key={stmt.id} className={`flex gap-3 items-start p-3 rounded-lg border transition-colors ${formData.correctAnswers.includes(stmt.id) ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'}`}>
                                    <div className="pt-2 flex flex-col items-center gap-2">
                                        <input type="checkbox" checked={formData.correctAnswers.includes(stmt.id)} onChange={() => {
                                            let newAns = [...formData.correctAnswers];
                                            if(newAns.includes(stmt.id)) newAns = newAns.filter(x => x !== stmt.id); else newAns.push(stmt.id);
                                            setFormData({...formData, correctAnswers: newAns});
                                        }} className="w-5 h-5 text-emerald-600 rounded cursor-pointer" />
                                        <span className="font-bold text-slate-400 text-xs">{stmt.id}.</span>
                                    </div>
                                    <div className="flex-1">
                                        <RichTextEditor minHeight="60px" placeholder={`Ketik pernyataan ${stmt.id}...`} value={stmt.text} onChange={(v) => { const newStmts = [...formData.statements]; newStmts[idx].text = v; setFormData({...formData, statements: newStmts}); }} />
                                    </div>
                                </div>
                            ))}
                            <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: formData.statements.length + 1, text:''}]})} className="text-blue-600 font-semibold text-sm hover:underline flex items-center bg-blue-50 px-3 py-2 rounded-lg border border-blue-100"><Plus size={16} className="mr-1"/> Tambah Baris Pernyataan</button>
                        </div>
                    );
                } else if (formData.type === 'CATEGORY') {
                    return (
                        <div className="space-y-4 mt-6 border-t pt-4">
                            <h3 className="font-semibold text-slate-800 text-sm">Pengaturan Tabel Kategori</h3>
                            
                            <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 flex gap-4 items-end">
                                <div className="flex-1">
                                    <label className="block text-slate-600 font-semibold text-xs mb-1">Kategori 1 (Kolom Kiri)</label>
                                    <input type="text" value={formData.statements[0]?.category1 || 'Benar'} onChange={(e) => {
                                        const newStmts = formData.statements.map(s => ({...s, category1: e.target.value}));
                                        setFormData({...formData, statements: newStmts});
                                    }} className="w-full p-2.5 rounded-lg border border-slate-300 bg-white font-medium text-slate-700 text-sm focus:ring-2 focus:ring-blue-500" placeholder="Misal: Fakta"/>
                                </div>
                                <div className="flex-1">
                                    <label className="block text-slate-600 font-semibold text-xs mb-1">Kategori 2 (Kolom Kanan)</label>
                                    <input type="text" value={formData.statements[0]?.category2 || 'Salah'} onChange={(e) => {
                                        const newStmts = formData.statements.map(s => ({...s, category2: e.target.value}));
                                        setFormData({...formData, statements: newStmts});
                                    }} className="w-full p-2.5 rounded-lg border border-slate-300 bg-white font-medium text-slate-700 text-sm focus:ring-2 focus:ring-blue-500" placeholder="Misal: Opini"/>
                                </div>
                            </div>

                            {formData.statements.map((stmt, idx) => (
                                <div key={stmt.id} className="bg-white border border-slate-200 p-4 rounded-xl flex flex-col gap-3 shadow-sm hover:border-blue-300 transition-colors">
                                    <div className="flex gap-3 items-start">
                                        <div className="pt-2 font-bold text-slate-400 w-5 text-center">{idx+1}.</div>
                                        <div className="flex-1">
                                            <RichTextEditor minHeight="60px" placeholder={`Pernyataan tabel ke-${idx+1}...`} value={stmt.text} onChange={(v) => { const newStmts = [...formData.statements]; newStmts[idx].text = v; setFormData({...formData, statements: newStmts}); }} />
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4 bg-slate-50 p-3 rounded-lg border ml-8 text-sm">
                                        <span className="font-semibold text-slate-500">Kunci Benar:</span>
                                        <label className="flex items-center cursor-pointer font-semibold text-emerald-700">
                                            <input type="radio" checked={stmt.correctCategory === stmt.category1} onChange={() => { const newStmts = [...formData.statements]; newStmts[idx].correctCategory = stmt.category1; setFormData({...formData, statements: newStmts}); }} className="w-4 h-4 mr-1.5 text-emerald-600" /> 
                                            {stmt.category1}
                                        </label>
                                        <label className="flex items-center cursor-pointer font-semibold text-amber-700 ml-3">
                                            <input type="radio" checked={stmt.correctCategory === stmt.category2} onChange={() => { const newStmts = [...formData.statements]; newStmts[idx].correctCategory = stmt.category2; setFormData({...formData, statements: newStmts}); }} className="w-4 h-4 mr-1.5 text-amber-600" /> 
                                            {stmt.category2}
                                        </label>
                                    </div>
                                </div>
                            ))}
                            <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: formData.statements.length + 1, text:'', category1: formData.statements[0].category1, category2: formData.statements[0].category2, correctCategory: formData.statements[0].category1}]})} className="text-blue-600 font-semibold text-sm hover:underline flex items-center bg-blue-50 px-3 py-2 rounded-lg border border-blue-100 w-fit"><Plus size={16} className="mr-1"/> Tambah Baris Tabel</button>
                        </div>
                    );
                }
            };

            if (view === 'create' || view === 'edit') {
               return (
                 <AdminLayout title={view === 'create' ? "Buat Soal Baru" : "Edit Soal"}>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-w-4xl mx-auto mb-10">
                        <div className="bg-slate-50 border-b px-6 py-4 flex justify-between items-center">
                            <h2 className="font-semibold text-slate-800 text-sm flex items-center"><Edit className="mr-2 w-4 text-blue-600"/> Editor Soal</h2>
                            <button type="button" onClick={() => setView('list')} className="text-slate-400 hover:text-slate-700 bg-white border p-1 rounded-md"><X size={16}/></button>
                        </div>
                        
                        <form onSubmit={saveQuestion} className="p-6">
                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1">Tipe Soal</label>
                                    <select value={formData.type} onChange={e => {
                                        const type = e.target.value;
                                        if (type === 'MCQ') setFormData({...defaultMCQ, id: formData.id, type, category: formData.category, folder: formData.folder, points: formData.points, question: formData.question});
                                        else if (type === 'MCMA') setFormData({...defaultMCMA, id: formData.id, type, category: formData.category, folder: formData.folder, points: formData.points, question: formData.question});
                                        else setFormData({...defaultCAT, id: formData.id, type, category: formData.category, folder: formData.folder, points: formData.points, question: formData.question});
                                    }} className="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-blue-500 cursor-pointer">
                                        <option value="MCQ">Pilihan Ganda (A-D)</option>
                                        <option value="MCMA">Ganda Kompleks (&gt;1)</option>
                                        <option value="CATEGORY">Matriks Kategori</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1">Folder / Paket</label>
                                    <input type="text" value={formData.folder || 'Utama'} onChange={e => setFormData({...formData, folder: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm font-bold focus:ring-2 focus:ring-blue-500"/>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1">Mata Pelajaran</label>
                                    <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-blue-500">
                                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                                        <option value="Matematika">Matematika</option>
                                        <option value="IPA">IPA</option>
                                        <option value="Umum">Umum</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1">Bobot Nilai</label>
                                    <input type="number" min="1" value={formData.points} required onChange={e => setFormData({...formData, points: parseInt(e.target.value)})} className="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-blue-500"/>
                                </div>
                            </div>

                            <div className="mb-2">
                                <label className="block text-sm font-semibold text-slate-800 mb-2">Pertanyaan Utama</label>
                                <RichTextEditor value={formData.question} onChange={val => setFormData({...formData, question: val})} placeholder="Ketik pertanyaan di sini..." minHeight="120px" />
                            </div>

                            {renderOptionsEditor()}

                            <div className="pt-6 mt-6 border-t border-slate-200 flex justify-end gap-3">
                                <button type="button" onClick={() => setView('list')} className="px-5 py-2.5 rounded-lg font-medium text-slate-600 border border-slate-300 hover:bg-slate-50 text-sm transition-colors">Batal</button>
                                <button type="submit" disabled={isSaving} className="px-6 py-2.5 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 flex items-center text-sm disabled:opacity-50 shadow-sm transition-colors">
                                    <Save size={16} className="mr-2"/> {isSaving ? 'Menyimpan...' : 'Simpan Soal'}
                                </button>
                            </div>
                        </form>
                    </div>
                 </AdminLayout>
               );
            }

            if (view === 'list') {
              const folderQuestions = questions.filter(q => (q.folder || 'Utama') === filterFolder);
              
              return (
                <AdminLayout title={`Folder Soal: ${filterFolder}`}>
                  <div className="mb-6 flex flex-wrap gap-3 items-center justify-between">
                     <button onClick={() => setView('folders')} className="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors">
                       <ChevronLeft size={16} className="mr-1.5" /> Kembali ke Folder
                     </button>
                     <button onClick={clearAllQuestions} disabled={isSaving} className="bg-white text-rose-600 border border-rose-200 hover:bg-rose-50 px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors disabled:opacity-50">
                       <Trash2 size={16} className="mr-1.5" /> Kosongkan Bank Soal
                     </button>
                  </div>

                  <div className="space-y-4">
                    {folderQuestions.map((q, idx) => (
                       <div key={q.id} className="bg-white p-4 sm:p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-4 hover:border-blue-300 transition-colors">
                         <div className="w-10 h-10 flex-shrink-0 bg-slate-50 rounded-lg flex items-center justify-center font-bold text-slate-500 border border-slate-200 text-sm">
                            {idx + 1}
                         </div>
                         <div className="flex-1 overflow-hidden min-w-0">
                            <div className="flex flex-wrap gap-2 mb-3 items-center">
                              <span className="text-[10px] font-bold px-2 py-1 bg-blue-50 text-blue-700 border border-blue-100 rounded uppercase tracking-wider">{q.type}</span>
                              <span className="text-[10px] font-semibold text-slate-600 bg-slate-50 px-2 py-1 rounded border">{q.category}</span>
                            </div>
                            
                            <div className="font-medium text-slate-800 text-sm sm:text-base mb-3 rich-text-content" dangerouslySetInnerHTML={{__html: q.question}}></div>
                            
                            <div className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded border inline-block font-medium">
                              <span className="mr-1">Kunci:</span> 
                              {q.type === 'MCQ' ? <span className="font-bold text-emerald-600">{q.correctAnswer}</span> : 
                               q.type === 'MCMA' ? <span className="font-bold text-blue-600">{JSON.stringify(q.correctAnswers)}</span> : 
                               <span className="font-bold text-indigo-600">Matriks Tabel</span>}
                            </div>
                         </div>
                         <div className="flex sm:flex-col gap-2 justify-end sm:justify-start pt-3 sm:pt-0 shrink-0 border-t sm:border-t-0 sm:border-l border-slate-100 sm:pl-4 mt-2 sm:mt-0">
                            <button onClick={() => duplicateQuestion(q)} className="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 hover:text-emerald-700 p-2 rounded-lg flex items-center justify-center transition-colors text-xs font-semibold flex-1 sm:flex-none border border-emerald-100" title="Salin Soal">
                               <Copy size={14} className="sm:mr-1.5"/> <span className="hidden sm:inline">Duplikat</span>
                            </button>
                            <button onClick={() => {setFormData(q); setView('edit');}} className="bg-blue-50 text-blue-600 hover:bg-blue-100 hover:text-blue-700 p-2 rounded-lg flex items-center justify-center transition-colors text-xs font-semibold flex-1 sm:flex-none border border-blue-100">
                               <Edit size={14} className="sm:mr-1.5"/> <span className="hidden sm:inline">Edit</span>
                            </button>
                            <button onClick={() => deleteQuestion(q.id)} className="bg-rose-50 text-rose-500 hover:bg-rose-100 hover:text-rose-700 p-2 rounded-lg flex items-center justify-center transition-colors text-xs font-semibold flex-1 sm:flex-none border border-rose-100">
                               <Trash2 size={14} className="sm:mr-1.5"/> <span className="hidden sm:inline">Hapus</span>
                            </button>
                         </div>
                       </div>
                    ))}
                    {folderQuestions.length === 0 && (
                       <div className="text-center py-16 bg-white rounded-xl border border-dashed border-slate-300">
                         <Database size={40} className="mx-auto text-slate-300 mb-4"/>
                         <p className="text-slate-500 font-medium text-sm">Belum ada soal tersimpan di folder ini.</p>
                       </div>
                    )}
                  </div>

                  <button onClick={() => {setFormData({...defaultMCQ, folder: filterFolder}); setView('create');}} className="fixed bottom-6 right-6 lg:bottom-10 lg:right-10 z-40 bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl hover:bg-blue-700 hover:scale-105 transition-all focus:ring-4 focus:ring-blue-300" title="Tambah Soal Baru">
                      <Plus size={28} />
                  </button>
                </AdminLayout>
              );
            }

            // Mode Default: Menampilkan Daftar Folder
            const folderStats = questions.reduce((acc, q) => {
                const fname = q.folder || 'Utama';
                acc[fname] = (acc[fname] || 0) + 1;
                return acc;
            }, {});
            
            // Pastikan folder Utama selalu ada meskipun kosong
            if (!folderStats['Utama'] && questions.length === 0) {
                folderStats['Utama'] = 0;
            }

            const handleCreateNewFolder = () => {
                const fname = prompt("Masukkan Nama Folder Baru:\n(Contoh: Paket A, Tryout 1, STS Ganjil)");
                if (fname && fname.trim() !== '') {
                    setFilterFolder(fname.trim());
                    setView('list');
                }
            };

            const publishFolder = async (fname, e) => {
                e.stopPropagation();
                if(!confirm(`Terbitkan folder "${fname}" ke web peserta sekarang?`)) return;
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const { data } = await db.from('tokens').select('code').eq('code', 'SYS_SETTING_FOLDER').maybeSingle();
                    if (data) await db.from('tokens').update({ status: fname }).eq('code', 'SYS_SETTING_FOLDER');
                    else await db.from('tokens').insert([{ code: 'SYS_SETTING_FOLDER', status: fname, generatedAt: new Date().toISOString() }]);
                    
                    setActiveFolder(fname);
                    alert(`Folder "${fname}" berhasil diterbitkan dan siap diakses peserta!`);
                } catch(err) { alert(err.message); }
                finally { setIsSaving(false); }
            };

            return (
              <AdminLayout title="Manajemen Folder Bank Soal">
                 <div className="mb-6">
                    <p className="text-slate-500 text-sm">Pilih folder untuk melihat dan mengelola soal di dalamnya, atau buat folder baru.</p>
                 </div>

                 <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                    <div onClick={handleCreateNewFolder} className="bg-emerald-50 border-2 border-dashed border-emerald-300 rounded-2xl p-6 flex flex-col items-center justify-center text-emerald-600 cursor-pointer hover:bg-emerald-100 hover:border-emerald-400 transition-all min-h-[180px] shadow-sm">
                        <div className="w-12 h-12 bg-emerald-200 text-emerald-700 rounded-full flex items-center justify-center mb-3">
                           <Plus size={24}/>
                        </div>
                        <span className="font-bold text-sm">Buat Folder Baru</span>
                    </div>

                    {Object.entries(folderStats).map(([fname, count]) => (
                        <div key={fname} onClick={() => { setFilterFolder(fname); setView('list'); }} className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 flex flex-col items-center justify-center text-slate-700 cursor-pointer hover:border-blue-400 hover:shadow-md transition-all min-h-[180px] group relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform shadow-inner">
                                <i className="fas fa-folder-open text-3xl"></i>
                            </div>
                            <span className="font-bold text-slate-800 text-center text-base line-clamp-1">{fname}</span>
                            <span className="text-xs font-semibold text-slate-500 mt-1.5 bg-slate-50 px-2.5 py-1 rounded-md border mb-2">{count} Butir Soal</span>
                            
                            {activeFolder === fname ? (
                                <div className="mt-2 bg-emerald-100 text-emerald-700 text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center shadow-sm">
                                    <CheckCircle size={12} className="mr-1"/> Diterbitkan
                                </div>
                            ) : (
                                <button onClick={(e) => publishFolder(fname, e)} disabled={isSaving} className="mt-2 bg-slate-100 text-slate-600 hover:bg-blue-600 hover:text-white text-[11px] font-bold px-3 py-1.5 rounded-full transition-colors flex items-center border border-slate-200 hover:border-blue-600">
                                    <Cloud size={12} className="mr-1"/> Terbitkan Ini
                                </button>
                            )}
                        </div>
                    ))}
                 </div>
              </AdminLayout>
            );
          };

          const AdminItemAnalysis = () => {
            const analysisData = questions.map(q => {
              let correct = 0, wrong = 0, empty = 0;
              results.forEach(r => {
                const d = r.detail?.detailedResults?.find(x => x.qId === q.id);
                if (!d || d.isEmpty) empty++;
                else if (d.isCorrect) correct++;
                else wrong++;
              });
              const total = results.length;
              const percentage = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
              
              let difficulty = "N/A";
              if (total > 0) {
                 const p = parseFloat(percentage);
                 if (p > 85) difficulty = "Sangat Mudah";
                 else if (p >= 70) difficulty = "Mudah";
                 else if (p >= 50) difficulty = "Sedang";
                 else if (p >= 30) difficulty = "Sulit";
                 else difficulty = "Sangat Sulit";
              }
              return { ...q, correct, wrong, empty, total, percentage, difficulty };
            });

            return (
              <AdminLayout title="Analisis Butir Soal & Rekapan Matriks">
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6 flex justify-between items-center">
                   <div>
                     <h3 className="font-semibold text-slate-800 text-lg">Total Responden Ujian</h3>
                     <p className="text-slate-500 text-sm font-medium">Data diolah berdasarkan hasil ujian yang tersubmit.</p>
                   </div>
                   <div className="text-4xl font-bold text-emerald-600">{results.length} <span className="text-lg font-medium text-slate-500">Peserta</span></div>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto mb-8">
                  <table className="w-full text-sm text-left whitespace-nowrap">
                    <thead className="bg-slate-50 text-slate-700 font-semibold border-b">
                      <tr>
                        <th className="py-4 px-4 text-center">No</th>
                        <th className="py-4 px-4">Kategori / Tipe</th>
                        <th className="py-4 px-4">Pertanyaan</th>
                        <th className="py-4 px-4 text-center text-emerald-600">Benar</th>
                        <th className="py-4 px-4 text-center text-red-600">Salah</th>
                        <th className="py-4 px-4 text-center text-amber-600">Kosong</th>
                        <th className="py-4 px-4 text-center">% Benar</th>
                        <th className="py-4 px-4">Tingkat Kesulitan</th>
                      </tr>
                    </thead>
                    <tbody>
                      {analysisData.map((d, idx) => (
                        <tr key={d.id} className="border-b last:border-0 hover:bg-slate-50">
                          <td className="py-3 px-4 text-center font-medium text-slate-500">{idx + 1}</td>
                          <td className="py-3 px-4">
                             <div className="text-xs font-bold">{d.type}</div>
                             <div className="text-xs text-slate-500 font-medium">{d.category}</div>
                          </td>
                          <td className="py-3 px-4 text-slate-800 max-w-xs truncate">
                            <div dangerouslySetInnerHTML={{ __html: d.question }} className="line-clamp-1 rich-text-content text-xs" />
                          </td>
                          <td className="py-3 px-4 text-center font-bold text-emerald-600">{d.correct}</td>
                          <td className="py-3 px-4 text-center font-bold text-red-600">{d.wrong}</td>
                          <td className="py-3 px-4 text-center font-bold text-amber-600">{d.empty}</td>
                          <td className="py-3 px-4 text-center font-bold text-slate-700">{d.percentage}%</td>
                          <td className="py-3 px-4">
                             <span className={`px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wide
                                ${d.difficulty === 'Sangat Mudah' || d.difficulty === 'Mudah' ? 'bg-blue-50 text-blue-600 border border-blue-100' : 
                                  d.difficulty === 'Sedang' ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : 
                                  d.difficulty === 'N/A' ? 'bg-slate-100 text-slate-500 border' : 'bg-red-50 text-red-600 border border-red-100'}`}>
                               {d.difficulty}
                             </span>
                          </td>
                        </tr>
                      ))}
                      {analysisData.length === 0 && <tr><td colSpan="8" className="text-center py-8 text-slate-500">Belum ada data soal.</td></tr>}
                    </tbody>
                  </table>
                </div>

                {/* Matriks Rekapan Jawaban Per Siswa */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 overflow-x-auto relative">
                    <h3 className="font-semibold text-slate-800 text-lg mb-4">Matriks Peta Jawaban per Siswa</h3>
                    <table className="w-full text-sm text-left border-collapse min-w-max">
                        <thead className="bg-slate-50 text-slate-700 border-b">
                            <tr>
                                <th className="p-3 border-r font-semibold sticky left-0 z-10 bg-slate-50 border-b">Nama Siswa</th>
                                {questions.map((q, i) => <th key={q.id} className="p-3 text-center border-r font-semibold w-12 text-slate-500" title={q.question.replace(/<[^>]+>/g, '')}>Q{i+1}</th>)}
                                <th className="p-3 text-center font-bold text-blue-600 bg-blue-50/50">Skor</th>
                            </tr>
                        </thead>
                        <tbody>
                            {results.map((r, i) => (
                                <tr key={r.id} className="border-b hover:bg-slate-50">
                                    <td className="p-3 border-r font-medium text-slate-800 sticky left-0 z-10 bg-white border-b">{r.participant?.name}</td>
                                    {questions.map((q) => {
                                        const d = r.detail?.detailedResults?.find(x => x.qId === q.id);
                                        let icon = <span className="text-slate-300">-</span>;
                                        if (d) {
                                            if (d.isEmpty) icon = <span className="text-amber-500 font-bold">O</span>;
                                            else if (d.isCorrect) icon = <span className="text-emerald-500 font-bold">✓</span>;
                                            else icon = <span className="text-red-500 font-bold">✗</span>;
                                        }
                                        return <td key={q.id} className="p-3 text-center border-r bg-white">{icon}</td>;
                                    })}
                                    <td className="p-3 text-center font-bold text-blue-600 bg-blue-50/30">{r.score}</td>
                                </tr>
                            ))}
                            {results.length === 0 && <tr><td colSpan={questions.length + 2} className="text-center py-6 text-slate-500 font-medium">Belum ada peserta.</td></tr>}
                        </tbody>
                    </table>
                    <div className="mt-4 flex gap-4 text-xs font-medium text-slate-500">
                        <span><b className="text-emerald-500 text-sm">✓</b> : Benar</span>
                        <span><b className="text-red-500 text-sm">✗</b> : Salah</span>
                        <span><b className="text-amber-500 text-sm">O</b> : Kosong</span>
                    </div>
                </div>
              </AdminLayout>
            );
          };

          const AdminReports = () => {
             const [filterSchool, setFilterSchool] = useState('Semua');
             const [filterGrade, setFilterGrade] = useState('Semua');
             const [activeTab, setActiveTab] = useState('NILAI'); 
             
             const schoolList = ['Semua', ...new Set(results.map(r => r.participant?.school).filter(Boolean))];
             const gradeList = ['Semua', ...new Set(results.map(r => r.participant?.grade).filter(Boolean))];
             
             const filteredResults = results.filter(r => {
                 const matchSchool = filterSchool === 'Semua' || r.participant?.school === filterSchool;
                 const matchGrade = filterGrade === 'Semua' || r.participant?.grade === filterGrade;
                 return matchSchool && matchGrade;
             });

             return (
                <AdminLayout title="Cetak Laporan Dokumen (F4)">
                   <div className="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm print:hidden">
                      <div className="flex gap-2 bg-slate-100 p-1.5 rounded-lg w-full sm:w-auto">
                          <button onClick={() => setActiveTab('NILAI')} className={`flex-1 sm:flex-none px-4 py-2 rounded-md text-sm font-bold transition-all ${activeTab === 'NILAI' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Rekap Nilai</button>
                          <button onClick={() => setActiveTab('PELANGGARAN')} className={`flex-1 sm:flex-none px-4 py-2 rounded-md text-sm font-bold transition-all ${activeTab === 'PELANGGARAN' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Laporan Pelanggaran</button>
                      </div>

                      <div className="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto flex-wrap">
                          <div className="flex items-center w-full sm:w-auto">
                             <label className="text-sm font-semibold text-slate-600 mr-2 flex items-center">Sekolah:</label>
                             <select value={filterSchool} onChange={e=>setFilterSchool(e.target.value)} className="border border-slate-300 bg-white rounded-lg p-2 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 cursor-pointer outline-none">
                                {schoolList.map(s => <option key={s} value={s}>{s}</option>)}
                             </select>
                          </div>
                          <div className="flex items-center w-full sm:w-auto">
                             <label className="text-sm font-semibold text-slate-600 mr-2 flex items-center">Kelas:</label>
                             <select value={filterGrade} onChange={e=>setFilterGrade(e.target.value)} className="border border-slate-300 bg-white rounded-lg p-2 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 cursor-pointer outline-none">
                                {gradeList.map(s => <option key={s} value={s}>{s}</option>)}
                             </select>
                          </div>
                          <button onClick={() => window.print()} className="w-full sm:w-auto bg-slate-800 text-white px-5 py-2 rounded-lg font-semibold shadow-md hover:bg-slate-900 transition-colors text-sm flex items-center justify-center">
                             <Printer size={16} className="mr-2"/> Cetak PDF
                          </button>
                      </div>
                   </div>

                   <div className="bg-white border border-slate-200 shadow-md mx-auto w-full max-w-[21.5cm] min-h-[33cm] p-8 sm:p-12 print-container print:border-none print:shadow-none print:p-0 print:m-0">
                      <div className="text-center border-b-2 border-slate-800 pb-4 mb-6">
                         <h1 className="text-xl sm:text-2xl font-bold uppercase tracking-widest text-slate-900 mb-1">
                             {activeTab === 'NILAI' ? 'Laporan Hasil Ujian' : 'Laporan Deteksi Pelanggaran Sistem'}
                         </h1>
                         <p className="text-slate-600 font-medium text-sm sm:text-base">Simulasi Sukses TKA - Komputerisasi</p>
                      </div>
                      
                      <div className="mb-6 flex flex-col sm:flex-row justify-between text-sm sm:text-base font-medium text-slate-800 bg-slate-50 p-4 rounded border border-slate-200">
                         <div>Sekolah: <span className="font-bold underline text-blue-700">{filterSchool}</span> | Kelas: <span className="font-bold underline text-blue-700">{filterGrade}</span></div>
                         <div>Total Peserta: <span className="font-bold">{filteredResults.length}</span> Siswa</div>
                      </div>

                      <table className="w-full text-left border-collapse border border-slate-800 text-sm">
                         <thead className="bg-slate-100 text-slate-900 uppercase font-bold text-xs"><tr className="border-b border-slate-800">
                            <th className="border-r border-slate-800 py-2.5 px-3 text-center w-12">No</th>
                            <th className="border-r border-slate-800 py-2.5 px-3">Nama Peserta</th>
                            <th className="border-r border-slate-800 py-2.5 px-3 text-center w-20">Kelas</th>
                            {activeTab === 'NILAI' ? (
                                <>
                                    <th className="border-r border-slate-800 py-2.5 px-3 text-center w-28">Durasi</th>
                                    <th className="py-2.5 px-3 text-center w-20">Nilai</th>
                                </>
                            ) : (
                                <>
                                    <th className="border-r border-slate-800 py-2.5 px-3 text-center w-28">Status Keamanan</th>
                                    <th className="py-2.5 px-3 text-center w-36">Keluar Layar/Tab</th>
                                </>
                            )}
                         </tr></thead>
                         <tbody>
                            {filteredResults.map((r, i) => {
                               const durSecs = Math.floor((r.endTime - r.startTime) / 1000);
                               const cheats = r.detail?.detailedResults?.find(x => x.qId === 'SYS_CHEATS')?.cheatCount || 0;
                               return (
                               <tr key={i} className="border-b border-slate-800 text-slate-800 font-medium break-inside-avoid">
                                  <td className="border-r border-slate-800 py-2.5 px-3 text-center">{i+1}</td>
                                  <td className="border-r border-slate-800 py-2.5 px-3">{r.participant?.name}</td>
                                  <td className="border-r border-slate-800 py-2.5 px-3 text-center">{r.participant?.grade}</td>
                                  
                                  {activeTab === 'NILAI' ? (
                                      <>
                                          <td className="border-r border-slate-800 py-2.5 px-3 text-center text-xs">{`${Math.floor(durSecs/60)}m ${durSecs%60}s`}</td>
                                          <td className="py-2.5 px-3 text-center font-bold text-blue-700 bg-blue-50/30">{r.score}</td>
                                      </>
                                  ) : (
                                      <>
                                          <td className="border-r border-slate-800 py-2.5 px-3 text-center">
                                              {cheats === 0 ? <span className="text-emerald-600 font-bold">AMAN</span> : <span className="text-red-600 font-bold">TERDETEKSI</span>}
                                          </td>
                                          <td className="py-2.5 px-3 text-center font-bold">
                                              {cheats === 0 ? '-' : <span className="text-red-600">{cheats}x Keluar</span>}
                                          </td>
                                      </>
                                  )}
                               </tr>
                            )})}
                            {filteredResults.length === 0 && <tr><td colSpan="5" className="text-center py-8 text-slate-500 font-medium">Tidak ada data untuk filter ini.</td></tr>}
                         </tbody>
                      </table>
                      <div className="mt-16 flex justify-end text-center text-slate-800 font-medium text-sm break-inside-avoid"><div><p className="mb-16">Mengetahui,<br/>Administrator Sistem</p><p className="font-bold underline">_____________________</p></div></div>
                   </div>
                </AdminLayout>
             );
          };

          switch (currentRoute) {
            case '/': case '/login': return <ParticipantLogin />;
            case '/identity': return <ParticipantIdentity />;
            case '/instruction': return <ParticipantInstruction />;
            case '/exam': return <ExamEngine />;
            case '/review': return <ExamReview />;
            case '/submitted': return <ExamSubmitted />;
            case '/admin': case '/admin/login': return <AdminLogin />;
            case '/admin/dashboard': return <AdminDashboard />;
            case '/admin/tokens': return <AdminTokens />;
            case '/admin/results': return <AdminResults />;
            case '/admin/questions': return <AdminQuestions />;
            case '/admin/analysis': return <AdminItemAnalysis />;
            case '/admin/reports': return <AdminReports />;
            default: return <ParticipantLogin />;
          }
        }

        const ReactDOMRoot = ReactDOM.createRoot(document.getElementById('root'));
        ReactDOMRoot.render(<App />);
    </script>
</body>
</html>
