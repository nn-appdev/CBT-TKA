                            await db.from('tokens').update({ status: trimmed }).eq('code', 'SYS_SETTING_FOLDER');
                            setActiveFolder(trimmed);
                        }
                        await fetchSupabaseData();
                        if (filterFolder === oldName) setFilterFolder(trimmed);
                        alert(`Folder "${oldName}" berhasil diubah menjadi "${trimmed}"`);
                    } catch(err) {
                        alert("Gagal mengubah nama folder: " + err.message);
                    } finally {
                        setIsSaving(false);
                    }
                }
            };

            const deleteFolder = async (e, fname) => {
                e.stopPropagation();
                if (fname === 'Utama') {
                    alert("Folder 'Utama' adalah folder default sistem dan tidak dapat dihapus.");
                    return;
                }
                const count = folderStats[fname] || 0;
                const msg = count > 0 
                    ? `Folder "${fname}" memiliki ${count} butir soal.\nMenghapus folder ini juga akan MENGHAPUS SEMUA ${count} soal di dalamnya dari database.\n\nLanjutkan penghapusan?`
                    : `Hapus folder "${fname}"?`;
                if (!confirm(msg)) return;

                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    await db.from('tokens').delete().eq('status', fname).like('code', 'SYS_FOLDER_%');
                    await db.from('questions').delete().eq('folder', fname);
                    if (activeFolder === fname) {
                        await db.from('tokens').update({ status: 'Utama' }).eq('code', 'SYS_SETTING_FOLDER');
                        setActiveFolder('Utama');
                    }
                    await fetchSupabaseData();
                    alert(`Folder "${fname}" berhasil dihapus.`);
                } catch(err) {
                    alert("Gagal menghapus folder: " + err.message);
                } finally {
                    setIsSaving(false);
                }
            };

            const downloadTemplate = () => {
                const csvContent = "Mapel,Pertanyaan,Opsi A,Opsi B,Opsi C,Opsi D,Kunci\nBahasa Indonesia,Ibu kota Indonesia adalah?,Jakarta,Bandung,Surabaya,Medan,A\n";
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' })));
                link.setAttribute("download", `Template_Soal_${filterFolder}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const handleUploadSoal = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const lines = event.target.result.split('\n').filter(l => l.trim() !== '');
                    const payloads = [];
                    for (let i = (lines[0].toLowerCase().includes('mapel') ? 1 : 0); i < lines.length; i++) {
                        const cols = lines[i].split(',');
                        if (cols.length >= 7) {
                            payloads.push({
                                id: `q${Date.now()}_${i}`,
                                type: 'MCQ',
                                folder: filterFolder,
                                category: cols[0].replace(/["\r]/g, '').trim(),
                                points: 1,
                                question: cols[1].replace(/["\r]/g, '').trim(),
                                options: [
                                    { id: 'A', text: cols[2].replace(/["\r]/g, '').trim() },
                                    { id: 'B', text: cols[3].replace(/["\r]/g, '').trim() },
                                    { id: 'C', text: cols[4].replace(/["\r]/g, '').trim() },
                                    { id: 'D', text: cols[5].replace(/["\r]/g, '').trim() }
                                ],
                                correctAnswer: cols[6].replace(/["\r]/g, '').trim().toUpperCase()
                            });
                        }
                    }
                    if (payloads.length === 0) { setFileError('Format data CSV tidak sesuai.'); return; }
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        await db.from('questions').insert(payloads);
                        setShowImport(false); 
                        await fetchSupabaseData(); 
                        alert('Soal berhasil diunggah ke folder ' + filterFolder);
                    } catch(err) { alert(err.message); }
                    finally { setIsSaving(false); }
                };
                reader.readAsText(file);
            };

            const saveQuestion = async (e) => {
               e.preventDefault();
               setIsSaving(true);
               try {
                 const db = await getSupabase();
                 const targetFolder = formData.folder || filterFolder || 'Utama';
                 let payload = { ...formData, folder: targetFolder };
                 delete payload.status;
                 delete payload.number;

                 if(!payload.id) { 
                    payload.id = `q${Date.now()}`;
                    const { error } = await db.from('questions').insert([payload]);
                    if (error) throw error;
                 } else { 
                    const { error } = await db.from('questions').update(payload).eq('id', payload.id);
                    if (error) throw error;
                 }
                 await fetchSupabaseData();
                 setFilterFolder(targetFolder);
                 setView('list');
               } catch (err) { 
                   alert("Gagal menyimpan soal: " + err.message); 
               } finally { 
                   setIsSaving(false); 
               }
            };

            const deleteQuestion = async (id) => {
                if(!confirm("Hapus soal ini dari database?")) return;
                try { 
                    const db = await getSupabase(); 
                    await db.from('questions').delete().eq('id', id); 
                    await fetchSupabaseData(); 
                } catch(e) { 
                    alert(e.message); 
                }
            };

            const publishFolder = async (fname) => {
                try {
                    const db = await getSupabase();
                    const { data } = await db.from('tokens').select('code').eq('code', 'SYS_SETTING_FOLDER').maybeSingle();
                    if (data) await db.from('tokens').update({ status: fname }).eq('code', 'SYS_SETTING_FOLDER');
                    else await db.from('tokens').insert([{ code: 'SYS_SETTING_FOLDER', status: fname, generatedAt: new Date().toISOString() }]);
                    setActiveFolder(fname);
                    alert(`Folder "${fname}" berhasil diterbitkan untuk peserta!`);
                } catch(e) { alert("Gagal menerbitkan: " + e.message); }
            };

            const renderOptionsEditor = () => {
                if (formData.type === 'MCQ') {
                    return (
                        <div className="space-y-3 pt-4 border-t">
                            <h4 className="font-semibold text-sm">Opsi Jawaban (A-D)</h4>
                            {formData.options.map((opt, idx) => (
                                <div key={opt.id} className="flex gap-3 items-center">
                                    <span className="font-bold w-6">{opt.id}.</span>
                                    <input type="text" value={opt.text} onChange={e => { const o = [...formData.options]; o[idx].text = e.target.value; setFormData({...formData, options: o}); }} className="w-full p-2 border rounded" placeholder={`Teks Opsi ${opt.id}`} required/>
                                </div>
                            ))}
                            <div className="mt-4"><label className="block text-sm font-semibold mb-1 text-emerald-700">Kunci Jawaban Benar</label><select value={formData.correctAnswer} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="p-2 border border-emerald-300 rounded font-bold bg-emerald-50"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div>
                        </div>
                    );
                }
                if (formData.type === 'MCMA') {
                    return (
                        <div className="space-y-3 pt-4 border-t">
                            <h4 className="font-semibold text-sm mb-2">Pernyataan Jawaban Ganda</h4>
                            {formData.statements.map((stmt, idx) => (
                                <div key={stmt.id} className="flex gap-3 items-start mb-2">
                                    <input type="checkbox" checked={formData.correctAnswers?.includes(stmt.id)} onChange={e => {
                                        const c = new Set(formData.correctAnswers || []);
                                        if (e.target.checked) c.add(stmt.id); else c.delete(stmt.id);
                                        setFormData({...formData, correctAnswers: Array.from(c)});
                                    }} className="w-5 h-5 mt-2 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer"/>
                                    <div className="flex-1"><RichTextEditor onChange="{val" value="{stmt.text}"> { const s = [...formData.statements]; s[idx].text = val; setFormData({...formData, statements: s}); }} minHeight="60px" placeholder="Teks pernyataan..."/></div>
                                    <button type="button" onClick={() => setFormData({...formData, statements: formData.statements.filter(s => s.id !== stmt.id)})} className="text-rose-500 p-2 hover:bg-rose-50 rounded"><Trash2 size="{16}"/></button>
                                </div>
                            ))}
                            <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: formData.statements.length + 1, text:''}]})} className="text-blue-600 font-semibold text-sm bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100"><Plus className="inline mr-1" size="{14}"/> Tambah Pernyataan</button>
                        </div>
                    );
                }
                if (formData.type === 'CATEGORY') {
                    return (
                        <div className="space-y-4 pt-4 border-t overflow-x-auto">
                            <h4 className="font-semibold text-sm mb-2">Tabel Matriks Jawaban</h4>
                            <div className="flex gap-4 mb-4 bg-slate-50 p-3 rounded-lg border">
                                <div><label className="text-xs font-bold text-slate-500 block mb-1">Label Kategori 1 (Kiri)</label><input type="text" value={formData.statements[0]?.category1 || 'Benar'} onChange={e => {const s = [...formData.statements]; s.forEach(x => x.category1 = e.target.value); setFormData({...formData, statements: s});}} className="p-1.5 border rounded text-sm"/></div>
                                <div><label className="text-xs font-bold text-slate-500 block mb-1">Label Kategori 2 (Kanan)</label><input type="text" value={formData.statements[0]?.category2 || 'Salah'} onChange={e => {const s = [...formData.statements]; s.forEach(x => x.category2 = e.target.value); setFormData({...formData, statements: s});}} className="p-1.5 border rounded text-sm"/></div>
                            </div>
                            <table className="w-full text-left min-w-[600px]">
                                <thead><tr className="bg-slate-100 border-b text-sm"><th className="p-2 w-10 text-center">Hapus</th><th className="p-2">Teks Baris Pernyataan</th><th className="p-2 text-center bg-emerald-50 w-32">Kunci ke Kat. 1</th><th className="p-2 text-center bg-amber-50 w-32">Kunci ke Kat. 2</th></tr></thead>
                                <tbody>
                                    {formData.statements.map((stmt, idx) => (
                                        <tr key={stmt.id} className="border-b">
                                            <td className="p-2 text-center align-top"><button type="button" onClick={() => setFormData({...formData, statements: formData.statements.filter(s => s.id !== stmt.id)})} className="text-rose-500 p-1 hover:bg-rose-50 rounded"><Trash2 size="{16}"/></button></td>
                                            <td className="p-2 align-top"><RichTextEditor onChange="{val" value="{stmt.text}"> { const s = [...formData.statements]; s[idx].text = val; setFormData({...formData, statements: s}); }} minHeight="50px"/></td>
                                            <td className="p-2 text-center align-middle bg-emerald-50/30"><input type="radio" name={`r_${stmt.id}`} checked={stmt.correctCategory === stmt.category1} onChange={() => { const s = [...formData.statements]; s[idx].correctCategory = stmt.category1; setFormData({...formData, statements: s}); }} className="w-4 h-4"/></td>
                                            <td className="p-2 text-center align-middle bg-amber-50/30"><input type="radio" name={`r_${stmt.id}`} checked={stmt.correctCategory === stmt.category2} onChange={() => { const s = [...formData.statements]; s[idx].correctCategory = stmt.category2; setFormData({...formData, statements: s}); }} className="w-4 h-4"/></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: formData.statements.length + 1, text:'', category1: formData.statements[0]?.category1||'Benar', category2: formData.statements[0]?.category2||'Salah', correctCategory: formData.statements[0]?.category1||'Benar'}]})} className="text-blue-600 font-semibold text-sm bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100"><Plus className="inline mr-1" size="{14}"/> Tambah Baris Tabel</button>
                        </div>
                    );
                }
            };

            if (view === 'create' || view === 'edit') {
               return (
                 <AdminLayout title="Editor Soal">
                    <div className="bg-white rounded-xl shadow-sm border max-w-4xl mx-auto p-6">
                        <form onSubmit={saveQuestion} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div><label className="block text-sm font-semibold mb-1 text-slate-700">Tipe Soal</label><select value={formData.type} onChange={e => {
                                    const t = e.target.value; 
                                    const curFolder = formData.folder || filterFolder;
                                    if(t === 'MCQ') setFormData({...defaultMCQ, type: 'MCQ', folder: curFolder});
                                    else if(t === 'MCMA') setFormData({...defaultMCMA, type: 'MCMA', folder: curFolder});
                                    else if(t === 'CATEGORY') setFormData({...defaultCAT, type: 'CATEGORY', folder: curFolder});
                                }} className="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 font-bold text-blue-700"><option value="MCQ">Pilihan Ganda (A-D)</option><option value="MCMA">Ganda Kompleks (Checkbox)</option><option value="CATEGORY">Matriks Kategori (Tabel)</option></select></div>
                                
                                <div><label className="block text-sm font-semibold mb-1 text-slate-700">Pilih Folder Soal</label><select value={formData.folder || filterFolder} onChange={e => setFormData({...formData, folder: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 font-bold">{availableFolders.map(f => <option key={f} value={f}>{f}</option>)}</select></div>
                                
                                <div><label className="block text-sm font-semibold mb-1 text-slate-700">Bobot Nilai</label><input type="number" min="1" value={formData.points} onChange={e => setFormData({...formData, points: parseInt(e.target.value) || 1})} className="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500"/></div>
                            </div>
                            <div><label className="block text-sm font-semibold mb-2 text-slate-800">Pertanyaan Utama</label><RichTextEditor onChange="{val" value="{formData.question}"> setFormData({...formData, question: val})} /></div>
                            {renderOptionsEditor()}
                            <div className="flex justify-end gap-3 pt-6 border-t"><button type="button" onClick={() => setView('list')} className="px-5 py-2.5 border rounded-lg font-medium hover:bg-slate-50">Batal</button><button type="submit" disabled={isSaving} className="px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow-sm hover:bg-blue-700">{isSaving ? 'Menyimpan...' : 'Simpan Soal'}</button></div>
                        </form>
                    </div>
                 </AdminLayout>
               );
            }

            if (view === 'list') {
              const folderQuestions = questions.filter(q => String(q.folder || 'Utama').trim().toLowerCase() === filterFolder.toLowerCase());
              return (
                <AdminLayout ${filterFolder}`} title="{`Folder:">
                  <div className="mb-6 flex flex-wrap justify-between items-center gap-3">
                     <div className="flex gap-3">
                        <button onClick={() => setView('folders')} className="border px-4 py-2 rounded-lg text-sm font-semibold bg-white hover:bg-slate-50 flex items-center shadow-sm"><ChevronLeft className="mr-1" size="{16}"/> Kembali ke Daftar Folder</button>
                        <button onClick={() => setShowImport(true)} className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center shadow-sm hover:bg-emerald-700"><Upload className="mr-2" size="{16}"/> Unggah Soal (CSV)</button>
                     </div>
                     <button onClick={() => { setFormData({...defaultMCQ, folder: filterFolder}); setView('create'); }} className="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-bold flex items-center shadow-sm hover:bg-blue-700"><Plus className="mr-1.5" size="{16}"/> Buat Soal Baru</button>
                  </div>
                  {showImport && (
                     <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-5">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-slate-800">Impor Soal ke Folder "{filterFolder}"</h3><button onClick={()=>setShowImport(false)}><X size="{18}"/></button></div>
                            <button onClick={downloadTemplate} className="mb-4 bg-blue-50 border text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold flex items-center"><FileText className="mr-2" size="{16}"/> Download Templat Soal</button>
                            <input type="file" accept=".csv" onChange={handleUploadSoal} className="w-full p-4 border-2 border-dashed rounded-xl"/>
                            {fileError && <p className="text-rose-500 text-xs mt-2">{fileError}</p>}
                        </div>
                     </div>
                  )}
                  <div className="space-y-4">
                    {folderQuestions.map((q, idx) => (
                       <div key={q.id} className="bg-white p-5 rounded-xl border flex justify-between items-start shadow-sm">
                         <div className="flex-1 pr-4">
                             <div className="flex items-center gap-2 mb-3">
                                 <span className="text-xs font-bold bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md border border-blue-100">No. {idx+1}</span>
                                 <span className="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">{q.type}</span>
                                 <span className="text-xs font-semibold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-100">Folder: {q.folder || filterFolder}</span>
                             </div>
                             <div className="text-slate-800 rich-text-content" dangerouslySetInnerHTML={{__html: q.question}}></div>
                         </div>
                         <div className="flex flex-col gap-2 flex-shrink-0">
                             <button onClick={() => {setFormData(q); setView('edit');}} className="text-blue-600 p-2 bg-blue-50 hover:bg-blue-100 rounded transition-colors" title="Edit Soal"><Edit size="{16}"/></button>
                             <button onClick={() => deleteQuestion(q.id)} className="text-rose-600 p-2 bg-rose-50 hover:bg-rose-100 rounded transition-colors" title="Hapus Soal"><Trash2 size="{16}"/></button>
                         </div>
                       </div>
                    ))}
                    {folderQuestions.length === 0 && <div className="text-center py-16 text-slate-400 font-medium bg-white rounded-xl border border-dashed">Belum ada butir soal di dalam folder "{filterFolder}". Klik tombol "Buat Soal Baru" di atas untuk menambahkan.</div>}
                  </div>
                </AdminLayout>
              );
            }

            return (
              <AdminLayout title="Manajemen Bank Soal">
                 <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                    <button disabled={isSaving} onClick={createFolder} className="bg-emerald-50 border-2 border-dashed border-emerald-300 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer min-h-[190px] hover:bg-emerald-100 transition-colors disabled:opacity-50 text-center">
                        <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-3"><Plus size="{24}"/></div>
                        <span className="font-bold text-base text-emerald-800">{isSaving ? 'Memproses...' : 'Buat Folder Baru'}</span>
                        <p className="text-xs text-emerald-600 mt-1">Tambah wadah bank soal baru</p>
                    </button>
                    {availableFolders.map((fname) => {
                        const count = folderStats[fname] || 0;
                        const isPublished = activeFolder.toLowerCase() === fname.toLowerCase();
                        return (
                            <div key={fname} className={`bg-white border rounded-2xl p-6 flex flex-col justify-between shadow-sm min-h-[190px] transition-all hover:shadow-md ${isPublished ? 'border-emerald-500 ring-2 ring-emerald-500/20' : 'hover:border-blue-300'}`}>
                                <div>
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center"><FolderIcon size="{20}"/></div>
                                        <div className="flex items-center gap-1">
                                            <button onClick={(e) => renameFolder(e, fname)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-slate-100 rounded-md" title="Ubah Nama Folder"><Edit size="{14}"/></button>
                                            {fname !== 'Utama' && (
                                                <button onClick={(e) => deleteFolder(e, fname)} className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-md" title="Hapus Folder"><Trash2 size="{14}"/></button>
                                            )}
                                        </div>
                                    </div>
                                    <h4 className="font-bold text-lg text-slate-800 truncate" title={fname}>{fname}</h4>
                                    <div className="flex items-center gap-2 mt-1">
                                        <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md">{count} Butir Soal</span>
                                        {isPublished && <span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded">Aktif Diterbitkan</span>}
                                    </div>
                                </div>
                                <div className="mt-5 pt-4 border-t border-slate-100 flex items-center gap-2">
                                    <button onClick={() => { setFilterFolder(fname); setView('list'); }} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition-colors flex items-center justify-center">
                                        <FolderOpenIcon className="mr-1.5" size="{14}"/> Kelola Soal
                                    </button>
                                    <button onClick={() => publishFolder(fname)} className={`py-2 px-3 rounded-lg text-xs font-bold transition-colors ${isPublished ? 'bg-emerald-600 text-white' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'}`} title="Terbitkan folder ini agar dikerjakan peserta">
                                        {isPublished ? 'Diterbitkan' : 'Terbitkan'}
                                    </button>
                                </div>
                            </div>
                        );
                    })}
                 </div>
              </AdminLayout>
            );
          };

          const AdminItemAnalysis = () => {
            return (
              <AdminLayout title="Analisis Soal">
                <div className="bg-white rounded-xl border p-6 shadow-sm">
                   <h3 className="font-bold text-slate-800 text-lg mb-4">Statistik Responden</h3>
                   <p className="text-slate-600 text-sm">Total peserta ujian selesai: <strong className="text-emerald-600 font-bold">{results.length} Siswa</strong></p>
                </div>
              </AdminLayout>
            );
          };

          const AdminReports = () => {
             return (
                <AdminLayout title="Cetak Laporan">
                   <div className="bg-white border rounded-xl p-6 text-center shadow-sm">
                      <button onClick={() => window.print()} className="bg-slate-800 text-white px-6 py-2.5 rounded-lg font-semibold shadow-sm hover:bg-slate-900"><Printer className="inline mr-2" size="{16}"/> Cetak Halaman</button>
                   </div>
                </AdminLayout>
             );
          };

          switch (currentRoute) {
            case '/': case '/login': return <ParticipantLogin/>;
            case '/instruction': return <ParticipantInstruction/>;
            case '/exam': return <ExamEngine/>;
            case '/review': return <ExamReview/>;
            case '/submitted': return <ExamSubmitted/>;
            case '/admin': case '/admin/login': return <AdminLogin/>;
            case '/admin/dashboard': return <AdminDashboard/>;
            case '/admin/tokens': return <AdminTokens/>;
            case '/admin/results': return <AdminResults/>;
            case '/admin/questions': return <AdminQuestions/>;
            case '/admin/analysis': return <AdminItemAnalysis/>;
            case '/admin/reports': return <AdminReports/>;
            default: return <ParticipantLogin/>;
          }
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
