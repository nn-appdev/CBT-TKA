        function useVersionedState(defaultValue, key, version) {
          const [value, setValue] = useState(() => {
            const stickyValue = window.localStorage.getItem(key);
            const savedVersion = window.localStorage.getItem(key + '_v');
            if (stickyValue !== null && savedVersion === String(version)) {
              return JSON.parse(stickyValue);
            }
            window.localStorage.setItem(key + '_v', String(version));
            return defaultValue;
          });
          useEffect(() => {
            window.localStorage.setItem(key, JSON.stringify(value));
            window.localStorage.setItem(key + '_v', String(version));
          }, [key, value, version]);
          return [value, setValue];
        }

        // Keep useStickyState for results and session
        function useStickyState(defaultValue, key) {
          const [value, setValue] = useState(() => {
            const stickyValue = window.localStorage.getItem(key);
            return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
          });
          useEffect(() => {
            window.localStorage.setItem(key, JSON.stringify(value));
          }, [key, value]);
          return [value, setValue];
        }

        const calculateScore = (answers, questions) => {
          let totalPoints = 0;
          let maxPoints = questions.length; 
          
          const detailedResults = questions.map(q => {
            const userAnswer = answers[q.id];
            let isCorrect = false;

            if (!userAnswer) return { qId: q.id, type: q.type, isCorrect: false, isEmpty: true };

            if (q.type === 'MCQ') {
              isCorrect = userAnswer === q.correctAnswer;
            } 
            else if (q.type === 'MCMA') {
              if (Array.isArray(userAnswer)) {
                const sortedUser = [...userAnswer].sort();
                const sortedCorrect = [...q.correctAnswers].sort();
                isCorrect = sortedUser.length === sortedCorrect.length && sortedUser.every((val, index) => val === sortedCorrect[index]);
              }
            } 
            else if (q.type === 'CATEGORY') {
              const statementKeys = q.statements.map(s => s.id);
              const allAnswered = statementKeys.every(id => userAnswer[id]);
              if (allAnswered) {
                isCorrect = q.statements.every(s => userAnswer[s.id] === s.correctCategory);
              }
            }

            if (isCorrect) totalPoints += q.points;
            return { qId: q.id, type: q.type, isCorrect, isEmpty: false };
          });

          const finalScore = Math.round((totalPoints / maxPoints) * 100);
          return { finalScore, totalPoints, maxPoints, detailedResults };
        };

          const [isAdminLoggedIn, setIsAdminLoggedIn] = useStickyState(false, 'cbt_admin_auth');

          const navigate = (path) => setCurrentRoute(path);

          useEffect(() => {
            if (currentRoute === '/') {
              if (activeSession && activeSession.status === 'ACTIVE') {
                navigate('/exam');
              } else {
                navigate('/login');
              }
            }
          }, [currentRoute, activeSession]);

          const ParticipantLogin = () => {
            const [inputToken, setInputToken] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
              e.preventDefault();
              const tokenObj = tokens.find(t => t.code === inputToken.trim());
              
              if (!tokenObj) { setError('Token tidak valid atau tidak ditemukan.'); return; }
              if (tokenObj.status === 'USED') { setError('Token sudah digunakan.'); return; }
              if (tokenObj.status === 'EXPIRED') { setError('Token sudah kedaluwarsa.'); return; }
              if (tokenObj.status === 'BLOCKED') { setError('Token diblokir admin.'); return; }

              setActiveSession({
                token: tokenObj.code,
                participant: null, 
                answers: {},
                flagged: [],
                status: 'SETUP'
              });
              navigate('/identity');
            };

            return (
              <div className="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4">
                <div className="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border-t-4 border-emerald-600">
                  <div className="text-center mb-8">
                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                      <Monitor size={32} />
                    </div>
                    <h1 className="text-2xl font-bold text-slate-800 tracking-tight">CBT TKA</h1>
                    <p className="text-slate-500 text-sm">Computer Based Test - Sekolah Dasar</p>
                  </div>

                  <form onSubmit={handleLogin} className="space-y-6">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-2">Masukkan Token Ujian</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <Key className="text-slate-400" size={20} />
                        </div>
                        <input
                          type="text"
                          className="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 uppercase tracking-widest text-center font-bold text-slate-800 placeholder-slate-300"
                          placeholder="X-X-X-X"
                          value={inputToken}
                          onChange={(e) => setInputToken(e.target.value.toUpperCase())}
                          required
                        />
                      </div>
                      {error && <p className="mt-2 text-sm text-red-600 flex items-center"><AlertCircle size={14} className="mr-1"/> {error}</p>}
                    </div>
                    <button type="submit" className="w-full py-3 px-4 rounded-lg font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-sm transition-colors">
                      Masuk Ujian
                    </button>
                  </form>

                  <div className="mt-8 pt-6 border-t border-slate-100 text-center">
                     <button onClick={() => navigate('/admin/login')} className="text-xs text-slate-400 hover:text-emerald-600 font-semibold transition-colors"><i className="fas fa-lock mr-1"></i> Admin Login</button>
                  </div>
                </div>
              </div>
            );
          };

          const ParticipantIdentity = () => {
            const [formData, setFormData] = useState({ name: '', nis: '', school: '', grade: '6', gender: 'L' });
            const [error, setError] = useState('');

            if (!activeSession || activeSession.status !== 'SETUP') { navigate('/login'); return null; }

            const handleSubmit = (e) => {
              e.preventDefault();
              if(!formData.name || !formData.school) { setError('Nama dan Asal Sekolah wajib diisi.'); return; }
              setActiveSession(prev => ({ ...prev, participant: formData }));
              navigate('/instruction');
            };

            return (
              <div className="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 flex justify-center">
                <div className="max-w-xl w-full bg-white rounded-2xl shadow-lg p-8">
                  <div className="flex items-center mb-6 pb-6 border-b border-slate-200">
                    <User className="text-emerald-600 mr-3" size={28} />
                    <h2 className="text-2xl font-bold text-slate-800">Identitas Peserta</h2>
                  </div>
                  
                  <form onSubmit={handleSubmit} className="space-y-5">
                    {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4">{error}</div>}
                    <div className="grid grid-cols-1 gap-5 sm:grid-cols-2">
                      <div className="sm:col-span-2">
                        <label className="block text-sm font-semibold text-slate-700">Nama Lengkap *</label>
                        <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="mt-1 block w-full rounded-md border-slate-300 focus:border-emerald-500 focus:ring-emerald-500 p-2.5 border bg-slate-50" />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-slate-700">NIS/NISN</label>
                        <input type="text" value={formData.nis} onChange={e => setFormData({...formData, nis: e.target.value})} className="mt-1 block w-full rounded-md border-slate-300 focus:border-emerald-500 focus:ring-emerald-500 p-2.5 border bg-slate-50" />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-slate-700">Asal Sekolah *</label>
                        <input type="text" required value={formData.school} onChange={e => setFormData({...formData, school: e.target.value})} className="mt-1 block w-full rounded-md border-slate-300 focus:border-emerald-500 focus:ring-emerald-500 p-2.5 border bg-slate-50" />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-slate-700">Kelas</label>
                        <select value={formData.grade} onChange={e => setFormData({...formData, grade: e.target.value})} className="mt-1 block w-full rounded-md border-slate-300 focus:border-emerald-500 focus:ring-emerald-500 p-2.5 border bg-slate-50">
                          {[1,2,3,4,5,6].map(g => <option key={g} value={g}>Kelas {g}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-slate-700">Jenis Kelamin</label>
                        <select value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})} className="mt-1 block w-full rounded-md border-slate-300 focus:border-emerald-500 focus:ring-emerald-500 p-2.5 border bg-slate-50">
                          <option value="L">Laki-laki</option>
                          <option value="P">Perempuan</option>
                        </select>
                      </div>
                    </div>
                    <div className="pt-6">
                      <button type="submit" className="w-full py-3 px-4 font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm transition-colors">
                        Lanjutkan
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            );
          };

          const ParticipantInstruction = () => {
            if (!activeSession || !activeSession.participant) { navigate('/login'); return null; }

            const startExam = () => {
              const now = new Date().getTime();
              setActiveSession(prev => ({
                ...prev, status: 'ACTIVE', startTime: now, durationLimit: 60 * 60 * 1000 
              }));
              setTokens(prev => prev.map(t => t.code === activeSession.token ? { ...t, status: 'USED' } : t));
              navigate('/exam');
            };

            return (
              <div className="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 flex justify-center">
                <div className="max-w-3xl w-full bg-white rounded-2xl shadow-lg p-8 border-t-4 border-amber-500">
                   <div className="flex items-center mb-6 pb-4 border-b border-slate-200">
                    <FileText className="text-amber-500 mr-3" size={28} />
                    <h2 className="text-2xl font-bold text-slate-800">Petunjuk Pengerjaan Ujian</h2>
                  </div>
                  
                  <div className="mb-8">
                    <ul className="space-y-3 text-slate-700 text-base">
                      <li className="flex items-start"><CheckCircle className="text-emerald-500 mr-2 mt-0.5" size={18}/> Bacalah setiap soal dengan teliti sebelum menjawab.</li>
                      <li className="flex items-start"><CheckCircle className="text-emerald-500 mr-2 mt-0.5" size={18}/> Total waktu pengerjaan adalah <strong>60 menit</strong> untuk <strong>{questions.length} soal</strong>.</li>
                      <li className="flex items-start"><CheckCircle className="text-emerald-500 mr-2 mt-0.5" size={18}/> Perhatikan bentuk soal:
                        <ul className="mt-2 ml-6 space-y-2 text-sm list-disc">
                          <li><strong>Pilihan Ganda:</strong> Pilih satu jawaban yang paling tepat (A, B, C, atau D).</li>
                          <li><strong>Pilihan Ganda Kompleks (MCMA):</strong> Anda dapat mencentang <strong>lebih dari satu</strong> pernyataan yang benar.</li>
                          <li><strong>Kategori:</strong> Tentukan kategori (misal Benar/Salah) untuk <strong>setiap</strong> pernyataan dalam tabel.</li>
                        </ul>
                      </li>
                      <li className="flex items-start"><CheckCircle className="text-emerald-500 mr-2 mt-0.5" size={18}/> Jawaban Anda akan <strong>tersimpan secara otomatis</strong> saat berpindah soal.</li>
                      <li className="flex items-start"><CheckCircle className="text-emerald-500 mr-2 mt-0.5" size={18}/> Gunakan tombol <strong>Ragu-ragu</strong> jika ingin meninjau ulang soal tersebut nanti.</li>
                      <li className="flex items-start text-red-600 font-bold"><AlertCircle className="text-red-500 mr-2 mt-0.5" size={18}/> Setelah ujian dikirim, jawaban TIDAK dapat diubah kembali.</li>
                    </ul>
                  </div>

                  <div className="bg-blue-50 p-4 rounded-lg flex flex-col sm:flex-row items-center justify-between gap-4 border border-blue-100">
                    <div className="text-sm text-blue-900 text-center sm:text-left">
                      Ujian untuk: <br/><strong className="text-lg">{activeSession.participant.name}</strong> ({activeSession.participant.school})
                    </div>
                    <button onClick={startExam} className="py-3 px-8 rounded-lg text-white font-bold bg-emerald-600 hover:bg-emerald-700 shadow-md transform transition hover:scale-105 w-full sm:w-auto">
                      Mulai Ujian
                    </button>
                  </div>
                </div>
              </div>
            );
          };

          const ExamEngine = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [saveIndicator, setSaveIndicator] = useState(false);

            useEffect(() => {
              if (!activeSession || activeSession.status !== 'ACTIVE') navigate('/');
            }, [activeSession]);

            useEffect(() => {
              if (!activeSession || activeSession.status !== 'ACTIVE') return;
              const calculateTimeLeft = () => {
                const now = new Date().getTime();
                const endTime = activeSession.startTime + activeSession.durationLimit;
                return Math.max(0, Math.floor((endTime - now) / 1000));
              };

              setTimeLeft(calculateTimeLeft());
              const timer = setInterval(() => {
                const remaining = calculateTimeLeft();
                setTimeLeft(remaining);
                if (remaining <= 0) { clearInterval(timer); handleAutoSubmit(); }
              }, 1000);
              return () => clearInterval(timer);
            }, [activeSession]);

            const formatTime = (seconds) => {
              const m = Math.floor(seconds / 60).toString().padStart(2, '0');
              const s = (seconds % 60).toString().padStart(2, '0');
              return `${m}:${s}`;
            };

            if (!activeSession || activeSession.status !== 'ACTIVE' || questions.length === 0) return null;

            const currentQuestion = questions[currentIndex];
            const currentAnswer = activeSession.answers[currentQuestion.id];
            const isFlagged = activeSession.flagged?.includes(currentQuestion.id);

            const handleAnswerChange = (newValue) => {
              setActiveSession(prev => ({
                ...prev, answers: { ...prev.answers, [currentQuestion.id]: newValue }
              }));
              triggerAutoSaveIndicator();
            };

            const triggerAutoSaveIndicator = () => {
              setSaveIndicator(true);
              setTimeout(() => setSaveIndicator(false), 2000);
            };

            const toggleFlag = () => {
              setActiveSession(prev => {
                const isCurrentlyFlagged = prev.flagged?.includes(currentQuestion.id);
                const newFlagged = isCurrentlyFlagged 
                  ? prev.flagged.filter(id => id !== currentQuestion.id)
                  : [...(prev.flagged || []), currentQuestion.id];
                return { ...prev, flagged: newFlagged };
              });
            };

            const handleAutoSubmit = useCallback(() => {
               const result = calculateScore(activeSession.answers, questions);
               const finalSessionData = {
                  ...activeSession, status: 'SUBMITTED', endTime: new Date().getTime(), score: result.finalScore, detail: result
               };
               setResults(prev => [...prev, finalSessionData]);
               setActiveSession(finalSessionData);
               navigate('/submitted');
            }, [activeSession, questions]);

            const RenderMCQ = () => (
              <div className="space-y-3 mt-6">
                {currentQuestion.options.map(opt => (
                  <label key={opt.id} className={`flex items-center p-4 border rounded-xl cursor-pointer transition-colors ${currentAnswer === opt.id ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                    <input type="radio" name={`mcq-${currentQuestion.id}`} value={opt.id} checked={currentAnswer === opt.id} onChange={() => handleAnswerChange(opt.id)} className="w-5 h-5 text-emerald-600 focus:ring-emerald-500" />
                    <span className="ml-4 text-base font-medium text-slate-800"><span className="inline-block w-8 font-bold text-slate-500">{opt.id}.</span> {opt.text}</span>
                  </label>
                ))}
              </div>
            );

            const RenderMCMA = () => {
              const selectedArr = Array.isArray(currentAnswer) ? currentAnswer : [];
              const handleToggle = (stmtId) => {
                let newArr = [...selectedArr];
                if (newArr.includes(stmtId)) newArr = newArr.filter(id => id !== stmtId);
                else newArr.push(stmtId);
                handleAnswerChange(newArr.length > 0 ? newArr : null); 
              };

              return (
                <div className="space-y-3 mt-6">
                  <div className="bg-blue-50 text-blue-800 p-3 rounded-lg text-sm font-medium mb-4 flex items-center border border-blue-100">
                     <AlertCircle size={16} className="mr-2"/> Anda dapat memilih lebih dari satu pernyataan.
                  </div>
                  {currentQuestion.statements.map((stmt, idx) => (
                    <label key={stmt.id} className={`flex items-start p-4 border rounded-xl cursor-pointer transition-colors ${selectedArr.includes(stmt.id) ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                      <div className="flex items-center h-5 mt-1">
                        <input type="checkbox" checked={selectedArr.includes(stmt.id)} onChange={() => handleToggle(stmt.id)} className="w-5 h-5 text-emerald-600 rounded" />
                      </div>
                      <span className="ml-4 text-base text-slate-800"><span className="font-bold text-slate-400 mr-2">{idx + 1}.</span> {stmt.text}</span>
                    </label>
                  ))}
                </div>
              );
            };

            const RenderCATEGORY = () => {
              const catAnswer = currentAnswer || {};
              const cat1Label = currentQuestion.statements[0].category1;
              const cat2Label = currentQuestion.statements[0].category2;
              const handleCatChange = (stmtId, cat) => handleAnswerChange({ ...catAnswer, [stmtId]: cat });

              return (
                <div className="mt-6 overflow-x-auto pb-4">
                   <div className="bg-blue-50 text-blue-800 p-3 rounded-lg text-sm font-medium mb-4 flex items-center border border-blue-100">
                     <AlertCircle size={16} className="mr-2"/> Tentukan kategori untuk SETIAP pernyataan.
                  </div>
                  <table className="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                      <tr className="bg-slate-100 border-b-2 border-slate-200">
                        <th className="py-3 px-4 font-bold text-slate-700 w-12 text-center">No</th>
                        <th className="py-3 px-4 font-bold text-slate-700">Pernyataan</th>
                        <th className="py-3 px-4 font-bold text-slate-700 text-center w-28 bg-emerald-50">{cat1Label}</th>
                        <th className="py-3 px-4 font-bold text-slate-700 text-center w-28 bg-amber-50">{cat2Label}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {currentQuestion.statements.map((stmt, idx) => (
                        <tr key={stmt.id} className="border-b border-slate-200 hover:bg-slate-50">
                          <td className="py-4 px-4 text-slate-500 font-bold text-center">{idx + 1}</td>
                          <td className="py-4 px-4 text-slate-800 font-medium">{stmt.text}</td>
                          <td className="py-4 px-4 text-center bg-emerald-50/30">
                            <input type="radio" name={`cat-${stmt.id}`} checked={catAnswer[stmt.id] === cat1Label} onChange={() => handleCatChange(stmt.id, cat1Label)} className="w-5 h-5 text-emerald-600 cursor-pointer" />
                          </td>
                          <td className="py-4 px-4 text-center bg-amber-50/30">
                            <input type="radio" name={`cat-${stmt.id}`} checked={catAnswer[stmt.id] === cat2Label} onChange={() => handleCatChange(stmt.id, cat2Label)} className="w-5 h-5 text-amber-600 cursor-pointer" />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              );
            };

            return (
              <div className="min-h-screen bg-slate-100 flex flex-col">
                <header className="bg-white shadow-sm px-4 sm:px-6 py-4 flex justify-between items-center sticky top-0 z-10">
                  <div>
                    <h1 className="text-xl font-black text-slate-800 hidden sm:block">CBT TKA</h1>
                    <p className="text-sm font-bold text-slate-500 truncate max-w-[150px] sm:max-w-xs">{activeSession.participant?.name}</p>
                  </div>
                  
                  <div className="flex items-center space-x-2 sm:space-x-6">
                     <div className="hidden sm:flex items-center text-sm font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full transition-opacity duration-300 border border-emerald-200" style={{opacity: saveIndicator ? 1 : 0}}>
                        <CheckCircle size={14} className="mr-1" /> Tersimpan
                     </div>
                    <div className={`flex items-center font-black text-lg sm:text-xl px-4 py-2 rounded-lg border ${timeLeft < 300 ? 'bg-red-50 text-red-600 border-red-200 animate-pulse' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>
                      <Clock size={20} className="mr-2" /> {formatTime(timeLeft)}
                    </div>
                  </div>
                </header>

                <div className="flex-1 flex flex-col lg:flex-row max-w-7xl w-full mx-auto p-4 gap-6 relative">
                  {/* Kolom Soal */}
                  <div className="flex-1 flex flex-col">
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8 flex-1 flex flex-col">
                      <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                        <h2 className="text-xl font-black text-slate-800">Soal {currentIndex + 1}</h2>
                        <div className="flex gap-2">
                           <span className="text-xs font-bold px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-100 uppercase">{currentQuestion.type}</span>
                           <span className="text-xs font-bold px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 border border-slate-200 hidden sm:inline-block">{currentQuestion.category}</span>
                        </div>
                      </div>

                      <div className="flex-1">
                        {currentQuestion.image && (
                          <div className="mb-6 rounded-xl overflow-hidden border border-slate-200 shadow-sm inline-block">
                            <img src={currentQuestion.image} alt="Ilustrasi Soal" className="max-h-64 object-contain bg-slate-50" />
                          </div>
                        )}
                        <div className="text-lg text-slate-800 leading-relaxed font-semibold rich-text-content" dangerouslySetInnerHTML={{ __html: currentQuestion.question }} />
                        
                        {currentQuestion.type === 'MCQ' && <RenderMCQ />}
                        {currentQuestion.type === 'MCMA' && <RenderMCMA />}
                        {currentQuestion.type === 'CATEGORY' && <RenderCATEGORY />}
                      </div>

                      <div className="mt-8 pt-6 border-t border-slate-100 flex flex-wrap justify-between items-center gap-3">
                        <button onClick={() => setCurrentIndex(prev => Math.max(0, prev - 1))} disabled={currentIndex === 0} className="flex items-center px-4 py-2.5 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg disabled:opacity-50 font-bold transition-colors">
                          <ChevronLeft size={18} className="mr-1" /> <span className="hidden sm:inline">Sebelumnya</span>
                        </button>
                        <button onClick={toggleFlag} className={`flex items-center px-4 py-2.5 rounded-lg font-bold border transition-colors ${isFlagged ? 'bg-amber-100 text-amber-700 border-amber-300 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>
                          <Flag size={18} className={`mr-2 ${isFlagged ? 'text-amber-500' : ''}`} /> Ragu-ragu
                        </button>
                        {currentIndex < questions.length - 1 ? (
                          <button onClick={() => setCurrentIndex(prev => Math.min(questions.length - 1, prev + 1))} className="flex items-center px-4 py-2.5 text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm font-bold transition-colors">
                            <span className="hidden sm:inline">Berikutnya</span> <ChevronRight size={18} className="ml-1" />
                          </button>
                        ) : (
                          <button onClick={() => navigate('/review')} className="flex items-center px-6 py-2.5 text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-md font-black transition-colors">
                            Selesai <ChevronRight size={18} className="ml-1" />
                          </button>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Sidebar Navigator */}
                  <div className="lg:w-80 w-full flex-shrink-0">
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 lg:sticky lg:top-24">
                      <h3 className="text-lg font-black text-slate-800 mb-4 flex items-center"><LayoutDashboard size={20} className="mr-2 text-slate-400"/> Navigasi</h3>
                      <div className="grid grid-cols-5 gap-2">
                        {questions.map((q, idx) => {
                          const isAnswered = !!activeSession.answers[q.id] && (q.type === 'CATEGORY' ? Object.keys(activeSession.answers[q.id] || {}).length === 3 : true);
                          const isCurrent = idx === currentIndex;
                          const isFlag = activeSession.flagged?.includes(q.id);
                          
                          let btnClass = "h-10 w-full rounded font-bold text-sm flex items-center justify-center border transition-all ";
                          if (isCurrent) btnClass += "ring-2 ring-blue-500 ring-offset-2 bg-white text-slate-800 border-slate-300";
                          else if (isFlag) btnClass += "bg-amber-400 text-amber-900 border-amber-500";
                          else if (isAnswered) btnClass += "bg-emerald-500 text-white border-emerald-600";
                          else btnClass += "bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200";

                          return (
                            <button key={q.id} onClick={() => setCurrentIndex(idx)} className={btnClass}>
                              {idx + 1}
                            </button>
                          );
                        })}
                      </div>
                      <div className="mt-6 pt-4 border-t border-slate-100 space-y-2 text-xs font-semibold text-slate-600">
                        <div className="flex items-center"><span className="w-4 h-4 bg-emerald-500 rounded mr-2 border border-emerald-600"></span> Sudah Dijawab</div>
                        <div className="flex items-center"><span className="w-4 h-4 bg-amber-400 rounded mr-2 border border-amber-500"></span> Ragu-ragu</div>
                        <div className="flex items-center"><span className="w-4 h-4 bg-slate-100 rounded mr-2 border border-slate-200"></span> Belum Dijawab</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          };

          const ExamReview = () => {
            const [showConfirm, setShowConfirm] = useState(false);
            if (!activeSession || activeSession.status !== 'ACTIVE') { navigate('/'); return null; }

            const totalQ = questions.length;
            const answeredQ = questions.filter(q => {
               const ans = activeSession.answers[q.id];
               if(!ans) return false;
               if(q.type === 'CATEGORY') return Object.keys(ans).length === 3;
               return true;
            }).length;
            const unansweredQ = totalQ - answeredQ;
            const flaggedQ = activeSession.flagged?.length || 0;

            const handleFinalSubmit = () => {
               const result = calculateScore(activeSession.answers, questions);
               const finalSessionData = { ...activeSession, status: 'SUBMITTED', endTime: new Date().getTime(), score: result.finalScore, detail: result };
               setResults(prev => [...prev, finalSessionData]);
               setActiveSession(finalSessionData);
               navigate('/submitted');
            };

            return (
              <div className="min-h-screen bg-slate-50 py-12 px-4 flex justify-center">
                <div className="max-w-2xl w-full bg-white rounded-2xl shadow-lg p-8 border-t-4 border-blue-500">
                  <h2 className="text-2xl font-black text-slate-800 mb-6 text-center">Rekapitulasi Jawaban</h2>
                  
                  <div className="grid grid-cols-2 gap-4 mb-8">
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                      <p className="text-slate-500 text-sm font-bold mb-1">Total Soal</p>
                      <p className="text-3xl font-black text-slate-800">{totalQ}</p>
                    </div>
                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 text-center">
                      <p className="text-emerald-700 text-sm font-bold mb-1">Sudah Dijawab</p>
                      <p className="text-3xl font-black text-emerald-700">{answeredQ}</p>
                    </div>
                    <div className={`p-4 rounded-xl border text-center ${unansweredQ > 0 ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-200'}`}>
                      <p className={`text-sm font-bold mb-1 ${unansweredQ > 0 ? 'text-red-700' : 'text-slate-500'}`}>Belum Dijawab</p>
                      <p className={`text-3xl font-black ${unansweredQ > 0 ? 'text-red-700' : 'text-slate-800'}`}>{unansweredQ}</p>
                    </div>
                    <div className={`p-4 rounded-xl border text-center ${flaggedQ > 0 ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200'}`}>
                      <p className={`text-sm font-bold mb-1 ${flaggedQ > 0 ? 'text-amber-700' : 'text-slate-500'}`}>Ragu-ragu</p>
                      <p className={`text-3xl font-black ${flaggedQ > 0 ? 'text-amber-700' : 'text-slate-800'}`}>{flaggedQ}</p>
                    </div>
                  </div>

                  {unansweredQ > 0 && (
                    <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg flex items-start mb-6">
                      <AlertCircle className="mr-3 mt-0.5 flex-shrink-0" size={20} />
                      <div>
                        <p className="font-bold">Perhatian!</p>
                        <p className="text-sm font-medium">Masih ada {unansweredQ} soal yang belum Anda jawab. Pastikan mengisi semua jawaban.</p>
                      </div>
                    </div>
                  )}

                  {!showConfirm ? (
                    <div className="flex flex-col sm:flex-row gap-4 mt-8">
                      <button onClick={() => navigate('/exam')} className="flex-1 py-3 px-4 bg-white border-2 border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-bold">
                        Kembali ke Soal
                      </button>
                      <button onClick={() => setShowConfirm(true)} className="flex-1 py-3 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold shadow-md">
                        Kirim Ujian Sekarang
                      </button>
                    </div>
                  ) : (
                    <div className="mt-8 p-6 bg-slate-50 border border-slate-200 rounded-xl">
                      <p className="text-center text-slate-800 font-bold mb-6 text-lg">
                        Yakin ingin mengirim jawaban?<br/>
                        <span className="text-red-600 text-sm font-medium mt-1 block">Data tidak dapat diubah setelah dikirim.</span>
                      </p>
                      <div className="flex gap-4 justify-center">
                         <button onClick={() => setShowConfirm(false)} className="py-2.5 px-6 bg-white border border-slate-300 text-slate-700 rounded-lg font-bold">Batal</button>
                        <button onClick={handleFinalSubmit} className="py-2.5 px-6 bg-emerald-600 text-white rounded-lg font-bold shadow-md flex items-center">
                          <CheckCircle size={18} className="mr-2" /> Ya, Kirim Ujian
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          };

          const ExamSubmitted = () => {
            if (!activeSession || activeSession.status !== 'SUBMITTED') { navigate('/'); return null; }
            const p = activeSession.participant;
            const durSecs = Math.floor((activeSession.endTime - activeSession.startTime) / 1000);

            return (
              <div className="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4">
                <div className="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8 text-center border-t-8 border-emerald-500">
                  <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                    <CheckCircle size={40} />
                  </div>
                  <h1 className="text-2xl font-black text-slate-800 mb-2">Ujian Selesai!</h1>
                  <p className="text-slate-500 mb-8 font-medium">Jawaban Anda berhasil disimpan di server.</p>

                  <div className="bg-slate-50 p-6 rounded-xl text-left space-y-3 mb-8 border border-slate-200">
                    <div className="flex justify-between border-b border-slate-200 pb-2"><span className="text-slate-500 font-semibold">Nama</span><span className="font-bold text-slate-800">{p.name}</span></div>
                    <div className="flex justify-between border-b border-slate-200 pb-2"><span className="text-slate-500 font-semibold">Sekolah</span><span className="font-bold text-slate-800">{p.school}</span></div>
                    <div className="flex justify-between border-b border-slate-200 pb-2"><span className="text-slate-500 font-semibold">Waktu</span><span className="font-bold text-slate-800">{Math.floor(durSecs/60)}m {durSecs%60}s</span></div>
                    <div className="flex justify-between"><span className="text-slate-500 font-semibold">Status</span><span className="font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded text-xs border border-emerald-200">SUBMITTED</span></div>
                  </div>

                  <button onClick={() => { setActiveSession(null); navigate('/'); }} className="w-full py-3 px-4 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg shadow-md">Kembali ke Beranda</button>
                </div>
              </div>
            );
          };

          const AdminLogin = () => {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [err, setErr] = useState('');

            const handleLogin = (e) => {
              e.preventDefault();
              if (u === 'admin' && p === 'bismillah') {
                setIsAdminLoggedIn(true);
                navigate('/admin/dashboard');
              } else setErr('Username atau password salah.');
            };

            return (
              <div className="min-h-screen bg-slate-900 flex justify-center items-center p-4">
                <div className="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-8">
                   <div className="text-center mb-6">
                    <div className="w-14 h-14 bg-emerald-500 text-white rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg"><Settings size={28} /></div>
                    <h1 className="text-2xl font-black text-slate-800">Admin Panel</h1>
                  </div>
                  <form onSubmit={handleLogin} className="space-y-4">
                    {err && <div className="text-red-600 text-sm text-center bg-red-50 p-2 rounded-lg font-bold border border-red-200">{err}</div>}
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-1">Username</label>
                      <input type="text" value={u} onChange={e=>setU(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 bg-slate-50" required/>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-1">Password</label>
                      <input type="password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 bg-slate-50" required/>
                    </div>
                    <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700 mt-4 shadow-md">Login</button>
                  </form>
                   <button onClick={()=>navigate('/')} className="w-full mt-6 text-sm font-semibold text-slate-400 hover:text-slate-600">Kembali ke Web Peserta</button>
                </div>
              </div>
            );
          };

          const AdminLayout = ({ children, title }) => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            if (!isAdminLoggedIn) { navigate('/admin/login'); return null; }

            const menu = [
              { id: 'dashboard', label: 'Dashboard', icon: LayoutDashboard, path: '/admin/dashboard' },
              { id: 'questions', label: 'Bank Soal', icon: Database, path: '/admin/questions' },
              { id: 'tokens', label: 'Token Ujian', icon: Key, path: '/admin/tokens' },
              { id: 'results', label: 'Hasil Ujian', icon: CheckSquare, path: '/admin/results' },
              { id: 'analysis', label: 'Analisis Soal', icon: BarChart2, path: '/admin/analysis' },
              { id: 'reports', label: 'Cetak Laporan', icon: Printer, path: '/admin/reports' },
              { id: 'publish', label: 'Deploy ke GitHub', icon: Save, path: '/admin/publish' },
            ];

            return (
              <div className="min-h-screen bg-slate-50 flex print:block">
                {isMobileMenuOpen && (
                  <div className="fixed inset-0 bg-slate-900/60 z-40 md:hidden print:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>
                )}

                <div className={`fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 transition-transform duration-300 ease-in-out print:hidden shadow-xl md:shadow-none`}>
                  <div className="p-6 flex items-center justify-between border-b border-slate-800">
                    <div className="flex items-center">
                      <Settings className="text-emerald-500 mr-3" size={24}/>
                      <span className="text-white font-black text-lg tracking-wide">CBT ADMIN</span>
                    </div>
                    <button className="md:hidden text-slate-400 hover:text-white" onClick={() => setIsMobileMenuOpen(false)}><XIcon size={24}/></button>
                  </div>
                  <nav className="flex-1 py-4 space-y-1 overflow-y-auto">
                    {menu.map(m => (
                      <button key={m.id} onClick={() => { setIsMobileMenuOpen(false); navigate(m.path); }} className={`w-full flex items-center px-6 py-3 text-sm font-bold transition-colors ${currentRoute.startsWith(m.path) ? 'bg-emerald-600/20 text-emerald-400 border-r-4 border-emerald-500' : 'hover:bg-slate-800 hover:text-white'} ${m.id === 'publish' ? 'text-amber-400 mt-4 border-t border-slate-800' : ''}`}>
                        <m.icon size={18} className="mr-3" /> {m.label}
                      </button>
                    ))}
                  </nav>
                  <div className="p-4 border-t border-slate-800">
                     <button onClick={() => { setIsAdminLoggedIn(false); navigate('/admin/login'); }} className="w-full flex items-center px-4 py-2 text-sm font-bold text-slate-400 hover:text-white hover:bg-red-500/20 hover:text-red-400 rounded-md transition-colors">
                        <LogOut size={18} className="mr-3" /> Keluar
                     </button>
                  </div>
                </div>

                <div className="flex-1 flex flex-col h-screen overflow-hidden print:h-auto print:overflow-visible print:block">
                  <header className="bg-white shadow-sm px-4 sm:px-8 py-4 flex justify-between items-center z-10 sticky top-0 print:hidden border-b border-slate-200">
                    <div className="flex items-center gap-3">
                      <button className="md:hidden text-slate-600 hover:text-slate-900 p-1" onClick={() => setIsMobileMenuOpen(true)}>
                        <MenuIcon size={24} />
                      </button>
                      <h2 className="text-lg sm:text-2xl font-black text-slate-800 truncate">{title}</h2>
                    </div>
                    <div className="flex items-center text-xs sm:text-sm font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                      Mode Admin Aktif
                    </div>
                  </header>
                  <main className="flex-1 overflow-y-auto p-4 sm:p-8 bg-slate-50 print:overflow-visible print:p-0 print:block print:bg-white">
                    {children}
                  </main>
                </div>
              </div>
            );
          };

          const AdminDashboard = () => {
            const completedExams = results.length;
            const avgScore = results.length > 0 ? (results.reduce((acc, curr) => acc + curr.score, 0) / results.length).toFixed(1) : 0;
            return (
              <AdminLayout title="Dashboard">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                  <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center mb-4"><Users size={24}/></div>
                    <h3 className="text-slate-500 text-sm font-bold">Ujian Selesai</h3>
                    <p className="text-3xl font-black text-slate-800">{completedExams}</p>
                  </div>
                  <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center mb-4"><CheckSquare size={24}/></div>
                    <h3 className="text-slate-500 text-sm font-bold">Rata-rata Nilai</h3>
                    <p className="text-3xl font-black text-slate-800">{avgScore}</p>
                  </div>
                  <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-lg flex items-center justify-center mb-4"><Key size={24}/></div>
                    <h3 className="text-slate-500 text-sm font-bold">Token Tersedia</h3>
                    <p className="text-3xl font-black text-slate-800">{tokens.filter(t => t.status === 'AVAILABLE').length}</p>
                  </div>
                   <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div className="w-12 h-12 bg-purple-50 text-purple-600 rounded-lg flex items-center justify-center mb-4"><Database size={24}/></div>
                    <h3 className="text-slate-500 text-sm font-bold">Total Bank Soal</h3>
                    <p className="text-3xl font-black text-slate-800">{questions.length}</p>
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                  <h3 className="text-lg font-bold text-slate-800 mb-4">Aktivitas Terbaru</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm text-left">
                      <thead className="bg-slate-50 text-slate-600 font-bold border-b">
                        <tr>
                          <th className="py-3 px-4">Nama</th>
                          <th className="py-3 px-4">Sekolah</th>
                          <th className="py-3 px-4 text-center">Nilai</th>
                          <th className="py-3 px-4 text-right">Waktu</th>
                        </tr>
                      </thead>
                      <tbody>
                        {results.slice(-5).reverse().map((r, i) => (
                          <tr key={i} className="border-b last:border-0 hover:bg-slate-50">
                            <td className="py-3 px-4 font-bold text-slate-800">{r.participant?.name}</td>
                            <td className="py-3 px-4 text-slate-600">{r.participant?.school}</td>
                            <td className="py-3 px-4 font-black text-emerald-600 text-center">{r.score}</td>
                            <td className="py-3 px-4 text-slate-500 text-right">{new Date(r.endTime).toLocaleTimeString()}</td>
                          </tr>
                        ))}
                        {results.length === 0 && <tr><td colSpan="4" className="text-center py-8 text-slate-500 font-medium">Belum ada peserta ujian.</td></tr>}
                      </tbody>
                    </table>
                  </div>
                </div>
              </AdminLayout>
            );
          };

          const AdminPublish = () => {
            const [isExporting, setIsExporting] = useState(false);

            const downloadUpdatedHtml = async () => {
                setIsExporting(true);
                try {
                    // Coba ambil source asli via fetch (jalan jika di hosting/lokal server)
                    let html = '';
                    try {
                        const res = await fetch(window.location.href);
                        html = await res.text();
                    } catch (e) {
                        // Fallback jika dibuka via double-click file://
                        const clone = document.cloneNode(true);
                        clone.getElementById('root').innerHTML = ''; // bersihkan state render react
                        const tailwindStyle = clone.getElementById('tailwindcss-stylesheet') || clone.querySelector('style[data-tailwind]');
                        if(tailwindStyle) tailwindStyle.remove();
                        html = "<!DOCTYPE html>\n" + clone.documentElement.outerHTML;
                    }

                    const startMarker = "// --- DB_MARKER_START ---";
                    const endMarker = "// --- DB_MARKER_END ---";
                    const startIndex = html.indexOf(startMarker);
                    const endIndex = html.indexOf(endMarker);
                    
                    if (startIndex !== -1 && endIndex !== -1) {
                        const newVersion = Date.now();
                        const newDbCode = `// --- DB_MARKER_START ---\n        const APP_DATA_VERSION = ${newVersion};\n        const INITIAL_QUESTIONS = ${JSON.stringify(questions, null, 2)};\n        const INITIAL_TOKENS = ${JSON.stringify(tokens, null, 2)};\n        // --- DB_MARKER_END ---`;
                        
                        const newHtml = html.substring(0, startIndex) + newDbCode + html.substring(endIndex + endMarker.length);
                        
                        const blob = new Blob([newHtml], { type: 'text/html' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'index.html';
                        a.click();
                        URL.revokeObjectURL(url);
                    } else {
                        alert("Gagal menemukan struktur penyimpanan di dalam file. Pastikan kode sumber tidak dimodifikasi.");
                    }
                } catch (error) {
                    console.error(error);
                    alert("Terjadi kesalahan saat membuat file.");
                } finally {
                    setIsExporting(false);
                }
            };

            return (
              <AdminLayout title="Deploy & Simpan Permanen">
                 <div className="max-w-2xl bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                    <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mb-6 border border-amber-200 shadow-sm">
                       <Save size={32} />
                    </div>
                    <h2 className="text-2xl font-black text-slate-800 mb-4">Simpan Perubahan ke GitHub</h2>
                    
                    <div className="prose text-slate-600 mb-8 font-medium">
                       <p>Karena aplikasi ini berjalan tanpa database server, perubahan pada <strong>Bank Soal</strong> dan <strong>Token</strong> yang Anda buat <b>hanya tersimpan sementara</b> di perangkat ini.</p>
                       <p>Agar soal yang baru Anda buat muncul saat diakses siswa melalui link GitHub Anda, lakukan 2 langkah mudah ini:</p>
                       
                       <ol className="list-decimal pl-5 space-y-3 mt-4 text-slate-800">
                          <li>Klik tombol di bawah ini untuk <strong>mengunduh file index.html terbaru</strong> yang sudah tertanam soal-soal editan Anda.</li>
                          <li>Buka akun GitHub Anda, lalu <strong>Upload (Replace) file index.html lama</strong> Anda dengan file yang baru saja diunduh.</li>
                       </ol>
                    </div>

                    <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 flex items-start mb-8">
                       <Monitor className="text-blue-600 mr-3 mt-1 flex-shrink-0" size={24}/>
                       <div className="text-sm text-blue-800">
                         <strong>Catatan:</strong> Data "Hasil Ujian" siswa tidak akan ikut tersimpan ke dalam file ini, karena setiap siswa menyimpan hasil ujian di perangkat mereka masing-masing.
                       </div>
                    </div>

                    <button 
                       onClick={downloadUpdatedHtml} 
                       disabled={isExporting}
                       className="w-full sm:w-auto px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-lg flex items-center justify-center transition-all hover:scale-105 disabled:opacity-70"
                    >
                       {isExporting ? 'Memproses File...' : <><Save className="mr-2" size={20}/> Unduh index.html Terkini</>}
                    </button>
                 </div>
              </AdminLayout>
            );
          };

          // Render Router
          switch (currentRoute) {
            case '/': 
            case '/login': return <ParticipantLogin />;
            case '/identity': return <ParticipantIdentity />;
            case '/instruction': return <ParticipantInstruction />;
            case '/exam': return <ExamEngine />;
            case '/review': return <ExamReview />;
            case '/submitted': return <ExamSubmitted />;
            case '/admin':
            case '/admin/login': return <AdminLogin />;
            case '/admin/dashboard': return <AdminDashboard />;
            case '/admin/tokens': return <AdminTokens />;
            case '/admin/results': return <AdminResults />;
            case '/admin/analysis': return <AdminItemAnalysis />;
            case '/admin/questions': return <AdminQuestions />;
            case '/admin/reports': return <AdminReports />;
            case '/admin/publish': return <AdminPublish />;
            default: return <ParticipantLogin />;
          }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
