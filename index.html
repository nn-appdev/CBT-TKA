                       <div className="p-8 bg-slate-50"><div className="bg-white rounded-2xl shadow-sm border p-8"><div dangerouslySetInnerHTML={{ __html: prev.question || '' }} className="text-lg font-semibold rich-text-content"></div></div></div>
                     </div>
                   </div>
                 )}
               </AdminLayout>
             );
          };

          const AdminAnalysis = () => {
            const data = questions.map(q => {
              let b=0, s=0, k=0;
              results.forEach(r => { const d = r.detail?.detailedResults?.find(x => x.qId === q.id); if(!d || d.isEmpty) k++; else if(d.isCorrect) b++; else s++; });
              const t = results.length;
              const p = t>0 ? ((b/t)*100).toFixed(1) : 0;
              return { ...q, b, s, k, t, p };
            });
            return (
              <AdminLayout title="Analisis Butir Soal">
                 <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6 flex justify-between"><h3 className="font-black text-lg">Total Responden</h3><div className="text-3xl font-black text-emerald-600">{results.length}</div></div>
                 <div className="bg-white rounded-xl shadow-sm border overflow-x-auto">
                   <table className="w-full text-sm text-left"><thead className="bg-slate-50 font-bold border-b"><tr><th className="py-4 px-4 text-center">No</th><th className="py-4 px-4">Pertanyaan</th><th className="py-4 px-4 text-center text-emerald-600">B</th><th className="py-4 px-4 text-center text-red-600">S</th><th className="py-4 px-4 text-center text-amber-600">K</th><th className="py-4 px-4 text-center">% Benar</th></tr></thead>
                   <tbody>{data.map((d, i) => (<tr key={d.id} className="border-b hover:bg-slate-50"><td className="py-3 px-4 text-center font-bold text-slate-500">{i+1}</td><td className="py-3 px-4 font-medium max-w-xs truncate"><div dangerouslySetInnerHTML={{__html: d.question}} className="line-clamp-1"/></td><td className="py-3 px-4 text-center font-black text-emerald-600">{d.b}</td><td className="py-3 px-4 text-center font-black text-red-600">{d.s}</td><td className="py-3 px-4 text-center font-black text-amber-600">{d.k}</td><td className="py-3 px-4 text-center font-black text-slate-700">{d.p}%</td></tr>))}</tbody></table>
                 </div>
              </AdminLayout>
            );
          };

          const AdminReports = () => (
             <AdminLayout title="Laporan & Print">
               <div className="mb-6 flex justify-end"><button onClick={()=>window.print()} className="bg-slate-800 text-white px-5 py-2.5 rounded-xl font-bold shadow-md print:hidden"><Printer size={18} className="inline mr-2"/> Cetak Laporan (F4)</button></div>
               <div className="bg-white border shadow-xl mx-auto w-full max-w-[21.5cm] min-h-[33cm] p-12 print-container rounded-sm">
                   <div className="text-center border-b-4 border-slate-800 pb-6 mb-8"><h1 className="text-3xl font-black uppercase text-slate-900 mb-2">Laporan Hasil Ujian Database</h1><p className="text-slate-600 font-bold">Periode: {new Date().toLocaleDateString('id-ID')}</p></div>
                   <table className="w-full text-base text-left border-collapse border border-slate-800"><thead className="bg-slate-100 text-slate-900"><tr><th className="border border-slate-800 py-3 px-3 w-12 text-center font-black">No</th><th className="border border-slate-800 py-3 px-4 font-black">Nama Lengkap</th><th className="border border-slate-800 py-3 px-4 font-black">Asal Sekolah</th><th className="border border-slate-800 py-3 px-4 text-center font-black">Nilai</th></tr></thead>
                   <tbody>{results.map((r, i) => (<tr key={i}><td className="border border-slate-800 py-2.5 px-3 text-center font-bold">{i+1}</td><td className="border border-slate-800 py-2.5 px-4 font-bold">{r.participant?.name}</td><td className="border border-slate-800 py-2.5 px-4 font-medium">{r.participant?.school}</td><td className="border border-slate-800 py-2.5 px-4 text-center font-black text-lg bg-slate-50">{r.score}</td></tr>))}</tbody></table>
               </div>
             </AdminLayout>
          );

          const AdminPublish = () => (
             <AdminLayout title="Panduan Deploy GitHub">
                <div className="max-w-3xl bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                   <h2 className="text-2xl font-black text-slate-800 mb-4 flex items-center"><CloudUploadAlt size={32} className="mr-3 text-blue-600"/> Cara Deploy Otomatis</h2>
                   <div className="prose text-slate-600 font-medium space-y-4">
                      <p>Kini Anda menggunakan <strong>Supabase</strong> sebagai server *backend*. Anda <strong>TIDAK PERLU</strong> mendownload file ini lagi setiap kali membuat soal baru!</p>
                      <ul className="list-decimal pl-5 space-y-2">
                        <li>Pastikan Kunci Supabase Anda sudah tertulis permanen di <code>baris 85</code> file HTML ini.</li>
                        <li>Upload (Commit) file HTML ini ke repositori <strong>GitHub</strong> Anda (misal: repositori <code>cbt-ujian</code>).</li>
                        <li>Buka menu <strong>Settings</strong> di repositori GitHub tersebut, pilih <strong>Pages</strong>, lalu setel <em>Branch</em> menjadi <strong>main</strong> dan klik Save.</li>
                        <li>Dalam 2 menit, link CBT Anda akan aktif secara publik! Setiap soal atau token yang Anda buat di menu Admin ini akan <strong>otomatis langsung muncul di layar siswa</strong> tanpa perlu mengubah file GitHub lagi!</li>
                      </ul>
                   </div>
                </div>
             </AdminLayout>
          );

          switch (currentRoute) {
            case '/': case '/login': return <ParticipantLogin />;
            case '/identity': return <ParticipantIdentity />;
            case '/instruction': return <ParticipantInstruction />;
            case '/exam': return <ExamEngine />;
            case '/review': return <ExamReview />;
            case '/submitted': return <ExamSubmitted />;
            case '/admin': case '/admin/login': return <AdminLogin />;
            case '/admin/dashboard': return <AdminDashboard />;
            case '/admin/tokens': return <AdminTokens />;
            case '/admin/results': return <AdminResults />;
            case '/admin/analysis': return <AdminAnalysis />;
            case '/admin/questions': return <AdminQuestions />;
            case '/admin/reports': return <AdminReports />;
            case '/admin/publish': return <AdminPublish />;
            default: return <ParticipantLogin />;
          }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
